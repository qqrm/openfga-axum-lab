services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: authzlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: authzlab
    volumes:
      - database:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-create-openfga.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authzlab -d authzlab"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [lab]
  fga-migrate:
    image: openfga/openfga:v1.10.3
    depends_on:
      postgres:
        condition: service_healthy
    environment: &fga-db
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://authzlab:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
    command: migrate
    networks: [lab]
  openfga:
    image: openfga/openfga:v1.10.3
    depends_on:
      fga-migrate:
        condition: service_completed_successfully
    environment: *fga-db
    command: run
    networks: [lab]
  bootstrap:
    build:
      context: .
      args:
        FGA_TRANSPORT: ${FGA_TRANSPORT:-http}
    image: openfga-axum-lab:local
    depends_on: [openfga]
    # Only initialization writes the shared configuration volume.
    user: "0:0"
    entrypoint: ["/usr/local/bin/lab-tool"]
    command: ["bootstrap"]
    environment:
      FGA_URL: http://openfga:8080
      FGA_CONFIG: /data/config.json
    volumes:
      - ./fga:/app/fga:ro
      - fga-config:/data
    networks: [lab]
  app:
    build:
      context: .
      args:
        FGA_TRANSPORT: ${FGA_TRANSPORT:-http}
    image: openfga-axum-lab:local
    environment:
      DATABASE_URL: postgres://authzlab:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/authzlab?sslmode=disable
      FGA_URL: ${FGA_APP_URL:-http://openfga:8080}
      FGA_CONFIG: /data/config.json
      DEMO_SEED: "true"
      DEMO_MIGRATE: "true"
      FGA_HTTP_URL: http://openfga:8080
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - fga-config:/data:ro
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks: [lab]
networks:
  lab:
volumes:
  database:
  fga-config:
