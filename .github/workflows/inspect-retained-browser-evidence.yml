name: Inspect retained browser evidence 43388600974
on:
  push:
    branches: [diag/read-browser-evidence-43388600974]
    paths: [.github/workflows/inspect-retained-browser-evidence.yml]
permissions:
  actions: read
jobs:
  inspect:
    if: github.repository == 'qqrm/openfga-axum-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read one completed artifact; do not execute its contents
        shell: bash
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          EVIDENCE_ARTIFACT_ID: '14022525580'
          EVIDENCE_ZIP_BYTES: '260792741'
          EVIDENCE_ZIP_SHA256: '972dd8399bb8cc85f75412d824f14a02241dbec4bff7cb76afafa9edf98a9900'
        run: |
          python3 - <<'PY'
          import collections, hashlib, json, os, re, tempfile, urllib.error, urllib.request, uuid, zipfile
          from urllib.parse import urlsplit

          REPO = "qqrm/openfga-axum-lab"
          RUN = 43388600974
          HEAD = "5d18ed2fda49fe84a9ac03c7b8571940f0891819"
          NAME = "pages-browser-vm-evidence"
          AID = int(os.environ["EVIDENCE_ARTIFACT_ID"])
          SIZE = int(os.environ["EVIDENCE_ZIP_BYTES"])
          SHA = os.environ["EVIDENCE_ZIP_SHA256"]

          def require(ok, message):
              if not ok:
                  raise SystemExit(message)

          require(AID > 0 and 0 < SIZE <= 512 * 1024**2 and re.fullmatch(r"[0-9a-f]{64}", SHA),
                  "Fill immutable artifact pins after the source run completes; ZIP budget is 512 MiB")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          def request(path):
              return urllib.request.Request("https://api.github.com/repos/" + REPO + path, headers={
                  "Authorization": "Bearer " + os.environ["ARTIFACT_READ_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "retained-artifact-inspector"})

          def api(path):
              try:
                  with opener.open(request(path), timeout=20) as response:
                      raw = response.read(1024**2 + 1)
              except urllib.error.HTTPError as error:
                  raise SystemExit("GitHub metadata HTTP " + str(error.code)) from None
              require(len(raw) <= 1024**2, "Metadata response exceeded its budget")
              return json.loads(raw)

          run = api("/actions/runs/" + str(RUN))
          require(run["status"] == "completed" and run["head_sha"] == HEAD and run["run_attempt"] == 1
                  and run["event"] == "pull_request" and run["conclusion"] == "failure",
                  "Source run identity/status/attempt mismatch")
          artifact = api("/actions/artifacts/" + str(AID))
          require(artifact["id"] == AID and artifact["name"] == NAME and not artifact["expired"],
                  "Artifact identity mismatch")
          require(artifact["workflow_run"]["id"] == RUN and artifact["workflow_run"]["head_sha"] == HEAD,
                  "Artifact does not belong to the pinned source run")
          require(artifact["size_in_bytes"] == SIZE and artifact["digest"] == "sha256:" + SHA,
                  "Artifact size/digest changed")

          try:
              opener.open(request("/actions/artifacts/" + str(AID) + "/zip"), timeout=20)
              raise SystemExit("Expected the artifact download redirect")
          except urllib.error.HTTPError as error:
              require(error.code == 302, "Artifact download redirect was not HTTP 302")
              location = error.headers.get("Location", "")
              error.close()
          storage = urlsplit(location)
          host = storage.hostname or ""
          require(storage.scheme == "https" and storage.port in (None, 443)
                  and storage.username is None and storage.password is None
                  and (host.endswith(".blob.core.windows.net") or host.endswith(".actions.githubusercontent.com")),
                  "Unexpected artifact storage host or scheme")

          used = 0
          def emit(label, value):
              global used
              text = json.dumps({"label": label, "value": value}, ensure_ascii=True)
              if len(text) > 12000:
                  text = json.dumps({"label": label, "truncated": True, "json_prefix": text[:5500]})
              used += len(text.encode()) + 1
              require(used <= 160 * 1024, "Diagnostic output budget exhausted")
              print(text, flush=True)

          with tempfile.TemporaryFile() as archive:
              digest = hashlib.sha256()
              size = 0
              try:
                  # No Authorization header is forwarded to artifact storage.
                  with opener.open(urllib.request.Request(location), timeout=30) as response:
                      while block := response.read(1024**2):
                          size += len(block)
                          require(size <= SIZE, "ZIP exceeded its pinned size")
                          digest.update(block)
                          archive.write(block)
              except urllib.error.HTTPError as error:
                  raise SystemExit("Artifact storage HTTP " + str(error.code)) from None
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit("Artifact storage network failure") from None
              require(size == SIZE and digest.hexdigest() == SHA, "ZIP byte integrity mismatch")
              archive.seek(0)
              stop = uuid.uuid4().hex
              print("::stop-commands::" + stop)
              try:
                  with zipfile.ZipFile(archive) as package:
                      names = package.namelist()
                      require(len(names) <= 10000, "ZIP member-count budget exceeded")
                      require(len(names) == len(set(names)), "Duplicate ZIP member names")
                      require(all(not n.startswith("/") and "\\" not in n and "\x00" not in n
                                  and ".." not in n.split("/") for n in names),
                              "Unsafe ZIP member name")
                      emit("source", {"run": RUN, "head": HEAD, "conclusion": run["conclusion"],
                                      "artifact": AID, "bytes": size, "sha256": SHA,
                                      "zip_members": len(names), "acceptance_verified": False})

                      def member(suffix, limit):
                          matches = [n for n in names if n == suffix or n.endswith("/" + suffix)]
                          if len(matches) != 1:
                              emit("unavailable_member", {"suffix": suffix, "matches": len(matches)})
                              return None
                          info = package.getinfo(matches[0])
                          if info.file_size > limit:
                              emit("oversize_member", {"name": info.filename, "bytes": info.file_size})
                              return None
                          with package.open(info) as part:
                              raw = part.read(limit + 1)
                          require(len(raw) == info.file_size and len(raw) <= limit, "Member exceeded its read budget")
                          emit("member", {"name": info.filename, "bytes": len(raw),
                                          "sha256": hashlib.sha256(raw).hexdigest()})
                          return raw

                      for suffix in ["browser-openfga/build.json", "browser-emulator/build.json",
                                     "runtime/derived-runtime.json", "runtime/startup-manifest.json"]:
                          raw = member(suffix, 4 * 1024**2)
                          if raw is not None:
                              emit(suffix, json.loads(raw))

                      for engine in ["chromium", "firefox"]:
                          data = {}
                          raw = member("browser-wasm/" + engine + ".json", 4 * 1024**2)
                          if raw is not None:
                              data = json.loads(raw)
                              selected = {k: data.get(k) for k in [
                                  "engine", "browser", "passed", "passes", "failure", "pageErrors",
                                  "startedAt", "finishedAt", "logCapture", "screenshotError"]}
                              if isinstance(selected.get("failure"), str):
                                  selected["failure_truncated"] = len(selected["failure"]) > 1600
                                  selected["failure"] = selected["failure"][:1600]
                              guest = data.get("guest") or {}
                              selected["guest"] = {k: guest.get(k) for k in [
                                  "booted", "ready", "accepted", "checks", "statuses", "passes", "error", "vm", "source"]}
                              emit(engine + ".result", selected)

                          raw = member("browser-wasm/" + engine + "-console.txt", 16 * 1024**2)
                          if raw is None:
                              continue
                          stream = member("browser-wasm/" + engine + "-stream.jsonl", 64 * 1024**2)
                          if stream is not None:
                              def js_utf8(value):
                                  return value.encode("utf-16-le", "surrogatepass").decode("utf-16-le", "replace").encode("utf-8")
                              texts, count, batches, encoded_bytes = [], 0, 0, 0
                              rows = stream.decode("utf-8").split("\n")
                              require(rows[-1] == "", "Unterminated JSONL stream")
                              for row in rows[:-1]:
                                  record = json.loads(row)
                                  values = record.get("texts")
                                  require(record.get("firstSequence") == count + 1 and isinstance(values, list) and len(values) > 0,
                                          "Invalid captured batch sequence")
                                  batches += 1
                                  for value in values:
                                      require(isinstance(value, str), "Non-string captured chunk")
                                      count += 1
                                      encoded_bytes += len(js_utf8(value))
                                      require(count <= 1000000 and encoded_bytes <= 16 * 1024**2, "Captured stream exceeded bounds")
                                      texts.append(value)
                              capture = data.get("logCapture") or {}
                              emit(engine + ".stream_integrity", {
                                  "format_matches": capture.get("format") == "browser-lab-log-batches-v1",
                                  "reconstructed_console_equal": js_utf8("".join(texts)) == raw,
                                  "chunks": count, "batches": batches, "encoded_chunk_bytes": encoded_bytes,
                                  "metadata_counts_match": [capture.get(k) for k in ["chunks", "batches", "bytes"]] == [count, batches, encoded_bytes],
                                  "recorded_cutoff_matches": capture.get("expectedSequence") == count,
                                  "recorded_complete": capture.get("complete"), "recorded_error": capture.get("error")})
                          text = raw.decode("utf-8", errors="replace")
                          first, tail, qemu_tail = [], collections.deque(maxlen=36), collections.deque(maxlen=2)
                          decode_first, decode_tail = [], collections.deque(maxlen=4)
                          matches = 0
                          pattern = re.compile(r"LAB[|_]|model_decode|payload|ReadAuthorizationModel|resolver|phase|rpc|duration|bootstrap|postgres|openfga|axum|gateway|ready|listen|migration|fatal|panic|deadline|timed out|error", re.I)
                          for number, line in enumerate(text.split("\n"), 1):
                              if "model_decode" in line:
                                  item = (number, line)
                                  if len(decode_first) < 4:
                                      decode_first.append(item)
                                  decode_tail.append(item)
                              if "[browser-qemu]" in line:
                                  qemu_tail.append((number, line))
                                  if not re.search(r"error|exception|out of memory|panic", line, re.I):
                                      continue
                              if pattern.search(line):
                                  matches += 1
                                  item = (number, line)
                                  if len(first) < 12:
                                      first.append(item)
                                  tail.append(item)
                          chosen = dict(first + list(tail) + decode_first + list(decode_tail))
                          emit(engine + ".selection", {"matched_lines": matches, "selected_lines": len(chosen),
                                                        "utf8_replacement_present": "\ufffd" in text})
                          for number, line in sorted(chosen.items()):
                              emit(engine + ".service", {"line": number, "text": line[:800],
                                                         "truncated": len(line) > 800})
                          for number, line in qemu_tail:
                              emit(engine + ".last_qemu", {"line": number, "text": line[:2000],
                                                           "truncated": len(line) > 2000})
              finally:
                  print("::" + stop + "::")
          PY
