name: Inspect retained browser evidence 43402635950
on:
  push:
    branches: [diag/read-browser-evidence-43402635950]
    paths: [.github/workflows/inspect-retained-browser-evidence.yml]
permissions:
  actions: read
jobs:
  inspect:
    if: github.repository == 'qqrm/openfga-axum-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read one completed artifact; do not execute its contents
        shell: bash
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          EVIDENCE_ARTIFACT_ID: '14029511154' # Fill only from the completed run.
          EVIDENCE_ZIP_BYTES: '260830150'
          EVIDENCE_ZIP_SHA256: '73e4c4d2f2204ef4da0450e472b50ffb507e52b6a46fe55e0cab153b4fa3976e'
          EVIDENCE_RUN_CONCLUSION: 'failure'
        run: |
          python3 - <<'PY'
          import base64, collections, hashlib, json, os, re, tempfile, urllib.error, urllib.request, uuid, zipfile
          from urllib.parse import urlsplit

          REPO = "qqrm/openfga-axum-lab"
          RUN = 43402635950
          HEAD = "379e3280c2a1c789071292af141648eb2fc3ffbc"
          NAME = "pages-browser-vm-evidence"
          AID = int(os.environ["EVIDENCE_ARTIFACT_ID"])
          SIZE = int(os.environ["EVIDENCE_ZIP_BYTES"])
          SHA = os.environ["EVIDENCE_ZIP_SHA256"]
          CONCLUSION = os.environ["EVIDENCE_RUN_CONCLUSION"]
          EXPECTED_STATUSES = [403, 204, 200, 204, 403]
          EXPECTED_ENTRYPOINT = {"bytes": 5019, "sha256": "7763b800c5f4bed8df12c6498b13474ef6adafdc4442694b7271f0b16fe3f5ed"}
          EXPECTED_CAPTURE_MEMBERS = {"chromium":{"console":{"bytes":61889,"sha256":"49be06a6330c0cc02210928e1442b515ae873fb8b2edb5b6cb63d3c3a051a2a5"},"stream":{"bytes":660899,"sha256":"3236655bc22d2cb68a9bdf947aae272e6caa2228ce3612a9c781b41c11ab0517"}},"firefox":{"console":{"bytes":262137,"sha256":"11922e702b45ecb9afe75d592b4b643ee71e1554a7b6add7ad50756c193f15eb"},"stream":{"bytes":691761,"sha256":"a99056aa8898b008ad123fed78067f23bd461b32e7292ea758b4395161b582d9"}}}

          def require(ok, message):
              if not ok:
                  raise SystemExit(message)

          require(AID > 0 and 0 < SIZE <= 512 * 1024**2 and re.fullmatch(r"[0-9a-f]{64}", SHA)
                  and CONCLUSION in ("success", "failure", "cancelled", "timed_out"),
                  "Fill immutable artifact pins after the source run completes; ZIP budget is 512 MiB")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          def request(path):
              return urllib.request.Request("https://api.github.com/repos/" + REPO + path, headers={
                  "Authorization": "Bearer " + os.environ["ARTIFACT_READ_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "retained-artifact-inspector"})

          def api(path):
              try:
                  with opener.open(request(path), timeout=20) as response:
                      raw = response.read(1024**2 + 1)
              except urllib.error.HTTPError as error:
                  raise SystemExit("GitHub metadata HTTP " + str(error.code)) from None
              require(len(raw) <= 1024**2, "Metadata response exceeded its budget")
              return json.loads(raw)

          run = api("/actions/runs/" + str(RUN))
          require(run["id"] == RUN and run["status"] == "completed" and run["head_sha"] == HEAD and run["run_attempt"] == 1
                  and run["event"] == "pull_request" and run["conclusion"] == CONCLUSION,
                  "Source run identity/status/attempt mismatch")
          artifact = api("/actions/artifacts/" + str(AID))
          require(artifact["id"] == AID and artifact["name"] == NAME and not artifact["expired"],
                  "Artifact identity mismatch")
          require(artifact["workflow_run"]["id"] == RUN and artifact["workflow_run"]["head_sha"] == HEAD,
                  "Artifact does not belong to the pinned source run")
          require(artifact["size_in_bytes"] == SIZE and artifact["digest"] == "sha256:" + SHA,
                  "Artifact size/digest changed")

          try:
              opener.open(request("/actions/artifacts/" + str(AID) + "/zip"), timeout=20)
              raise SystemExit("Expected the artifact download redirect")
          except urllib.error.HTTPError as error:
              require(error.code == 302, "Artifact download redirect was not HTTP 302")
              location = error.headers.get("Location", "")
              error.close()
          storage = urlsplit(location)
          host = storage.hostname or ""
          require(storage.scheme == "https" and storage.port in (None, 443)
                  and storage.username is None and storage.password is None
                  and (host.endswith(".blob.core.windows.net") or host.endswith(".actions.githubusercontent.com")),
                  "Unexpected artifact storage host or scheme")

          used = 0
          def emit(label, value):
              global used
              text = json.dumps({"label": label, "value": value}, ensure_ascii=True)
              if len(text) > 12000:
                  text = json.dumps({"label": label, "truncated": True, "json_prefix": text[:5500]})
              used += len(text.encode()) + 1
              require(used <= 3 * 1024**2, "Diagnostic output budget exhausted")
              print(text, flush=True)

          with tempfile.TemporaryFile() as archive:
              digest = hashlib.sha256()
              size = 0
              try:
                  # No Authorization header is forwarded to artifact storage.
                  with opener.open(urllib.request.Request(location), timeout=30) as response:
                      while block := response.read(1024**2):
                          size += len(block)
                          require(size <= SIZE, "ZIP exceeded its pinned size")
                          digest.update(block)
                          archive.write(block)
              except urllib.error.HTTPError as error:
                  raise SystemExit("Artifact storage HTTP " + str(error.code)) from None
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit("Artifact storage network failure") from None
              require(size == SIZE and digest.hexdigest() == SHA, "ZIP byte integrity mismatch")
              archive.seek(0)
              stop = uuid.uuid4().hex
              print("::stop-commands::" + stop)
              try:
                  with zipfile.ZipFile(archive) as package:
                      names = package.namelist()
                      require(len(names) <= 10000, "ZIP member-count budget exceeded")
                      require(len(names) == len(set(names)), "Duplicate ZIP member names")
                      require(all(not n.startswith("/") and "\\" not in n and "\x00" not in n
                                  and ".." not in n.split("/") for n in names),
                              "Unsafe ZIP member name")
                      emit("source", {"run": RUN, "head": HEAD, "conclusion": run["conclusion"],
                                      "artifact": AID, "bytes": size, "sha256": SHA,
                                      "zip_members": len(names), "scope": "retained evidence validation; no guest execution"})

                      def member(suffix, limit):
                          matches = [n for n in names if n == suffix or n.endswith("/" + suffix)]
                          if len(matches) != 1:
                              emit("unavailable_member", {"suffix": suffix, "matches": len(matches)})
                              return None
                          info = package.getinfo(matches[0])
                          if info.file_size > limit:
                              emit("oversize_member", {"name": info.filename, "bytes": info.file_size})
                              return None
                          with package.open(info) as part:
                              raw = part.read(limit + 1)
                          require(len(raw) == info.file_size and len(raw) <= limit, "Member exceeded its read budget")
                          emit("member", {"name": info.filename, "bytes": len(raw),
                                          "sha256": hashlib.sha256(raw).hexdigest()})
                          return raw

                      metadata, metadata_sha = {}, {}
                      for suffix in ["browser-openfga/build.json", "browser-emulator/build.json",
                                     "runtime/derived-runtime.json", "runtime/startup-manifest.json"]:
                          raw = member(suffix, 4 * 1024**2)
                          if raw is not None:
                              metadata[suffix] = json.loads(raw)
                              require(isinstance(metadata[suffix], dict), "Metadata is not a JSON object")
                              metadata_sha[suffix] = hashlib.sha256(raw).hexdigest()
                              emit(suffix, metadata[suffix])
                      startup = metadata.get("runtime/startup-manifest.json", {})
                      derived = metadata.get("runtime/derived-runtime.json", {})
                      provenance = {
                          "all_metadata_present": len(metadata) == 4,
                          "base_source": startup.get("base_source_commit") == derived.get("source") ==
                              "99f00cc170ca611ff4dc4c4ae3bbe98bb10cff58",
                          "entrypoint_is_uds_candidate": startup.get("files", {}).get("entrypoint.sh") == EXPECTED_ENTRYPOINT,
                          "retained_manifest_digest": derived.get("startup_overlay", {}).get("sha256") ==
                              metadata_sha.get("runtime/startup-manifest.json") and
                              "runtime/startup-manifest.json" in metadata_sha,
                          "openfga_build_bound": startup.get("openfga_build") ==
                              metadata.get("browser-openfga/build.json") and "browser-openfga/build.json" in metadata,
                          "emulator_build_bound": startup.get("emulator_build") == derived.get("emulator_build") ==
                              metadata.get("browser-emulator/build.json") and "browser-emulator/build.json" in metadata,
                          "original_model": startup.get("openfga_build", {}).get("warmup_model_sha256") ==
                              "a894f61fb40563467d0a16409981acb14224c619073f39c42dca233609a78e6d",
                          "authorization_deadline_unchanged": startup.get("openfga_build", {}).get(
                              "authorization_request_timeout_default_seconds") == 3,
                      }
                      emit("provenance_validation", provenance)
                      engine_validation, raw_lab_corroboration = {}, {}

                      for engine in ["chromium", "firefox"]:
                          data, integrity = {}, {"available": False}
                          raw = member("browser-wasm/" + engine + ".json", 4 * 1024**2)
                          if raw is not None:
                              data = json.loads(raw)
                              require(isinstance(data, dict), "Browser result is not a JSON object")
                              selected = {k: data.get(k) for k in [
                                  "engine", "browser", "passed", "passes", "failure", "pageErrors",
                                  "startedAt", "finishedAt", "logCapture", "screenshotError"]}
                              if isinstance(selected.get("failure"), str):
                                  selected["failure_truncated"] = len(selected["failure"]) > 1600
                                  selected["failure"] = selected["failure"][:1600]
                              guest = data.get("guest") or {}
                              selected["guest"] = {k: guest.get(k) for k in [
                                  "booted", "ready", "accepted", "checks", "statuses", "passes", "error", "vm", "source"]}
                              emit(engine + ".result", selected)

                          raw = member("browser-wasm/" + engine + "-console.txt", 8 * 1024**2)
                          if raw is None:
                              continue
                          stream = member("browser-wasm/" + engine + "-stream.jsonl", 64 * 1024**2)
                          if stream is not None:
                              def js_utf8(value):
                                  return value.encode("utf-16-le", "surrogatepass").decode("utf-16-le", "replace").encode("utf-8")
                              texts, count, batches, encoded_bytes = [], 0, 0, 0
                              rows = stream.decode("utf-8").split("\n")
                              require(rows[-1] == "", "Unterminated JSONL stream")
                              for row in rows[:-1]:
                                  record = json.loads(row)
                                  values = record.get("texts")
                                  require(record.get("firstSequence") == count + 1 and isinstance(values, list) and len(values) > 0,
                                          "Invalid captured batch sequence")
                                  batches += 1
                                  for value in values:
                                      require(isinstance(value, str), "Non-string captured chunk")
                                      count += 1
                                      encoded_bytes += len(js_utf8(value))
                                      require(count <= 1000000 and encoded_bytes <= 16 * 1024**2, "Captured stream exceeded bounds")
                                      texts.append(value)
                              capture = data.get("logCapture") or {}
                              integrity = {
                                  "format_matches": capture.get("format") == "browser-lab-log-batches-v1",
                                  "reconstructed_console_equal": js_utf8("".join(texts)) == raw,
                                  "chunks": count, "batches": batches, "encoded_chunk_bytes": encoded_bytes,
                                  "metadata_counts_match": [capture.get(k) for k in ["chunks", "batches", "bytes"]] == [count, batches, encoded_bytes],
                                  "recorded_cutoff_matches": capture.get("expectedSequence") == count,
                                  "recorded_complete": capture.get("complete"), "recorded_error": capture.get("error")}
                              emit(engine + ".stream_integrity", integrity)
                          # Fixed, independently verified captures only. This emits data,
                          # never artifact code, for host/guest clock correlation.
                          for kind, payload in [("console", raw), ("stream", stream)]:
                              require(isinstance(payload, bytes), "Missing pinned capture member")
                              expected = EXPECTED_CAPTURE_MEMBERS[engine][kind]
                              require(len(payload) == expected["bytes"] and
                                  hashlib.sha256(payload).hexdigest() == expected["sha256"],
                                  "Pinned capture member byte identity changed")
                              encoded = base64.b64encode(payload).decode("ascii")
                              emit(engine + ".full_" + kind, {**expected, "encoding": "base64",
                                  "encoded_characters": len(encoded)})
                              for offset in range(0, len(encoded), 4096):
                                  emit(engine + ".full_" + kind + "_chunk", {"offset": offset,
                                      "base64": encoded[offset:offset + 4096]})
                          text = raw.decode("utf-8")
                          # Validate full records. Mixed console LAB lines are corroboration only:
                          # the pinned page parser consumes PTY bytes separately from emulator stderr.
                          guest = data.get("guest") or {}
                          require(isinstance(guest, dict), "Guest evidence is not a JSON object")
                          passes = guest.get("passes")
                          pass_ok = isinstance(passes, list) and len(passes) == 2 and all(
                              isinstance(p, dict) and type(p.get("id")) is int and p.get("id") == index and
                              p.get("accepted") is True and p.get("statuses") == EXPECTED_STATUSES
                              for index, p in enumerate(passes, 1))
                          labs, kinds, wire_passes, wire_errors = [], [], [], []
                          lines = text.replace("\r", "").split("\n")
                          for number, line in enumerate(lines[:-1], 1):
                              if not line.startswith("LAB|"):
                                  continue
                              record = {"line": number, "bytes": len(line.encode("utf-8"))}
                              if line in ("LAB|boot", "LAB|ready"):
                                  record["kind"] = line[4:]
                              elif line.startswith("LAB|verification-start"):
                                  match = re.fullmatch(r"LAB\|verification-start\|([1-9][0-9]*)", line)
                                  record["kind"] = "start"
                                  record["id"] = int(match[1]) if match else None
                                  if not match: wire_errors.append(number)
                              elif line.startswith("LAB|result"):
                                  match = re.fullmatch(r"LAB\|result\|([1-9][0-9]*)\|(.*)", line)
                                  record["kind"] = "result"
                                  record["id"] = int(match[1]) if match else None
                                  try:
                                      result = json.loads(match[2]) if match else None
                                      if not isinstance(result, dict): raise ValueError("Invalid result object")
                                      wire_passes.append({**result, "id": record["id"]})
                                      record.update({"accepted": result.get("accepted"), "statuses": result.get("statuses"),
                                                     "payload_sha256": hashlib.sha256(match[2].encode()).hexdigest()})
                                  except (ValueError, TypeError, KeyError):
                                      wire_errors.append(number)
                              else:
                                  record["kind"] = "other"
                                  record["text"] = line[:600]
                                  record["truncated"] = len(line) > 600
                              kinds.append((record["kind"], record.get("id")))
                              labs.append(record)
                          expected_kinds = [("boot", None), ("ready", None), ("start", 1),
                                            ("result", 1), ("start", 2), ("result", 2)]
                          # stdout may omit explicit middle markers; validation used them all.
                          chosen_labs = {x["line"]: x for x in labs[:8] + labs[-8:]}
                          emit(engine + ".lab_selection", {"total": len(labs), "emitted": len(chosen_labs),
                                                           "omitted_middle": len(labs) - len(chosen_labs),
                                                           "partial_final_line": bool(lines[-1])})
                          for number in sorted(chosen_labs):
                              emit(engine + ".lab", chosen_labs[number])
                          raw_match = not wire_errors and kinds == expected_kinds and wire_passes == passes
                          raw_lab_corroboration[engine] = {
                              "status": "matched" if raw_match else "indeterminate",
                              "exact_observed_frames_match": raw_match,
                              "malformed_observed_lines": wire_errors[:8] + wire_errors[-8:] if len(wire_errors) > 16 else wire_errors,
                              "malformed_observed_line_count": len(wire_errors),
                              "scope": "mixed serial and emulator console, not an isolated PTY transcript",
                              "limitation": "Unlabeled channels can interleave. No text is stripped to infer missing successes.",
                          }
                          emit(engine + ".raw_lab_corroboration", raw_lab_corroboration[engine])
                          vm = guest.get("vm") or {}
                          require(isinstance(vm, dict), "VM evidence is not a JSON object")
                          capture_ok = integrity.get("format_matches") is True and all(
                              integrity.get(key) is True for key in ["reconstructed_console_equal",
                              "metadata_counts_match", "recorded_cutoff_matches", "recorded_complete"]) and (
                              integrity.get("recorded_error") is None)
                          validation = {
                              "engine_matches": data.get("engine") == engine,
                              "browser_version_recorded": isinstance(data.get("browser"), str) and bool(data["browser"]),
                              "passed_without_failure": data.get("passed") is True and "failure" not in data,
                              "no_page_errors": data.get("pageErrors") == [],
                              "guest_ready_and_accepted": all(guest.get(key) is True for key in ["booted", "ready", "accepted"])
                                  and guest.get("checks") == 2 and guest.get("statuses") == EXPECTED_STATUSES,
                              "guest_has_no_error_or_pending_request": not any(key in guest for key in ["error", "pending", "requested"]),
                              "two_pass_objects": pass_ok and data.get("passes") == passes,
                              "full_capture": capture_ok,
                              "observed_manifest_bound": len(metadata) == 4 and guest.get("startupManifest") == startup,
                              "observed_source_matches": guest.get("source") == startup.get("base_source_commit") ==
                                  "99f00cc170ca611ff4dc4c4ae3bbe98bb10cff58",
                              "observed_vm_configuration": vm.get("cpus") == 2 and vm.get("memoryMiB") == 512 and
                                  vm.get("cpuTopology") == "2,sockets=2,cores=1,threads=1" and vm.get("kernelLogLevel") == 7 and
                                  type(vm.get("reportedLogicalCPUs")) is int and vm["reportedLogicalCPUs"] >= 2 and
                                  vm.get("qemuLiveInstanceLimit") == (8192 if engine == "firefox" else 15000),
                              "provenance_valid": all(provenance.values()),
                          }
                          engine_validation[engine] = validation
                          emit(engine + ".acceptance_validation", validation)

                          first, tail, qemu_tail = [], collections.deque(maxlen=36), collections.deque(maxlen=2)
                          decode_first, decode_tail = [], collections.deque(maxlen=4)
                          error_first, error_tail = [], collections.deque(maxlen=4)
                          matches = fault_count = 0
                          pattern = re.compile(r"LAB[|_]|model_decode|payload|ReadAuthorizationModel|resolver|phase|rpc|duration|bootstrap|postgres|openfga|axum|gateway|ready|listen|migration|fatal|panic|deadline|timed out|error", re.I)
                          fault = re.compile(r"LAB\|(?:boot-failed|verification-failed|service-failed)|\b(?:ERROR|FATAL|panic|[A-Za-z]*Error)\b|instantiate_throw|out of memory|Elapsed\(\(\)\)|context canceled|deadline exceeded|timed out|TimeoutError|failed=true|context_state=\"(?:canceled|deadline|deadline_exceeded)\"|error_kind=\"(?!none\")[^\"]+\"|rpc_end.*status=\"(?!OK\")[^\"]+\"", re.I)
                          for number, line in enumerate(lines, 1):
                              if "model_decode" in line:
                                  item = (number, line)
                                  if len(decode_first) < 4: decode_first.append(item)
                                  decode_tail.append(item)
                              if fault.search(line):
                                  fault_count += 1
                                  item = (number, line)
                                  if len(error_first) < 4: error_first.append(item)
                                  error_tail.append(item)
                              if "[browser-qemu]" in line:
                                  qemu_tail.append((number, line))
                                  if not fault.search(line): continue
                              if pattern.search(line) or fault.search(line):
                                  matches += 1
                                  item = (number, line)
                                  if len(first) < 12: first.append(item)
                                  tail.append(item)
                          chosen = {number: line for number, line in first + list(tail) + decode_first + list(decode_tail)}
                          chosen_errors = {number: line for number, line in error_first + list(error_tail)}
                          emit(engine + ".selection", {"matched_lines": matches, "selected_lines": len(chosen),
                                                        "omitted_middle_lines": matches - len(chosen),
                                                        "fault_lines": fault_count, "selected_fault_lines": len(chosen_errors),
                                                        "omitted_middle_fault_lines": fault_count - len(chosen_errors),
                                                        "utf8_replacement_present": "\ufffd" in text})
                          for label, selected in [("service", chosen), ("fault", chosen_errors)]:
                              for number, line in sorted(selected.items()):
                                  emit(engine + "." + label, {"line": number, "text": line[:600],
                                                             "truncated": len(line) > 600})
                          for number, line in qemu_tail:
                              emit(engine + ".last_qemu", {"line": number, "text": line[:2000],
                                                           "truncated": len(line) > 2000})
                      verified = (CONCLUSION == "success" and set(engine_validation) == {"chromium", "firefox"}
                                  and all(all(checks.values()) for checks in engine_validation.values()))
                      emit("overall", {"scope": "retained evidence only; no new guest execution",
                                       "source_run": RUN, "source_head": HEAD, "source_conclusion": CONCLUSION,
                                       "recorded_browser_acceptance_consistent": verified,
                                       "validation_scope": "pinned source workflow, final page protocol state, exact capture and startup provenance",
                                       "raw_lab_corroboration": {engine: value["status"] for engine, value in raw_lab_corroboration.items()},
                                       "validated_engines": sorted(engine_validation),
                                       "required_passes_per_engine": 2})
              finally:
                  print("::" + stop + "::")
          PY
