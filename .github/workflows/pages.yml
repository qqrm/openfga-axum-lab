name: Browser preview
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - browser-demo/**
      - browser-single/pages/**
      - browser-single/entrypoint.sh
      - browser-single/OpenFGA.Dockerfile
      - browser-single/openfga/**
      - browser-single/qemu/**
      - browser-single/prepare-emulator.mjs
      - browser-single/*.test.mjs
      - browser-single/Kernel.Dockerfile
      - browser-single/prepare-kernel.sh
      - browser-single/repack-runtime.mjs
      - browser-single/prepare-pages.sh
      - browser-single/check-pages.mjs
      - browser-single/check-log-transport.mjs
      - scripts/build-browser-demo.sh
      - scripts/check-browser-demo.mjs
      - src/domain.rs
      - fga/model.json
      - fga/provenance.json
      - fga/upstream/**
      - NOTICE
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - browser-single/pages/**
      - browser-single/entrypoint.sh
      - browser-single/OpenFGA.Dockerfile
      - browser-single/openfga/**
      - browser-single/qemu/**
      - browser-single/prepare-emulator.mjs
      - browser-single/*.test.mjs
      - browser-single/Kernel.Dockerfile
      - browser-single/prepare-kernel.sh
      - browser-single/repack-runtime.mjs
      - browser-single/prepare-pages.sh
      - browser-single/check-pages.mjs
      - browser-single/check-log-transport.mjs
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Pages after browser acceptance (requires separate approval)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-check-{0}', github.ref) || 'github-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - run: bash scripts/build-browser-demo.sh
      - run: node scripts/check-browser-demo.mjs
      - name: Verify the model explorer and guest wrapper
        run: |
          test -s browser-output/domain.wasm
          test -s browser-output/model.json
          grep -Fq 'Lakekeeper authorization model' browser-output/index.html
          if grep -Eiq '(Лапки|/pets/fox|shelter|caregiver)' browser-output/index.html browser-output/app.js; then
            echo 'Obsolete shelter content must not be published' >&2
            exit 1
          fi
          shellcheck browser-single/entrypoint.sh browser-single/prepare-pages.sh browser-single/prepare-kernel.sh browser-single/pages/guest.sh browser-single/openfga/build.sh browser-single/qemu/build.sh
          node --test browser-single/acceptance-protocol.test.mjs browser-single/startup-payload.test.mjs browser-single/runtime-errors.test.mjs browser-single/log-stream.test.mjs browser-single/qemu-budget.test.mjs
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > browser-output/revision.json
      - name: Build and regression-test the bounded OpenFGA startup adaptation
        run: |
          docker buildx build --file browser-single/OpenFGA.Dockerfile \
            --output type=local,dest=artifacts/browser-openfga .
      - name: Build and test bounded emulator retention with room for deferred GC
        run: bash browser-single/qemu/build.sh
      - name: Retain the exact emulator build and source records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-emulator
          path: artifacts/browser-emulator/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare the verified Linux kernel with required PostgreSQL IPC
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash browser-single/prepare-kernel.sh
      - name: Retain the rebuilt kernel and exact configuration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-ipc-kernel
          path: artifacts/browser-kernel/
          if-no-files-found: error
          retention-days: 7
      - name: Restore and verify the pinned browser VM artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash browser-single/prepare-pages.sh
      - name: Install locked browser-test dependencies
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium firefox
      - name: Require actual browser guest acceptance, not native Docker E2E
        run: |
          node browser-single/check-log-transport.mjs
          node browser-single/check-pages.mjs
      - name: Retain browser-VM evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-browser-vm-evidence
          path: |
            artifacts/browser-wasm/
            artifacts/browser-log-transport/
            artifacts/browser-openfga/
            artifacts/browser-emulator/
            browser-output/wasm/runtime-source.zip
            browser-output/wasm/runtime/derived-runtime.json
            browser-output/wasm/runtime/startup-manifest.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
        with:
          path: browser-output
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
