name: Manual Lakekeeper A/A A/B and HTTP tails
on:
  workflow_dispatch:
    inputs:
      crossover:
        description: 'Run both cache-to-container assignments'
        type: boolean
        default: true
      tail_profiles:
        description: 'Measure per-request p50/p95/p99 with concurrency 1, 8, 32'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: lakekeeper-criterion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FGA_TRANSPORT: http
      AUTHZ_BENCH_LOAD_PROFILES: ${{ inputs.tail_profiles }}
      AB_SEED: '2606'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
      - name: Generate isolated secrets
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          DEMO_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$DEMO_PASSWORD"
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "DEMO_PASSWORD=$DEMO_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Compile benchmark and driver
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --example catalog_cache_experiment
          cargo bench --locked --bench catalog_cache_ab --no-run
          cargo build --locked --release --example catalog_cache_experiment
          mapfile -t binaries < <(find target/release/deps -maxdepth 1 -type f -name 'catalog_cache_ab-*' -executable | sort)
          if (( ${#binaries[@]} != 1 )); then
            echo "Expected one Criterion binary; found ${#binaries[@]}" >&2
            exit 1
          fi
          printf 'AUTHZ_BENCH_BINARY=%s\n' "$(realpath "${binaries[0]}")" >> "$GITHUB_ENV"
      - name: Build one image reused across both stacks
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: authz-criterion-${{ github.run_id }}-build
          COMPOSE_FILE: compose.yaml:compose.cache-lakekeeper.yaml
        run: docker compose build app
      - name: Run clean matched studies in crossed order
        shell: bash
        env:
          CROSSOVER: ${{ inputs.crossover }}
        run: |
          set -euo pipefail
          if [[ "$CROSSOVER" == true ]]; then
            if (( GITHUB_RUN_ID % 2 == 0 )); then
              assignments=(primary-on primary-off)
            else
              assignments=(primary-off primary-on)
            fi
          else
            assignments=(primary-on)
          fi
          for variant in "${assignments[@]}"; do
            export COMPOSE_PROJECT_NAME="authz-criterion-${GITHUB_RUN_ID}-${variant}"
            export AUTHZ_EXPERIMENT_OUT="artifacts/criterion-lakekeeper-${variant}"
            if [[ "$variant" == primary-on ]]; then
              export BENCH_PRIMARY_CACHE_ENABLED=true BENCH_SECONDARY_CACHE_ENABLED=false AUTHZ_BENCH_SWAP_PORTS=false
            else
              export BENCH_PRIMARY_CACHE_ENABLED=false BENCH_SECONDARY_CACHE_ENABLED=true AUTHZ_BENCH_SWAP_PORTS=true
            fi
            bash scripts/run-lakekeeper-criterion.sh
          done
      - name: Upload raw results and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lakekeeper-criterion-${{ github.run_id }}
          path: artifacts/criterion-lakekeeper-*/
          if-no-files-found: warn
          retention-days: 7
