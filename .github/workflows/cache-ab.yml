name: Manual authz cache A/B
on: workflow_dispatch
permissions:
  contents: read
jobs:
  cache-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start controlled stack
        run: docker compose -f compose.yaml -f compose.cache-ab.yaml up -d --build app app-uncached
      - name: Verify integration scenarios
        run: docker compose --profile test run --rm test
      - name: Record environment and image digests
        run: |
          mkdir -p artifacts
          docker compose -f compose.yaml -f compose.cache-ab.yaml config > artifacts/compose-resolved.yaml
          docker compose -f compose.yaml -f compose.cache-ab.yaml images > artifacts/images.txt
          docker image inspect $(docker compose -f compose.yaml -f compose.cache-ab.yaml images -q) > artifacts/image-inspect.json
          docker version > artifacts/docker-version.txt
          uname -a > artifacts/uname.txt
          lscpu > artifacts/lscpu.txt
          sha256sum Cargo.lock fga/model.json fga/legacy.json db/init.sql > artifacts/input-hashes.txt
      - name: Measure randomized A/B
        run: python3 scripts/cache-ab.py
      - name: Capture resource and database diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker stats --no-stream --format '{{json .}}' > artifacts/docker-stats.jsonl || true
          docker compose -f compose.yaml -f compose.cache-ab.yaml logs --no-color > artifacts/compose.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: authz-cache-ab
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
      - name: Clean up
        if: always()
        run: docker compose -f compose.yaml -f compose.cache-ab.yaml down -v
