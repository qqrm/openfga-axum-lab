name: Criterion preparation
on:
  workflow_dispatch:
  push:
    branches: [experiment/authz-cache-ab]
    paths:
      - .github/workflows/cache-ab.yml
      - Cargo.toml
      - benches/**
      - examples/**
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - name: Prepare formatted Rust sources
        run: |
          sed -i 's/"writer":\["off","on"\]\[writer_index\]/"writer":(["off","on"][writer_index])/' examples/cache_experiment.rs
          cargo fmt --all
      - name: Compile and lint real Rust targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test benchmark bookkeeping
        run: cargo test --locked --example cache_experiment
      - name: Preserve prepared Git objects without changing any branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          for path in Cargo.lock src/main.rs src/cached_authorizer.rs src/infrastructure.rs src/metrics.rs benches/authz_cache.rs benches/support/mod.rs examples/cache_experiment.rs; do
            sha=$(jq -n --rawfile content "$path" '{content:$content,encoding:"utf-8"}' | gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')
            jq -cn --arg path "$path" --arg sha "$sha" '{path:$path,sha:$sha}' >> artifacts/prepared-blobs.jsonl
          done
          cat artifacts/prepared-blobs.jsonl
          git diff --stat > artifacts/preparation-diff.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: criterion-prepared-sources
          path: |
            Cargo.lock
            benches/
            examples/
            artifacts/
          if-no-files-found: error
