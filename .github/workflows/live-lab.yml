name: Live laboratory (private, temporary)
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Manual testing session length; no automatic restarts'
        type: choice
        options: ['15', '30', '60']
        default: '30'
        required: true
permissions:
  contents: read
concurrency:
  group: live-lab-${{ github.actor }}
  cancel-in-progress: false
jobs:
  laboratory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start and open the protected lab
        env:
          LIVE_LAB_ALLOWED_EMAIL: ${{ secrets.LIVE_LAB_ALLOWED_EMAIL }}
          LIVE_LAB_PASSWORD: ${{ secrets.LIVE_LAB_PASSWORD }}
          LIVE_LAB_MINUTES: ${{ inputs.minutes }}
        run: bash scripts/live-lab.sh start
      - name: Preserve non-secret session identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: live-lab-link-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live-lab.json
          retention-days: 1
          if-no-files-found: error
      - name: Keep the session available
        run: bash scripts/live-lab.sh wait
      - name: Close tunnel and remove only this disposable stand
        if: always()
        run: bash scripts/live-lab.sh stop
