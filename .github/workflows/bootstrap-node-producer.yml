name: Verify the versioned native bootstrap producer
on:
  push:
    branches: [diag/bootstrap-node-producer-379e]
    paths: [.github/workflows/bootstrap-node-producer.yml]
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.repository == 'qqrm/openfga-axum-lab' && github.ref == 'refs/heads/diag/bootstrap-node-producer-379e'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact versioned producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1d6697b5aa6e18bb07a6a074da0d436314185fd0
          path: producer
          persist-credentials: false
      - name: Check out the fixed Rust source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 53ff85cfdd3d84c26ae432189790e1e0f72d61db
          path: source
          persist-credentials: false
      - name: Check out the exact reviewed entrypoint fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d7f7ead003c774e30584798adfde38afb854528d
          path: packaging
          persist-credentials: false
      - name: Check producer identity and preserve the repository runtime contract
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test "$(git -C producer rev-parse HEAD)" = 1d6697b5aa6e18bb07a6a074da0d436314185fd0
          git -C producer diff --exit-code HEAD --
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const files = execFileSync('git', ['ls-files', '-z'], {cwd:'producer',encoding:'utf8'}).split('\0').filter(Boolean);
          for (const path of files) {
            assert(!path.endsWith('.py') && !path.endsWith('.pyw'), 'Forbidden tracked runtime: ' + path);
            if (path.startsWith('.github/workflows/') || path === 'compose.yaml' || path === 'Dockerfile') {
              assert(!readFileSync('producer/' + path, 'utf8').toLowerCase().includes('python'), 'Forbidden workflow runtime: ' + path);
            }
          }
          assert(files.includes('browser-single/bootstrap/native-proof.mjs'));
          console.log(JSON.stringify({producerSource:'1d6697b5aa6e18bb07a6a074da0d436314185fd0',repositoryRuntimeContract:'passed',scope:'source preflight; not Rust integration-test execution'}));
          JS
      - name: Verify retained OpenFGA bytes and build record for the versioned producer
        timeout-minutes: 4
        shell: bash
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout 180s python3 - <<'PY'
          import hashlib, json, os, tempfile, urllib.error, urllib.request, zipfile
          from pathlib import Path
          from urllib.parse import urlsplit
          
          REPO = 'qqrm/openfga-axum-lab'
          RUN = 43402635950
          HEAD = '379e3280c2a1c789071292af141648eb2fc3ffbc'
          AID = 14029511154
          ZIP_SIZE = 260830150
          ZIP_SHA = '73e4c4d2f2204ef4da0450e472b50ffb507e52b6a46fe55e0cab153b4fa3976e'
          MEMBER = 'artifacts/browser-openfga/openfga'
          BUILD_MEMBER = 'artifacts/browser-openfga/build.json'
          BIN_SIZE = 63054008
          BIN_SHA = '57ef124e5b339dcf1c3dbcbe2c3083c03f5db74a799a1472014e875292cc1066'
          
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect())
          
          def request(path):
              return urllib.request.Request('https://api.github.com/repos/' + REPO + path, headers={
                  'Authorization': 'Bearer ' + os.environ['ARTIFACT_READ_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'native-openfga-uds-compatibility'})
          
          def api(path):
              try:
                  with opener.open(request(path), timeout=20) as response:
                      raw = response.read(1024**2 + 1)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  raise SystemExit('GitHub metadata request failed') from None
              require(len(raw) <= 1024**2, 'Oversize metadata')
              return json.loads(raw)
          
          run = api('/actions/runs/' + str(RUN))
          require(run['id'] == RUN and run['head_sha'] == HEAD and run['run_attempt'] == 1
                  and run['status'] == 'completed' and run['event'] == 'pull_request'
                  and run['conclusion'] == 'failure', 'Source run identity mismatch')
          artifact = api('/actions/artifacts/' + str(AID))
          require(artifact['id'] == AID and artifact['name'] == 'pages-browser-vm-evidence'
                  and not artifact['expired'] and artifact['workflow_run']['id'] == RUN
                  and artifact['workflow_run']['head_sha'] == HEAD
                  and artifact['size_in_bytes'] == ZIP_SIZE
                  and artifact['digest'] == 'sha256:' + ZIP_SHA, 'Artifact identity mismatch')
          
          try:
              opener.open(request('/actions/artifacts/' + str(AID) + '/zip'), timeout=20)
              raise SystemExit('Expected artifact redirect')
          except urllib.error.HTTPError as error:
              require(error.code == 302, 'Unexpected artifact redirect status')
              location = error.headers.get('Location', '')
              error.close()
          storage = urlsplit(location)
          host = storage.hostname or ''
          require(storage.scheme == 'https' and storage.port in (None, 443)
                  and storage.username is None and storage.password is None
                  and (host.endswith('.blob.core.windows.net') or host.endswith('.actions.githubusercontent.com')),
                  'Unexpected artifact storage address')
          
          with tempfile.TemporaryFile() as archive:
              size, digest = 0, hashlib.sha256()
              try:
                  # A new unauthenticated request keeps the GitHub token off storage.
                  with opener.open(urllib.request.Request(location), timeout=30) as response:
                      while block := response.read(1024**2):
                          size += len(block)
                          require(size <= ZIP_SIZE, 'Oversize ZIP')
                          digest.update(block)
                          archive.write(block)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  raise SystemExit('Artifact download failed') from None
              require(size == ZIP_SIZE and digest.hexdigest() == ZIP_SHA, 'ZIP integrity mismatch')
              archive.seek(0)
              destination = Path('producer/artifacts/browser-openfga')
              destination.mkdir(mode=0o755, parents=True, exist_ok=False)
              destination.chmod(0o755)
              binary = destination / 'openfga'
              with zipfile.ZipFile(archive) as package:
                  names = package.namelist()
                  require(len(names) <= 10000 and len(names) == len(set(names)), 'Invalid ZIP member list')
                  require(names.count(MEMBER) == 1, 'Exact binary member missing')
                  info = package.getinfo(MEMBER)
                  require(info.file_size == BIN_SIZE, 'Binary metadata size mismatch')
                  size, digest = 0, hashlib.sha256()
                  with package.open(info) as source, binary.open('xb') as target:
                      while block := source.read(1024**2):
                          size += len(block)
                          require(size <= BIN_SIZE, 'Oversize binary')
                          digest.update(block)
                          target.write(block)
                  require(size == BIN_SIZE and digest.hexdigest() == BIN_SHA, 'Binary integrity mismatch')
                  require(names.count(BUILD_MEMBER) == 1, 'Exact build record missing')
                  build_info = package.getinfo(BUILD_MEMBER)
                  require(0 < build_info.file_size <= 1024**2, 'Build record size mismatch')
                  build_bytes = package.read(build_info)
                  require(len(build_bytes) == build_info.file_size, 'Truncated build record')
                  build = json.loads(build_bytes)
                  require(build['binary_sha256'] == BIN_SHA and
                          build['source_commit'] == '293893b22a53d8a130a5f7c97cab4bc8e91bcaa4',
                          'Retained build record identity mismatch')
                  with (destination / 'build.json').open('xb') as target:
                      target.write(build_bytes)
              binary.chmod(0o555)
          
          proof = {'source_run': RUN, 'source_head': HEAD, 'artifact': AID,
                   'zip_sha256': ZIP_SHA, 'member': MEMBER, 'binary_bytes': size,
                   'binary_sha256': digest.hexdigest(),
                   'build_member': BUILD_MEMBER, 'build_sha256': hashlib.sha256(build_bytes).hexdigest(),
                   'scope': 'versioned native producer proof only; no browser acceptance'}
          Path('producer/artifacts/bootstrap-producer-input.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof))
          PY
      - name: Execute the unchanged versioned producer with the verified OpenFGA build
        timeout-minutes: 50
        working-directory: producer
        run: bash browser-single/bootstrap/build.sh ../source ../packaging
      - name: Verify the complete output against the production payload validator
        timeout-minutes: 2
        working-directory: producer
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync,readdirSync} from 'node:fs';
          import {validateBootstrapBuild} from './browser-single/pages/startup-payload.mjs';
          const root = 'artifacts/browser-bootstrap/';
          assert.deepEqual(readdirSync(root).sort(), ['SOURCE.txt','bootstrap','build.json','native-tests.log'].sort());
          const binary = readFileSync(root+'bootstrap');
          const digest = value => createHash('sha256').update(value).digest('hex');
          const build = JSON.parse(readFileSync(root+'build.json','utf8'));
          validateBootstrapBuild(build,{bytes:binary.length,sha256:digest(binary)});
          assert.equal(build.native_test_log_sha256,digest(readFileSync(root+'native-tests.log')));
          assert.equal(build.bootstrap_source_sha256,digest(readFileSync('tools/bootstrap.rs')));
          assert.equal(build.bootstrap_tests_sha256,digest(readFileSync('tools/bootstrap_tests.rs')));
          assert.equal(build.browser_acceptance_verified,false);
          console.log(JSON.stringify({producerOutputVerified:true,binaryBytes:binary.length,binarySha256:digest(binary),sameAsPriorNative:digest(binary)==='d47425c10ebc1d2c1501e86dd7a1f3e8e5b6d2c9a6e4cf8123f20bd5d8c1866f',browserAcceptanceVerified:false}));
          JS
      - name: Clean only proof containers owned by this run
        if: always()
        timeout-minutes: 2
        working-directory: producer
        run: bash browser-single/bootstrap/build.sh --cleanup
      - name: Retain the four-file verified producer output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-bootstrap-node-producer
          path: producer/artifacts/browser-bootstrap/
          if-no-files-found: error
          retention-days: 7
      - name: Retain actual producer and service evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-bootstrap-node-producer-evidence
          path: |
            producer/artifacts/browser-bootstrap-proof/
            producer/artifacts/bootstrap-producer-input.json
          if-no-files-found: warn
          retention-days: 7
