name: Read retained ACPI evidence 43424228941
on:
  push:
    branches: [diag/read-acpi-evidence-43424228941]
    paths: [.github/workflows/read-acpi-evidence.yml]
permissions:
  actions: read
concurrency:
  group: read-acpi-evidence-43424228941
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'qqrm/openfga-axum-lab' && github.ref == 'refs/heads/diag/read-acpi-evidence-43424228941'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify two completed artifacts and export full console data
        shell: bash
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, stat, tempfile, urllib.error, urllib.request, uuid, zipfile
          from urllib.parse import urlsplit
          
          REPO = "qqrm/openfga-axum-lab"
          RUN = 43424228941
          HEAD = "e47edc9921574acd50870e375de7d9f3f0ced2b2"
          M = 1024**2
          SPECS = [
              ("chromium", 14037525865, "browser-clocks-acpi-379e-chromium", 4512663,
               "a4da60b10114a9017647df157e4cf88314be93c364c103e57eecf506e66286f3",
               127841, "78e7f2e45703266d63f58eba30a91d3254d975be5fba57399671cd7533920c47"),
              ("firefox", 14038500563, "browser-clocks-acpi-379e-firefox", 4284158,
               "519673df938499310f6ed06f3604a2b8ba4443ddd394843c397f9bb5ef8355a0",
               336281, "ed4602932cf592e785f347d733f256bf44a3ab54605dac249196dfb31238ddab")
          ]
          
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect())
          def request(suffix):
              return urllib.request.Request("https://api.github.com/repos/" + REPO + suffix, headers={
                  "Authorization": "Bearer " + os.environ["ARTIFACT_READ_TOKEN"],
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "bounded-acpi-evidence-reader"})
          
          def api(suffix):
              try:
                  with opener.open(request(suffix), timeout=20) as response:
                      raw = response.read(M + 1)
              except urllib.error.HTTPError as error:
                  raise SystemExit("GitHub metadata HTTP " + str(error.code)) from None
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit("GitHub metadata network failure") from None
              require(len(raw) <= M, "Metadata response exceeded budget")
              return json.loads(raw)
          
          used = 0
          def emit(label, value):
              global used
              record = json.dumps({"label": label, "value": value}, ensure_ascii=True, separators=(",", ":"))
              require(len(record) <= 9000, "Output record exceeded budget; no silent truncation")
              used += len(record.encode("ascii")) + 1
              require(used <= M, "Full console output exceeded the 1 MiB budget")
              print(record, flush=True)
          
          def member(package, name, limit):
              info = package.getinfo(name)
              mode = info.external_attr >> 16
              require(not info.is_dir() and not stat.S_ISLNK(mode) and
                      stat.S_IFMT(mode) in (0, stat.S_IFREG) and 0 < info.file_size <= limit,
                      "Invalid or oversized fixed member: " + name)
              with package.open(info) as part:
                  raw = part.read(limit + 1)
              require(len(raw) == info.file_size and len(raw) <= limit, "Member size mismatch: " + name)
              return raw
          
          def js_utf8(value):
              # Match JavaScript TextEncoder, including surrogate pairs spanning source chunks.
              return value.encode("utf-16-le", "surrogatepass").decode("utf-16-le", "replace").encode("utf-8")
          
          run = api("/actions/runs/" + str(RUN))
          require(run["id"] == RUN and run["head_sha"] == HEAD and run["status"] == "completed" and
                  run["conclusion"] == "success" and run["event"] == "push" and run["run_attempt"] == 1,
                  "Pinned source run identity/status/attempt mismatch")
          
          stop = uuid.uuid4().hex
          print("::stop-commands::" + stop, flush=True)
          try:
              emit("source", {"run": RUN, "head": HEAD, "attempt": 1, "conclusion": "success",
                              "scope": "data-only retained evidence; no guest execution or acceptance claim"})
              for engine, aid, name, zip_bytes, zip_sha, console_bytes, console_sha in SPECS:
                  artifact = api("/actions/artifacts/" + str(aid))
                  require(artifact["id"] == aid and artifact["name"] == name and not artifact["expired"] and
                          artifact["workflow_run"]["id"] == RUN and artifact["workflow_run"]["head_sha"] == HEAD and
                          artifact["size_in_bytes"] == zip_bytes and artifact["digest"] == "sha256:" + zip_sha,
                          "Pinned artifact identity mismatch")
                  try:
                      opener.open(request("/actions/artifacts/" + str(aid) + "/zip"), timeout=20)
                      raise SystemExit("Expected artifact redirect")
                  except urllib.error.HTTPError as error:
                      require(error.code == 302, "Artifact redirect was not HTTP 302")
                      location = error.headers.get("Location", "")
                      error.close()
                  target = urlsplit(location)
                  host = target.hostname or ""
                  require(target.scheme == "https" and target.port in (None, 443) and
                          target.username is None and target.password is None and
                          (host.endswith(".blob.core.windows.net") or host.endswith(".actions.githubusercontent.com")),
                          "Unexpected artifact storage host")
                  with tempfile.TemporaryFile() as archive:
                      count, digest = 0, hashlib.sha256()
                      try:
                          # A separate request must never forward Authorization to signed storage.
                          with opener.open(urllib.request.Request(location), timeout=30) as response:
                              while block := response.read(M):
                                  count += len(block)
                                  require(count <= zip_bytes, "Archive exceeded pinned byte size")
                                  digest.update(block)
                                  archive.write(block)
                      except urllib.error.HTTPError as error:
                          raise SystemExit("Artifact storage HTTP " + str(error.code)) from None
                      except (urllib.error.URLError, TimeoutError):
                          raise SystemExit("Artifact storage network failure") from None
                      require(count == zip_bytes and digest.hexdigest() == zip_sha, "Archive byte SHA/size mismatch")
                      archive.seek(0)
                      with zipfile.ZipFile(archive) as package:
                          names = package.namelist()
                          require(len(names) <= 10000 and len(names) == len(set(names)),
                                  "ZIP member count/duplicates invalid")
                          require(all(not n.startswith("/") and "\\" not in n and "\0" not in n
                                      and ".." not in n.split("/") for n in names), "Unsafe ZIP member name")
                          # Exact archive-root paths only. No extraction or execution.
                          raw = member(package, engine + "-console.txt", 512 * 1024)
                          stream = member(package, engine + "-stream.jsonl", 64 * M)
                          result = json.loads(member(package, engine + ".json", 4 * M))
                          require(len(raw) == console_bytes and hashlib.sha256(raw).hexdigest() == console_sha,
                                  "Pinned console byte identity mismatch")
                          require(isinstance(result, dict) and result.get("engine") == engine and
                                  result.get("diagnosticOnly") is True and result.get("productionAcceptance") is False,
                                  "Unexpected diagnostic result identity")
                          require(result.get("sourceHead") == "379e3280c2a1c789071292af141648eb2fc3ffbc" and
                                  result.get("hostSourceHead") == "af9c5555e312ffaec3785154f5be83be7469c95f" and
                                  result.get("kernelArtifact") == 14033713071, "Unexpected runtime/kernel provenance")
                          lines = stream.decode("utf-8").split("\n")
                          require(lines[-1] == "", "Unterminated captured JSONL stream")
                          texts, chunks, batches, encoded_bytes = [], 0, 0, 0
                          for line in lines[:-1]:
                              batch = json.loads(line)
                              require(isinstance(batch, dict), "Invalid stream batch object")
                              values = batch.get("texts")
                              require(type(batch.get("firstSequence")) is int and batch["firstSequence"] == chunks + 1
                                      and isinstance(values, list) and len(values) > 0, "Noncontiguous stream sequence")
                              batches += 1
                              for value in values:
                                  require(isinstance(value, str), "Non-string captured chunk")
                                  chunks += 1
                                  encoded_bytes += len(js_utf8(value))
                                  require(chunks <= 1000000 and encoded_bytes <= 16 * M, "Stream content exceeded bounds")
                                  texts.append(value)
                          require(js_utf8("".join(texts)) == raw, "Stream does not reconstruct full console bytes")
                          capture = result.get("logCapture")
                          require(isinstance(capture, dict) and capture.get("format") == "browser-lab-log-batches-v1"
                                  and capture.get("complete") is True and not capture.get("error"),
                                  "Capture was not recorded complete")
                          require([capture.get(k) for k in ("chunks", "batches", "bytes", "expectedSequence")] ==
                                  [chunks, batches, encoded_bytes, chunks], "Recorded counts/cutoff do not match full stream")
                          recorded = result.get("captureIntegrity")
                          require(isinstance(recorded, dict) and recorded.get("consoleSha256") == console_sha and
                                  recorded.get("streamSha256") == hashlib.sha256(stream).hexdigest(),
                                  "Recorded capture hashes do not match independent reconstruction")
                          emit(engine + ".integrity", {
                              "artifact": aid, "artifact_name": name, "zip": {"bytes": zip_bytes, "sha256": zip_sha},
                              "console": {"bytes": len(raw), "sha256": console_sha},
                              "stream": {"bytes": len(stream), "sha256": hashlib.sha256(stream).hexdigest()},
                              "contiguous_sequences": True, "full_console_equal": True, "recorded_complete": True,
                              "chunks": chunks, "batches": batches, "encoded_chunk_bytes": encoded_bytes,
                              "cutoff_sequence": chunks, "outcome": result.get("outcome"),
                              "two_real_sequences_recorded": result.get("twoRealSequencesObserved")
                          })
                          encoded = base64.b64encode(raw).decode("ascii")
                          parts = (len(encoded) + 4999) // 5000
                          emit(engine + ".console", {"encoding": "base64", "bytes": len(raw), "sha256": console_sha,
                              "encoded_characters": len(encoded), "parts": parts, "part_characters_max": 5000})
                          for index, offset in enumerate(range(0, len(encoded), 5000)):
                              emit(engine + ".console_part", {"index": index, "offset": offset,
                                  "base64": encoded[offset:offset + 5000]})
                          emit(engine + ".console_end", {"parts": parts, "encoded_characters": len(encoded),
                              "bytes": len(raw), "sha256": console_sha, "complete_export": True})
              emit("finished", {"artifacts": 2, "full_console_exports": 2, "output_bytes_before_final_record": used,
                                "scope": "data-only; source diagnostic workflow success is not browser acceptance"})
          finally:
              print("::" + stop + "::", flush=True)
          PY
