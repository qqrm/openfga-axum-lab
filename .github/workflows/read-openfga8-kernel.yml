name: Read retained OpenFGA .8 kernel evidence 43445975279
on:
  push:
    branches: [diag/read-openfga8-kernel-43445975279]
    paths: [.github/workflows/read-openfga8-kernel.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: read-openfga8-kernel-43445975279
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'qqrm/openfga-axum-lab' && github.ref == 'refs/heads/diag/read-openfga8-kernel-43445975279'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify two completed artifacts and export full console data
        shell: bash
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, datetime, hashlib, json, os, stat, tempfile, urllib.error, urllib.request, uuid, zipfile
          from urllib.parse import urlsplit
          
          REPO = "qqrm/openfga-axum-lab"
          RUN = 43445975279
          HEAD = "46c84c13f8dfca98c4a0fdcf2ff7977d7d03c4cf"
          M = 1024**2
          SPECS = [
              ("firefox", 14049117972, "browser-openfga8-firefox", 3587811,
               "1eaaf3f6d722a90a9ce857d20136ab7a41fee4cc95263f2e85200f75c565632a"),
              ("chromium", 14048397596, "browser-openfga8-chromium", 3839661,
               "63d1297c001222000642c2e32b38c07c41a79a5577d29d2d976bd935bf2b2df0")
          ]
          
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect())
          def request(suffix):
              return urllib.request.Request("https://api.github.com/repos/" + REPO + suffix, headers={
                  "Authorization": "Bearer " + os.environ["ARTIFACT_READ_TOKEN"],
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "bounded-openfga8-kernel-reader"})
          
          def api(suffix):
              try:
                  with opener.open(request(suffix), timeout=20) as response:
                      raw = response.read(M + 1)
              except urllib.error.HTTPError as error:
                  raise SystemExit("GitHub metadata HTTP " + str(error.code)) from None
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit("GitHub metadata network failure") from None
              require(len(raw) <= M, "Metadata response exceeded budget")
              return json.loads(raw)
          
          used = 0
          def emit(label, value):
              global used
              record = json.dumps({"label": label, "value": value}, ensure_ascii=True, separators=(",", ":"))
              require(len(record) <= 9000, "Output record exceeded budget; no silent truncation")
              used += len(record.encode("ascii")) + 1
              require(used <= M, "Full console output exceeded the 1 MiB budget")
              print(record, flush=True)
          
          def member(package, name, limit):
              info = package.getinfo(name)
              mode = info.external_attr >> 16
              require(not info.is_dir() and not stat.S_ISLNK(mode) and
                      stat.S_IFMT(mode) in (0, stat.S_IFREG) and 0 < info.file_size <= limit,
                      "Invalid or oversized fixed member: " + name)
              with package.open(info) as part:
                  raw = part.read(limit + 1)
              require(len(raw) == info.file_size and len(raw) <= limit, "Member size mismatch: " + name)
              return raw
          
          def js_utf8(value):
              # Match JavaScript TextEncoder, including surrogate pairs spanning source chunks.
              return value.encode("utf-16-le", "surrogatepass").decode("utf-16-le", "replace").encode("utf-8")
          
          run = api("/actions/runs/" + str(RUN))
          require(run["id"] == RUN and run["head_sha"] == HEAD and run["status"] == "completed" and
                  run["conclusion"] == "failure" and run["event"] == "push" and run["run_attempt"] == 1,
                  "Pinned source run identity/status/attempt mismatch")
          
          stop = uuid.uuid4().hex
          print("::stop-commands::" + stop, flush=True)
          try:
              emit("source", {"run": RUN, "head": HEAD, "attempt": 1, "conclusion": "failure",
                              "scope": "data-only retained evidence; no guest execution or acceptance claim"})
              for engine, aid, name, zip_bytes, zip_sha in SPECS:
                  artifact = api("/actions/artifacts/" + str(aid))
                  require(artifact["id"] == aid and artifact["name"] == name and not artifact["expired"] and
                          artifact["workflow_run"]["id"] == RUN and artifact["workflow_run"]["head_sha"] == HEAD and
                          artifact["size_in_bytes"] == zip_bytes and artifact["digest"] == "sha256:" + zip_sha,
                          "Pinned artifact identity mismatch")
                  try:
                      opener.open(request("/actions/artifacts/" + str(aid) + "/zip"), timeout=20)
                      raise SystemExit("Expected artifact redirect")
                  except urllib.error.HTTPError as error:
                      require(error.code == 302, "Artifact redirect was not HTTP 302")
                      location = error.headers.get("Location", "")
                      error.close()
                  target = urlsplit(location)
                  host = target.hostname or ""
                  require(target.scheme == "https" and target.port in (None, 443) and
                          target.username is None and target.password is None and
                          (host.endswith(".blob.core.windows.net") or host.endswith(".actions.githubusercontent.com")),
                          "Unexpected artifact storage host")
                  with tempfile.TemporaryFile() as archive:
                      count, digest = 0, hashlib.sha256()
                      try:
                          # A separate request must never forward Authorization to signed storage.
                          with opener.open(urllib.request.Request(location), timeout=30) as response:
                              while block := response.read(M):
                                  count += len(block)
                                  require(count <= zip_bytes, "Archive exceeded pinned byte size")
                                  digest.update(block)
                                  archive.write(block)
                      except urllib.error.HTTPError as error:
                          raise SystemExit("Artifact storage HTTP " + str(error.code)) from None
                      except (urllib.error.URLError, TimeoutError):
                          raise SystemExit("Artifact storage network failure") from None
                      require(count == zip_bytes and digest.hexdigest() == zip_sha, "Archive byte SHA/size mismatch")
                      archive.seek(0)
                      with zipfile.ZipFile(archive) as package:
                          names = package.namelist()
                          require(len(names) <= 10000 and len(names) == len(set(names)),
                                  "ZIP member count/duplicates invalid")
                          require(all(not n.startswith("/") and "\\" not in n and "\0" not in n
                                      and ".." not in n.split("/") for n in names), "Unsafe ZIP member name")
                          # Fixed regular members only; no archive extraction or execution.
                          prefix = "source-candidate/artifacts/browser-wasm/" + engine
                          raw = member(package, prefix + "-console.txt", M)
                          stream = member(package, prefix + "-stream.jsonl", 64 * M)
                          result_bytes = member(package, prefix + ".json", 4 * M)
                          result = json.loads(result_bytes)
                          summary = json.loads(member(package,
                              "artifacts/openfga8-browser-gate/" + engine + "-summary.json", 4 * M))
                          require(isinstance(result, dict) and result.get("engine") == engine and
                                  result.get("passed") is False, "Unexpected recorded browser result")
                          require(isinstance(summary, dict) and summary.get("engine") == engine and
                                  summary.get("experiment") == "openfga8_model_reuse" and
                                  summary.get("diagnosticOnly") is True and summary.get("workflowCommit") == HEAD and
                                  summary.get("sourceCommit") == "b267fefdba375395d496e6d89413786c048c70d2" and
                                  summary.get("twoRealSequencesPassed") is False, "Unexpected pinned summary identity")
                          console_sha = hashlib.sha256(raw).hexdigest()
                          stream_sha = hashlib.sha256(stream).hexdigest()
                          for suffix, data in [("-console.txt", raw), ("-stream.jsonl", stream), (".json", result_bytes)]:
                              require(summary.get("files", {}).get(engine + suffix) ==
                                      {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()},
                                      "Summary/member byte identity mismatch")
                          if engine == "firefox":
                              require(len(raw) == 20247, "Unexpected Firefox console length")
                          lines = stream.decode("utf-8").split("\n")
                          require(lines[-1] == "", "Unterminated captured JSONL stream")
                          texts, chunks, batches, encoded_bytes = [], 0, 0, 0
                          receipt_lines, pending = [], ""
                          first_seq, last_seq, first_received, last_received = None, None, None, None
                          byte_offset = 0
                          for line in lines[:-1]:
                              batch = json.loads(line)
                              require(isinstance(batch, dict), "Invalid stream batch object")
                              values, received = batch.get("texts"), batch.get("receivedAt")
                              require(type(batch.get("firstSequence")) is int and batch["firstSequence"] == chunks + 1
                                      and isinstance(values, list) and len(values) > 0, "Noncontiguous stream sequence")
                              require(isinstance(received, str) and received.endswith("Z"), "Missing host receipt timestamp")
                              datetime.datetime.fromisoformat(received[:-1] + "+00:00")
                              batches += 1
                              for value in values:
                                  require(isinstance(value, str), "Non-string captured chunk")
                                  chunks += 1
                                  encoded_bytes += len(js_utf8(value))
                                  require(chunks <= 1000000 and encoded_bytes <= 16 * M, "Stream content exceeded bounds")
                                  texts.append(value)
                                  pieces = value.split("\n")
                                  for part_index, piece in enumerate(pieces):
                                      terminated = part_index < len(pieces) - 1
                                      if not piece and not terminated:
                                          continue
                                      if first_seq is None:
                                          first_seq, first_received = chunks, received
                                      pending += piece + ("\n" if terminated else "")
                                      last_seq, last_received = chunks, received
                                      if terminated:
                                          size = len(js_utf8(pending))
                                          receipt_lines.append({"line": len(receipt_lines) + 1,
                                              "byte_start": byte_offset, "byte_end": byte_offset + size,
                                              "first_sequence": first_seq, "last_sequence": last_seq,
                                              "first_received_at": first_received, "last_received_at": last_received,
                                              "terminated": True, "text": pending})
                                          byte_offset += size
                                          pending, first_seq = "", None
                          if pending:
                              size = len(js_utf8(pending))
                              receipt_lines.append({"line": len(receipt_lines) + 1,
                                  "byte_start": byte_offset, "byte_end": byte_offset + size,
                                  "first_sequence": first_seq, "last_sequence": last_seq,
                                  "first_received_at": first_received, "last_received_at": last_received,
                                  "terminated": False, "text": pending})
                              byte_offset += size
                          require(js_utf8("".join(texts)) == raw and
                                  js_utf8("".join(row["text"] for row in receipt_lines)) == raw and
                                  byte_offset == len(raw), "Stream/line mapping does not reconstruct full console bytes")
                          capture = result.get("logCapture")
                          require(isinstance(capture, dict) and capture.get("format") == "browser-lab-log-batches-v1"
                                  and capture.get("complete") is True and not capture.get("error"),
                                  "Capture was not recorded complete")
                          require([capture.get(k) for k in ("chunks", "batches", "bytes", "expectedSequence")] ==
                                  [chunks, batches, encoded_bytes, chunks], "Recorded counts/cutoff do not match full stream")
                          require(summary.get("logCapture") == capture, "Summary/result capture mismatch")
                          require(summary.get("passes") == result.get("passes") and
                                  summary.get("pageErrors") == result.get("pageErrors"), "Summary/result outcome mismatch")
                          emit(engine + ".integrity", {
                              "artifact": aid, "artifact_name": name, "zip": {"bytes": zip_bytes, "sha256": zip_sha},
                              "console": {"bytes": len(raw), "sha256": console_sha},
                              "stream": {"bytes": len(stream), "sha256": stream_sha},
                              "contiguous_sequences": True, "full_console_equal": True, "recorded_complete": True,
                              "chunks": chunks, "batches": batches, "encoded_chunk_bytes": encoded_bytes,
                              "cutoff_sequence": chunks, "receipt_lines": len(receipt_lines)})
                          guest = result.get("guest") or {}
                          failure = str(result.get("failure", ""))
                          emit(engine + ".result", {
                              "browser": result.get("browser"), "passed": result.get("passed"),
                              "startedAt": result.get("startedAt"), "finishedAt": result.get("finishedAt"),
                              "passes": result.get("passes"), "pageErrors": result.get("pageErrors"),
                              "failure": failure[:1600], "failure_truncated": len(failure) > 1600,
                              "guest": {key: guest.get(key) for key in
                                  ["booted", "ready", "accepted", "checks", "error", "vm", "source"]},
                              "summary_source": summary.get("sourceCommit"), "workflow": summary.get("workflowCommit"),
                              "native_proof_is_not_browser_acceptance": True})
                          if engine == "firefox":
                              encoded = base64.b64encode(raw).decode("ascii")
                              parts = (len(encoded) + 4999) // 5000
                              emit(engine + ".console", {"encoding": "base64", "bytes": len(raw), "sha256": console_sha,
                                  "encoded_characters": len(encoded), "parts": parts, "part_characters_max": 5000})
                              for index, offset in enumerate(range(0, len(encoded), 5000)):
                                  emit(engine + ".console_part", {"index": index, "offset": offset,
                                      "base64": encoded[offset:offset + 5000]})
                              emit(engine + ".console_end", {"parts": parts, "encoded_characters": len(encoded),
                                  "bytes": len(raw), "sha256": console_sha, "complete_export": True})
                              selected = receipt_lines
                              omitted = 0
                          else:
                              cutoff = next((i + 1 for i, row in enumerate(receipt_lines)
                                             if "LAB|boot" in row["text"]), len(receipt_lines))
                              prefix_lines = receipt_lines[:cutoff]
                              selected = prefix_lines if len(prefix_lines) <= 480 else prefix_lines[:400] + prefix_lines[-80:]
                              omitted = len(prefix_lines) - len(selected)
                          emit(engine + ".receipt_scope", {
                              "scope": "all Firefox lines" if engine == "firefox" else "Chromium prefix through first raw LAB|boot line",
                              "selected_lines": len(selected), "omitted_middle_lines": omitted,
                              "clock": "host batch receipt; not guest execution or latency attribution",
                              "mixed_stream": "PTY, QEMU print and printErr share this transcript"})
                          for row in selected:
                              view = dict(row)
                              view["text_truncated"] = len(view["text"]) > 3000
                              view["text"] = view["text"][:3000]
                              emit(engine + ".receipt_line", view)
              emit("finished", {"artifacts": 2, "full_console_exports": 1, "output_bytes_before_final_record": used,
                                "scope": "data-only; source run failed, reader success only verifies and exports retained evidence"})
          finally:
              print("::" + stop + "::", flush=True)
          PY
