name: Read retained OpenFGA .8 native failure evidence
on:
  push:
    branches: [diag/read-openfga8-native-failure]
    paths: [.github/workflows/read-openfga8-native-failure.yml]
permissions:
  contents: read
  actions: read
jobs:
  read:
    if: github.repository == 'qqrm/openfga-axum-lab' && github.ref == 'refs/heads/diag/read-openfga8-native-failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the retained ZIP and print bounded data only
        timeout-minutes: 3
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, stat, tempfile, urllib.error, urllib.request, zipfile
          from urllib.parse import urlsplit
          REPO = "qqrm/openfga-axum-lab"
          RUN, HEAD = 43440821229, "84112f7373df40dc767d7f10fbea453720651f0e"
          AID, SIZE = 14047585163, 20612111
          SHA = "45fda236fb2dc536d0c437e38230a18f8a19fc09b8b7fca6807cc76f65fc094f"
          def require(ok, message):
              if not ok: raise SystemExit(message)
          def emit(kind, **fields):
              print("NATIVE_FAILURE_DATA " + json.dumps({"kind": kind, **fields}), flush=True)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener = urllib.request.build_opener(NoRedirect())
          def request(suffix):
              return urllib.request.Request("https://api.github.com/repos/" + REPO + suffix, headers={
                "Authorization": "Bearer " + os.environ["ARTIFACT_READ_TOKEN"],
                "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
          def api(suffix):
              with opener.open(request(suffix), timeout=20) as response: data = response.read(1024**2 + 1)
              require(len(data) <= 1024**2, "Metadata exceeds budget")
              return json.loads(data)
          run, artifact = api("/actions/runs/" + str(RUN)), api("/actions/artifacts/" + str(AID))
          require(run["id"] == RUN and run["head_sha"] == HEAD and run["run_attempt"] == 1 and
                  run["event"] == "push" and run["status"] == "completed" and run["conclusion"] == "failure",
                  "Retained failed run identity differs")
          require(artifact["id"] == AID and artifact["name"] == "browser-openfga8-native-evidence" and
                  not artifact["expired"] and artifact["workflow_run"]["id"] == RUN and
                  artifact["workflow_run"]["head_sha"] == HEAD and artifact["size_in_bytes"] == SIZE and
                  artifact["digest"] == "sha256:" + SHA, "Retained artifact identity differs")
          try:
              opener.open(request("/actions/artifacts/" + str(AID) + "/zip"), timeout=20)
              raise SystemExit("Expected artifact redirect")
          except urllib.error.HTTPError as error:
              require(error.code == 302, "Unexpected artifact redirect")
              location = error.headers.get("Location", "")
              error.close()
          target = urlsplit(location)
          require(target.scheme == "https" and target.port in (None, 443) and
                  target.username is None and target.password is None and
                  ((target.hostname or "").endswith(".blob.core.windows.net") or
                   (target.hostname or "").endswith(".actions.githubusercontent.com")),
                  "Unexpected storage host")
          with tempfile.TemporaryFile() as archive:
              size, digest = 0, hashlib.sha256()
              try:
                  # The storage request is deliberately unauthenticated.
                  with opener.open(urllib.request.Request(location), timeout=30) as response:
                      while block := response.read(1024**2):
                          size += len(block); require(size <= SIZE, "ZIP exceeds pinned size")
                          digest.update(block); archive.write(block)
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit("Artifact storage read failed") from None
              require(size == SIZE and digest.hexdigest() == SHA, "ZIP SHA/size differs")
              emit("archive", run=RUN, head=HEAD, artifact=AID, bytes=size, sha256=digest.hexdigest(),
                   data_only=True, vm_started=False)
              archive.seek(0)
              with zipfile.ZipFile(archive) as package:
                  names = package.namelist()
                  require(len(names) <= 256 and len(names) == len(set(names)), "Unexpected ZIP membership")
                  require(all(not name.startswith("/") and "\\" not in name and "\0" not in name and
                              ".." not in name.split("/") for name in names), "Unsafe ZIP member path")
                  emit("members", count=len(names),
                       mode_scope="ZIP entry metadata, not a filesystem stat from the failed container",
                       entries=[{"name": item.filename, "bytes": item.file_size, "compressed_bytes": item.compress_size,
                                 "directory": item.is_dir(), "zip_unix_mode": oct(item.external_attr >> 16),
                                 "zip_create_system": item.create_system} for item in package.infolist()])
                  selected = [
                    ("browser-bootstrap-proof/native-bootstrap-stack.log", True, 65536),
                    ("browser-openfga/build.json", True, 65536),
                    ("openfga8-verifier-input.json", True, 65536),
                    ("browser-bootstrap-proof/image-id.txt", False, 1024),
                    ("browser-bootstrap-proof/test-image-id.txt", False, 1024),
                    ("browser-bootstrap-proof/initdb.log", False, 32768),
                    ("browser-bootstrap-proof/postgres.log", False, 32768)
                  ]
                  remaining, missing = 256*1024, []
                  for name, required, maximum in selected:
                      if name not in names:
                          emit("text", name=name, present=False, required=required)
                          if required: missing.append(name)
                          continue
                      info = package.getinfo(name)
                      mode = info.external_attr >> 16
                      require(not info.is_dir() and not stat.S_ISLNK(mode) and
                              stat.S_IFMT(mode) in (0, stat.S_IFREG) and info.file_size <= 4*1024**2,
                              "Invalid or oversized selected text member")
                      data = package.read(info)
                      require(len(data) == info.file_size, "Truncated text member")
                      count = min(maximum, remaining, len(data))
                      tail = data[-count:] if count else b""
                      remaining -= count
                      emit("text", name=name, present=True, bytes=len(data), raw_sha256=hashlib.sha256(data).hexdigest(),
                           printed_bytes=count, truncated=count<len(data), offset=len(data)-count,
                           text=tail.decode("utf-8", errors="replace"))
                  emit("summary", required_members_missing=missing, printed_text_bytes=256*1024-remaining,
                       browser_acceptance_verified=False, data_only=True)
                  require(not missing, "A required retained evidence member is absent")
          PY
