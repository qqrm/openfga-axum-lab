name: Publish staged release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified draft tag with a successful staging receipt
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-candidate
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.0'
      - name: Verify staged artifact and publish without rebuilding
        run: |
          cargo +1.98.0 build --locked --bin lab-tool
          target/debug/lab-tool delivery-policy tag "$RELEASE_TAG"
          mkdir -p artifacts
          gh api "repos/$GITHUB_REPOSITORY/environments/release" > artifacts/environment.json
          target/debug/lab-tool delivery-policy environment artifacts/environment.json release
          gh release download "$RELEASE_TAG" --pattern manifest.json --pattern staging-receipt.json --dir artifacts
          target/debug/lab-tool delivery-policy manifest artifacts/manifest.json "$RELEASE_TAG"
          target/debug/lab-tool delivery-policy receipt artifacts/staging-receipt.json artifacts/manifest.json
          revision=$(jq -r .revision artifacts/manifest.json)
          git merge-base --is-ancestor "$revision" origin/main
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$revision&per_page=100" > artifacts/checks.json
          target/debug/lab-tool delivery-policy runs artifacts/checks.json "$revision"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --draft=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-promotion-evidence
          path: artifacts/
          retention-days: 30
