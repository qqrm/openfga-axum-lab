name: Observe ACPI browser clocks with two vCPUs
on:
  push:
    branches: [diag/clock-acpi-379e]
    paths:
      - .github/workflows/observe-acpi-clocks.yml
      - diagnostics/prepare-acpi-clocks.mjs
      - diagnostics/check-acpi-clocks.mjs
permissions:
  contents: read
  actions: read
concurrency:
  group: browser-clocks-acpi-379e
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'qqrm/openfga-axum-lab' && github.ref == 'refs/heads/diag/clock-acpi-379e'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        engine: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 379e3280c2a1c789071292af141648eb2fc3ffbc
          path: source-current
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /browser-single/pages/
            /browser-single/entrypoint.sh
            /browser-single/repack-runtime.mjs
            /e2e/package.json
            /e2e/package-lock.json
            /fga/model.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: af9c5555e312ffaec3785154f5be83be7469c95f
          path: source-candidate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /browser-single/pages/
            /browser-single/entrypoint.sh
            /browser-single/repack-runtime.mjs
            /e2e/package.json
            /e2e/package-lock.json
            /fga/model.json
      - name: Install locked Chromium and Firefox test runtimes
        working-directory: source-current/e2e
        timeout-minutes: 3
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium firefox
      - name: Verify the retained runtime, old kernel and new ACPI kernel; extract fixed members
        timeout-minutes: 3
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, urllib.error, urllib.request, zipfile
          from urllib.parse import urlsplit
          M = 1024**2
          REPO = "qqrm/openfga-axum-lab"
          root = pathlib.Path("prepared")
          root.mkdir(exist_ok=False)
          specs = [
            ("current", 43402635950, "379e3280c2a1c789071292af141648eb2fc3ffbc", 14029511154, "pages-browser-vm-evidence", 260830150, "73e4c4d2f2204ef4da0450e472b50ffb507e52b6a46fe55e0cab153b4fa3976e", "failure", "pull_request"),
            ("kernel", 43402635950, "379e3280c2a1c789071292af141648eb2fc3ffbc", 14026387821, "browser-ipc-kernel", 3360331, "b26572994ab8e2b2904c4f5b88fc039a58ed54b58b74c58f6cbaf39f60568812", "failure", "pull_request"),
            ("acpi-kernel", 43421624199, "1a1d55f0b02519ff0c3eb1ed3f86b2852f2f8e85", 14033713071, "browser-acpi-kernel-candidate", 3669750, "51b42d5fb8894930f9344f39754968fd8ed73b103d0a818c45ab4d2bb22edf64", "success", "push")
          ]
          def require(ok, message):
              if not ok: raise SystemExit(message)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener = urllib.request.build_opener(NoRedirect())
          def request(suffix):
              return urllib.request.Request("https://api.github.com/repos/" + REPO + suffix, headers={
                "Authorization": "Bearer " + os.environ["ARTIFACT_READ_TOKEN"],
                "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "bounded-browser-clock-observer"})
          def api(suffix):
              with opener.open(request(suffix), timeout=20) as response: raw = response.read(M + 1)
              require(len(raw) <= M, "Metadata response exceeded budget")
              return json.loads(raw)
          def check_members(package):
              names = package.namelist()
              require(len(names) <= 10000 and len(names) == len(set(names)), "Invalid ZIP member count/duplicates")
              require(all(not n.startswith("/") and "\\" not in n and "\0" not in n
                          and ".." not in n.split("/") for n in names), "Unsafe ZIP member name")
          def extract(package, name, destination, limit):
              info = package.getinfo(name)
              mode = info.external_attr >> 16
              require(not info.is_dir() and not stat.S_ISLNK(mode) and
                      stat.S_IFMT(mode) in (0, stat.S_IFREG) and 0 < info.file_size <= limit,
                      "Invalid selected ZIP member: " + name)
              destination.parent.mkdir(parents=True, exist_ok=True)
              size, digest = 0, hashlib.sha256()
              with package.open(info) as source, destination.open("xb") as output:
                  while block := source.read(M):
                      size += len(block)
                      require(size <= info.file_size and size <= limit, "Member read exceeded budget")
                      output.write(block); digest.update(block)
              require(size == info.file_size, "Truncated selected ZIP member")
              return {"bytes": size, "sha256": digest.hexdigest()}
          for label, run_id, head, aid, name, size, sha, conclusion, event in specs:
              dest = root / label
              dest.mkdir()
              run, artifact = api("/actions/runs/" + str(run_id)), api("/actions/artifacts/" + str(aid))
              require(run["id"] == run_id and run["status"] == "completed" and run["conclusion"] == conclusion and
                      run["head_sha"] == head and run["run_attempt"] == 1 and run["event"] == event,
                      "Pinned source run identity mismatch")
              require(artifact["id"] == aid and artifact["name"] == name and not artifact["expired"] and
                      artifact["workflow_run"]["id"] == run_id and artifact["workflow_run"]["head_sha"] == head and
                      artifact["size_in_bytes"] == size and artifact["digest"] == "sha256:" + sha,
                      "Pinned artifact identity mismatch")
              try:
                  opener.open(request("/actions/artifacts/" + str(aid) + "/zip"), timeout=20)
                  raise SystemExit("Expected artifact redirect")
              except urllib.error.HTTPError as error:
                  require(error.code == 302, "Artifact redirect was not HTTP 302")
                  location = error.headers.get("Location", "")
                  error.close()
              target = urlsplit(location); host = target.hostname or ""
              require(target.scheme == "https" and target.port in (None, 443) and
                      target.username is None and target.password is None and
                      (host.endswith(".blob.core.windows.net") or host.endswith(".actions.githubusercontent.com")),
                      "Unexpected artifact storage host")
              archive_path = dest / "source-artifact.zip"
              count, digest = 0, hashlib.sha256()
              try:
                  # Never forward the GitHub token to the signed storage URL.
                  with opener.open(urllib.request.Request(location), timeout=30) as response, archive_path.open("xb") as output:
                      while block := response.read(M):
                          count += len(block); require(count <= size, "Archive exceeded pinned size")
                          digest.update(block); output.write(block)
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit("Artifact storage network failure") from None
              require(count == size and digest.hexdigest() == sha, "Archive byte SHA/size mismatch")
              members = {}
              with zipfile.ZipFile(archive_path) as package:
                  check_members(package)
                  if label == "acpi-kernel":
                      selected = [
                        ("kernel/bzImage", "bzImage", 32*M),
                        ("kernel/linux.config", "linux.config", 2*M),
                        ("kernel/upstream.config", "upstream.config", 2*M),
                        ("kernel/ipc-baseline.config", "ipc-baseline.config", 2*M),
                        ("kernel/acpi.config.diff", "acpi.config.diff", 65536),
                        ("kernel/COPYING", "COPYING", M),
                        ("kernel/GPL-2.0", "GPL-2.0", M),
                        ("kernel/SOURCE.txt", "SOURCE.txt", 65536),
                        ("kernel/build.sha256", "build.sha256", 65536),
                        ("metadata.json", "metadata.json", M),
                        ("Kernel.Dockerfile", "Kernel.Dockerfile", 65536),
                        ("source-commit.txt", "source-commit.txt", 128),
                        ("workflow-commit.txt", "workflow-commit.txt", 128)
                      ]
                  elif label == "kernel":
                      selected = [("bzImage", "bzImage", 32*M), ("linux.config", "linux.config", 2*M)]
                  else:
                      selected = [
                        ("browser-output/wasm/runtime-source.zip", "runtime-source.zip", 384*M),
                        ("browser-output/wasm/runtime/derived-runtime.json", "retained/derived-runtime.json", 4*M),
                        ("browser-output/wasm/runtime/startup-manifest.json", "retained/startup-manifest.json", 4*M),
                        ("artifacts/browser-openfga/openfga", "openfga/openfga", 128*M),
                        ("artifacts/browser-openfga/build.json", "openfga/build.json", 4*M),
                        ("artifacts/browser-emulator/out.js", "emulator/out.js", 2*M),
                        ("artifacts/browser-emulator/qemu-system-x86_64.wasm", "emulator/qemu-system-x86_64.wasm", 128*M),
                        ("artifacts/browser-emulator/build.json", "emulator/build.json", 4*M)
                      ]
                  for source, relative, limit in selected:
                      key = relative if label == "acpi-kernel" else source
                      members[key] = extract(package, source, dest / relative, limit)
              if label == "current":
                  manifest = json.loads(pathlib.Path("source-" + label, "browser-single/pages/runtime-manifest.json").read_text())
                  nested = dest / "runtime-source.zip"
                  require(members["browser-output/wasm/runtime-source.zip"]["sha256"] == manifest["archive_sha256"],
                          "Original converter archive changed")
                  with zipfile.ZipFile(nested) as package:
                      check_members(package)
                      require(set(package.namelist()) == set(manifest["files"]), "Unexpected converter ZIP members")
                      for member, expected in manifest["files"].items():
                          require(member in ["out.js", "load.js", "arg-module.js", "qemu-system-x86_64.wasm", "qemu-system-x86_64.data"],
                                  "Unexpected converter runtime member")
                          actual = extract(package, member, dest / "browser-output/wasm/runtime" / member, expected["bytes"])
                          require(actual == expected, "Original converter runtime SHA/size mismatch: " + member)
              provenance = {"label": label, "run": run_id, "head": head, "artifact": aid, "artifact_name": name,
                            "archive": {"bytes": count, "sha256": sha}, "members": members}
              if label == "acpi-kernel":
                  candidate = "af9c5555e312ffaec3785154f5be83be7469c95f"
                  require((dest / "source-commit.txt").read_text().strip() == candidate and
                          (dest / "workflow-commit.txt").read_text().strip() == head,
                          "Kernel build source provenance changed")
                  built = json.loads((dest / "metadata.json").read_text())
                  require(built["source_commit"] == candidate and built["workflow_commit"] == head and
                          built["run_id"] == str(run_id) and built["run_attempt"] == "1" and
                          built["kernel_candidate_built"] is True and built["browser_acceptance_verified"] is False,
                          "Kernel build metadata identity mismatch")
                  provenance["source_commit"] = candidate
              (dest / "archive-provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
              archive_path.unlink()
              print(json.dumps({"verified_archive": label, "artifact": aid, "bytes": count, "sha256": sha}), flush=True)
          PY
      - name: Verify the retained runtime and replace only the reviewed kernel and host overlay
        timeout-minutes: 2
        run: node diagnostics/prepare-acpi-clocks.mjs
      - name: One bounded two-vCPU ACPI VM; observe clocks and real protocol only
        timeout-minutes: 22
        env:
          BROWSER_DIAGNOSTIC_ENGINE: ${{ matrix.engine }}
        run: node diagnostics/check-acpi-clocks.mjs
      - name: Retain full clock/protocol evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-clocks-acpi-379e-${{ matrix.engine }}
          path: artifacts/browser-clocks-acpi/
          if-no-files-found: warn
          retention-days: 7
