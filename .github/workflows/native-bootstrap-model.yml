name: Native bootstrap model provisioning deadline proof
on:
  push:
    branches: [diag/native-bootstrap-model-386c]
    paths: [.github/workflows/native-bootstrap-model.yml]
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.repository == 'qqrm/openfga-axum-lab' && github.ref == 'refs/heads/diag/native-bootstrap-model-386c'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the fixed Rust candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 386c1a32d1775b24033e2c090e28b80fad3658e2
          path: source
          persist-credentials: false
      - name: Check out the reviewed browser packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 427ef0305c48e094c2873cd3ce380f7f0e3d5683
          path: packaging
          persist-credentials: false
      - name: Check out the real-response proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b1de389203c9d110d9b9e8012f613bb439e2877f
          path: proof-source
          persist-credentials: false
      - name: Verify pinned inputs and browser wrapper syntax/tests
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          mkdir -p artifacts/native-bootstrap artifacts/native-bootstrap-input
          chmod 0755 artifacts/native-bootstrap artifacts/native-bootstrap-input
          test "$(git -C source rev-parse HEAD)" = 386c1a32d1775b24033e2c090e28b80fad3658e2
          test "$(git -C packaging rev-parse HEAD)" = 427ef0305c48e094c2873cd3ce380f7f0e3d5683
          test "$(git -C proof-source rev-parse HEAD)" = b1de389203c9d110d9b9e8012f613bb439e2877f
          test "$(git -C source hash-object tools/bootstrap.rs)" = a38ba1e8f792e7c0ed019c92f0ffd08a5d74a7a3
          test "$(git -C source hash-object tools/bootstrap_tests.rs)" = 1db6afce39ef556e192f45ebacd91cd0229b05f4
          cmp source/tools/bootstrap.rs packaging/tools/bootstrap.rs
          cmp source/tools/bootstrap_tests.rs packaging/tools/bootstrap_tests.rs
          cmp source/Cargo.lock packaging/Cargo.lock
          cmp source/browser-single/Dockerfile packaging/browser-single/Dockerfile
          printf '%s  %s\n' a894f61fb40563467d0a16409981acb14224c619073f39c42dca233609a78e6d source/fga/model.json | sha256sum -c -
          cp proof-source/diagnostics/native-bootstrap-proof.py artifacts/native-bootstrap/native-proof.py
          chmod 0644 artifacts/native-bootstrap/native-proof.py
          python3 -m py_compile artifacts/native-bootstrap/native-proof.py
          bash -euo pipefail <<'CHECK' 2>&1 | tee artifacts/native-bootstrap/wrapper-tests.log
          node --check packaging/browser-single/pages/startup-payload.mjs
          node --check packaging/browser-single/startup-payload.test.mjs
          node --check packaging/browser-single/check-pages.mjs
          node --test packaging/browser-single/startup-payload.test.mjs
          for script in packaging/browser-single/entrypoint.sh packaging/browser-single/pages/guest.sh packaging/browser-single/prepare-pages.sh; do
            bash -n "$script"
          done
          shellcheck --version
          shellcheck packaging/browser-single/entrypoint.sh packaging/browser-single/pages/guest.sh packaging/browser-single/prepare-pages.sh
          CHECK
      - name: Require formatting of the exact committed Rust files before compilation
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --mount type=bind,src="$PWD/source",dst=/src,readonly \
            --workdir /src rust:1.99.1-slim-bookworm bash -euc \
            'rustup component add rustfmt; rustfmt --edition 2024 --check tools/bootstrap.rs tools/bootstrap_tests.rs' \
            2>&1 | tee artifacts/native-bootstrap/rustfmt.log
          git -C source diff --exit-code HEAD --
          git -C packaging diff --exit-code HEAD --
      - name: Verify and extract the exact retained OpenFGA .7 binary
        timeout-minutes: 4
        shell: bash
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout 180s python3 - <<'PY'
          import hashlib, json, os, tempfile, urllib.error, urllib.request, zipfile
          from pathlib import Path
          from urllib.parse import urlsplit
          
          REPO = 'qqrm/openfga-axum-lab'
          RUN = 43402635950
          HEAD = '379e3280c2a1c789071292af141648eb2fc3ffbc'
          AID = 14029511154
          ZIP_SIZE = 260830150
          ZIP_SHA = '73e4c4d2f2204ef4da0450e472b50ffb507e52b6a46fe55e0cab153b4fa3976e'
          MEMBER = 'artifacts/browser-openfga/openfga'
          BIN_SIZE = 63054008
          BIN_SHA = '57ef124e5b339dcf1c3dbcbe2c3083c03f5db74a799a1472014e875292cc1066'
          
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect())
          
          def request(path):
              return urllib.request.Request('https://api.github.com/repos/' + REPO + path, headers={
                  'Authorization': 'Bearer ' + os.environ['ARTIFACT_READ_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'native-openfga-uds-compatibility'})
          
          def api(path):
              try:
                  with opener.open(request(path), timeout=20) as response:
                      raw = response.read(1024**2 + 1)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  raise SystemExit('GitHub metadata request failed') from None
              require(len(raw) <= 1024**2, 'Oversize metadata')
              return json.loads(raw)
          
          run = api('/actions/runs/' + str(RUN))
          require(run['id'] == RUN and run['head_sha'] == HEAD and run['run_attempt'] == 1
                  and run['status'] == 'completed' and run['event'] == 'pull_request'
                  and run['conclusion'] == 'failure', 'Source run identity mismatch')
          artifact = api('/actions/artifacts/' + str(AID))
          require(artifact['id'] == AID and artifact['name'] == 'pages-browser-vm-evidence'
                  and not artifact['expired'] and artifact['workflow_run']['id'] == RUN
                  and artifact['workflow_run']['head_sha'] == HEAD
                  and artifact['size_in_bytes'] == ZIP_SIZE
                  and artifact['digest'] == 'sha256:' + ZIP_SHA, 'Artifact identity mismatch')
          
          try:
              opener.open(request('/actions/artifacts/' + str(AID) + '/zip'), timeout=20)
              raise SystemExit('Expected artifact redirect')
          except urllib.error.HTTPError as error:
              require(error.code == 302, 'Unexpected artifact redirect status')
              location = error.headers.get('Location', '')
              error.close()
          storage = urlsplit(location)
          host = storage.hostname or ''
          require(storage.scheme == 'https' and storage.port in (None, 443)
                  and storage.username is None and storage.password is None
                  and (host.endswith('.blob.core.windows.net') or host.endswith('.actions.githubusercontent.com')),
                  'Unexpected artifact storage address')
          
          with tempfile.TemporaryFile() as archive:
              size, digest = 0, hashlib.sha256()
              try:
                  # A new unauthenticated request keeps the GitHub token off storage.
                  with opener.open(urllib.request.Request(location), timeout=30) as response:
                      while block := response.read(1024**2):
                          size += len(block)
                          require(size <= ZIP_SIZE, 'Oversize ZIP')
                          digest.update(block)
                          archive.write(block)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  raise SystemExit('Artifact download failed') from None
              require(size == ZIP_SIZE and digest.hexdigest() == ZIP_SHA, 'ZIP integrity mismatch')
              archive.seek(0)
              destination = Path('artifacts/native-bootstrap-input')
              destination.mkdir(mode=0o755, exist_ok=True)
              destination.chmod(0o755)
              binary = destination / 'openfga'
              with zipfile.ZipFile(archive) as package:
                  names = package.namelist()
                  require(len(names) <= 10000 and len(names) == len(set(names)), 'Invalid ZIP member list')
                  require(names.count(MEMBER) == 1, 'Exact binary member missing')
                  info = package.getinfo(MEMBER)
                  require(info.file_size == BIN_SIZE, 'Binary metadata size mismatch')
                  size, digest = 0, hashlib.sha256()
                  with package.open(info) as source, binary.open('xb') as target:
                      while block := source.read(1024**2):
                          size += len(block)
                          require(size <= BIN_SIZE, 'Oversize binary')
                          digest.update(block)
                          target.write(block)
                  require(size == BIN_SIZE and digest.hexdigest() == BIN_SHA, 'Binary integrity mismatch')
              binary.chmod(0o555)
          
          proof = {'source_run': RUN, 'source_head': HEAD, 'artifact': AID,
                   'zip_sha256': ZIP_SHA, 'member': MEMBER, 'binary_bytes': size,
                   'binary_sha256': digest.hexdigest(),
                   'scope': 'native compatibility only; no browser acceptance or latency proof'}
          Path('artifacts/native-bootstrap/input.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof))
          PY
      - name: Build one fresh candidate native image from the exact source
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 --progress plain \
            --file source/browser-single/Dockerfile --tag native-bootstrap:candidate source \
            2>&1 | tee artifacts/native-bootstrap/image-build.log
          docker image inspect native-bootstrap:candidate --format '{{.Id}}' > artifacts/native-bootstrap/image-id.txt
          docker image inspect native-bootstrap:candidate --format '{{.Id}} {{.Size}} {{.Os}}/{{.Architecture}}'
      - name: Run all bootstrap Rust tests from the cached identical build stage
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # This target reuses the same source/build layers; it does not build a second service image.
          docker buildx build --load --platform linux/amd64 --target rust-build \
            --file source/browser-single/Dockerfile --tag native-bootstrap:rust-tests source \
            2>&1 | tee artifacts/native-bootstrap/test-stage.log
          test_image=$(docker image inspect native-bootstrap:rust-tests --format '{{.Id}}')
          docker run --rm "$test_image" cargo test --release --locked \
            --no-default-features --features http --bin lab-tool bootstrap::tests -- --nocapture \
            2>&1 | tee artifacts/native-bootstrap/unit-tests.log
          grep -Fq 'test result: ok. 19 passed; 0 failed;' artifacts/native-bootstrap/unit-tests.log
      - name: Prove real delayed model responses and two original native acceptance sequences
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          python3 artifacts/native-bootstrap/native-proof.py \
            2>&1 | tee artifacts/native-bootstrap/native-proof.log
      - name: Export only the bootstrap binary from the exact tested image
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts/browser-bootstrap
          image=$(cat artifacts/native-bootstrap/image-id.txt)
          docker create --name native-bootstrap-export \
            --label "io.authzlab.native-bootstrap-run=$GITHUB_RUN_ID" \
            --entrypoint /bin/true "$image"
          docker cp native-bootstrap-export:/usr/local/bin/lab-tool artifacts/browser-bootstrap/bootstrap
          docker rm native-bootstrap-export
          chmod 0555 artifacts/browser-bootstrap/bootstrap
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          evidence = Path("artifacts/native-bootstrap")
          output = Path("artifacts/browser-bootstrap")
          source = Path("source")
          proof = json.loads((evidence / "native-result.json").read_text())
          image = (evidence / "image-id.txt").read_text().strip()
          fixed_source = "386c1a32d1775b24033e2c090e28b80fad3658e2"
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          require(proof["passed"] is True and proof["image_id"] == image and
                  proof["source_commit"] == fixed_source and
                  proof["packaging_commit"] == "427ef0305c48e094c2873cd3ce380f7f0e3d5683" and
                  proof["browser_acceptance_verified"] is False, "Native proof identity differs")
          require(len(proof["native_passes"]) == 2 and all(
                  item.get("accepted") is True and item.get("statuses") == [403, 204, 200, 204, 403]
                  for item in proof["native_passes"]), "Two genuine native passes are required")
          require(digest(output / "bootstrap") == proof["binary_sha256"], "Exported binary differs from the tested binary")
          require(proof["openfga_binary_sha256"] == "57ef124e5b339dcf1c3dbcbe2c3083c03f5db74a799a1472014e875292cc1066",
                  "OpenFGA identity differs")
          with (output / "native-tests.log").open("wb") as log:
              for name in ("wrapper-tests.log", "rustfmt.log", "unit-tests.log", "native-proof.log"):
                  log.write(("\nLog: " + name + "\n").encode())
                  log.write((evidence / name).read_bytes())
          metadata = {
              "schema_version": 1, "source_commit": fixed_source, "target": "linux/amd64",
              "image_id": image, "binary_bytes": (output / "bootstrap").stat().st_size,
              "binary_sha256": digest(output / "bootstrap"),
              "dockerfile_sha256": digest(source / "browser-single/Dockerfile"),
              "cargo_lock_sha256": digest(source / "Cargo.lock"),
              "bootstrap_source_sha256": digest(source / "tools/bootstrap.rs"),
              "bootstrap_tests_sha256": digest(source / "tools/bootstrap_tests.rs"),
              "timeout_scope": "bootstrap_model_post_and_get",
              "default_model_timeout_seconds": 5, "min_model_timeout_seconds": 5,
              "max_model_timeout_seconds": 30, "browser_model_timeout_seconds": 30,
              "native_tests": "passed", "native_test_log_sha256": digest(output / "native-tests.log"),
              "proof_source_commit": "b1de389203c9d110d9b9e8012f613bb439e2877f",
              "packaging_commit": "427ef0305c48e094c2873cd3ce380f7f0e3d5683",
              "native_proof_sha256": digest(evidence / "native-result.json"),
              "native_harness_sha256": digest(evidence / "native-proof.py"),
              "openfga_binary_sha256": proof["openfga_binary_sha256"],
              "workflow_commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "browser_acceptance_verified": False}
          (output / "build.json").write_text(json.dumps(metadata, indent=2) + "\n")
          (output / "SOURCE.txt").write_text(
              "Bootstrap-only native artifact; not browser acceptance proof.\n"
              "Rust source commit: " + fixed_source + "\n"
              "Tested native image: " + image + "\n"
              "Real-response harness: b1de389203c9d110d9b9e8012f613bb439e2877f\n"
              "Probe and acceptance are not exported for replacement in the retained browser rootfs.\n")
          print(json.dumps(metadata, sort_keys=True), flush=True)
          PY
      - name: Retain the four-file verified bootstrap overlay
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-bootstrap
          path: artifacts/browser-bootstrap/
          if-no-files-found: error
          retention-days: 7
      - name: Retain logs and remove only containers owned by this run
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p artifacts/native-bootstrap
          for container in native-bootstrap-proxy native-bootstrap-stack native-bootstrap-export; do
            owner=$(docker inspect -f '{{index .Config.Labels "io.authzlab.native-bootstrap-run"}}' "$container" 2>/dev/null || true)
            if [[ "$owner" != "$GITHUB_RUN_ID" ]]; then continue; fi
            docker logs "$container" > "artifacts/native-bootstrap/$container-timeout.log" 2>&1 || true
            if [[ "$container" == native-bootstrap-stack ]]; then
              docker cp "$container:/tmp/browser-lab/initdb.log" artifacts/native-bootstrap/initdb.log || true
              docker cp "$container:/tmp/browser-lab/postgres.log" artifacts/native-bootstrap/postgres.log || true
            fi
            docker rm -f "$container" || true
          done
      - name: Save native evidence even when formatting, build or protocol fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-bootstrap-model-evidence
          path: artifacts/native-bootstrap/
          if-no-files-found: error
          retention-days: 7
