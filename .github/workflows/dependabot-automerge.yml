name: Dependabot Automerge

# workflow_run is intentional: no checkout, artifacts, or PR-controlled execution.
# The native gates and --match-head-commit bind the write to the checked commit.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI, Workflow Security, "Secret scan", "Delivery verification", CodeQL]
    types: [completed]

# Metadata only: never check out PR code or consume its artifacts here.
permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automerge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable native auto-merge for the checked Dependabot commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo 'No associated pull request; nothing to merge.'
            exit 0
          fi
          info="$(gh pr view "$pr" --repo "$REPO" --json author,isCrossRepository,headRefOid,baseRefName,isDraft,state,statusCheckRollup)"
          if ! jq -e --arg sha "$CHECKED_SHA" '
            (.author.login == "app/dependabot" or .author.login == "dependabot[bot]") and
            .isCrossRepository == false and .baseRefName == "main" and
            .state == "OPEN" and .isDraft == false and .headRefOid == $sha and
            (["ci-gate", "workflow-security-gate", "gitleaks"] -
              [.statusCheckRollup[] | select(.status == "COMPLETED" and .conclusion == "SUCCESS") | .name] | length == 0) and
            all(.statusCheckRollup[];
              if .__typename == "CheckRun" then
                .status == "COMPLETED" and
                (.conclusion == "SUCCESS" or .conclusion == "NEUTRAL" or .conclusion == "SKIPPED")
              elif .__typename == "StatusContext" then .state == "SUCCESS"
              else false end)
          ' <<< "$info" >/dev/null; then
            echo 'The current Dependabot commit has not passed both required gates.'
            exit 0
          fi
          # GitHub Actions tokens can read branch metadata but not the
          # administration-only /branches/main/protection endpoint (HTTP 403).
          # Check the published protection summary and let GitHub enforce its
          # native branch-protection/ruleset policy at merge time.
          if ! branch="$(gh api "repos/$REPO/branches/main")"; then
            echo 'Cannot read target branch metadata; no automatic merge.'
            exit 0
          fi
          if ! jq -e '
            .protected == true and
            (["ci-gate", "workflow-security-gate", "gitleaks"] -
              [.protection.required_status_checks.checks[]? |
                select(.app_id == 15368) | .context] | length == 0)
          ' <<< "$branch" >/dev/null; then
            echo 'Native branch protection with all required security gates is missing.'
            exit 0
          fi

          # Keep the mutation pinned to a fully checked, bot-signed SHA and a
          # current main commit. Never use this privileged job to run PR code.
          commits="$(gh api "repos/$REPO/pulls/$pr/commits?per_page=100" --paginate --slurp)"
          if ! jq -e --arg sha "$CHECKED_SHA" '
            add | length > 0 and .[-1].sha == $sha and
            all(.[]; .author.login == "dependabot[bot]" and
              .committer.login == "web-flow" and
              .commit.verification.verified == true)
          ' <<< "$commits" >/dev/null; then
            echo 'Unsigned or non-Dependabot commits; no automatic merge.'
            exit 0
          fi
          base="$(jq -r '.commit.sha' <<< "$branch")"
          comparison="$(gh api "repos/$REPO/compare/$base...$CHECKED_SHA")"
          if ! jq -e --arg base "$base" '
            .behind_by == 0 and .merge_base_commit.sha == $base
          ' <<< "$comparison" >/dev/null; then
            echo 'Dependabot must refresh after main changed; no automatic merge.'
            exit 0
          fi
          # GitHub native auto-merge still enforces branch protection, and
          # --match-head-commit rejects stale or swapped PR commits.
          gh pr merge "$pr" --repo "$REPO" --auto --squash \
            --match-head-commit "$CHECKED_SHA"
