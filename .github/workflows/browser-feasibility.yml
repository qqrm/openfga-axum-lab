name: Manual browser container feasibility
on: workflow_dispatch
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify converter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/c2w
          cd /tmp/c2w
          gh release download v0.8.5 --repo container2wasm/container2wasm --pattern container2wasm-v0.8.5-linux-amd64.tar.gz --pattern SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          tar -xzf container2wasm-v0.8.5-linux-amd64.tar.gz
      - name: Convert a minimal container
        run: |
          mkdir -p browser-artifact
          /tmp/c2w/c2w --to-js alpine:3.20 browser-artifact/
          du -ah browser-artifact | sort -h
      - name: Save experiment output
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-container-feasibility
          path: browser-artifact/
          retention-days: 1
