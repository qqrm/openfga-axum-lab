name: Prepare verified release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New version tag, for example v0.1.0-rc.1 (must match Cargo version)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - name: Require reviewed environment and successful exact-SHA checks
        run: |
          registry_config=$(mktemp -d "$RUNNER_TEMP/authzlab-registry.XXXXXX")
          echo "DOCKER_CONFIG=$registry_config" >> "$GITHUB_ENV"
          mkdir -p artifacts
          cargo +1.99.1 build --locked --bin lab-tool
          target/debug/lab-tool delivery-policy tag "$RELEASE_TAG"
          version=$(cargo +1.99.1 metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "openfga-axum-lab") | .version')
          test "$RELEASE_TAG" = "v$version" || [[ "$RELEASE_TAG" == "v$version-rc."* ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          gh api "repos/$GITHUB_REPOSITORY/environments/release" > artifacts/environment.json
          target/debug/lab-tool delivery-policy environment artifacts/environment.json release
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > artifacts/checks.json
          target/debug/lab-tool delivery-policy runs artifacts/checks.json "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" > artifacts/tag-refs.json
          test "$(jq --arg ref "refs/tags/$RELEASE_TAG" '[.[] | select(.ref == $ref)] | length' artifacts/tag-refs.json)" = 0
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo 'Release already exists; refusing replacement'; exit 1; fi
      - name: Build once and resolve dependency identities
        run: |
          docker build --build-arg APP_REVISION="$GITHUB_SHA" -t authzlab-release:ci .
          docker pull postgres:17-bookworm
          docker pull openfga/openfga:v1.10.3
          {
            echo "POSTGRES_IMAGE=$(docker image inspect postgres:17-bookworm --format '{{index .RepoDigests 0}}')"
            echo "OPENFGA_IMAGE=$(docker image inspect openfga/openfga:v1.10.3 --format '{{index .RepoDigests 0}}')"
            echo "DELIVERY_IMAGE=$(docker image inspect authzlab-release:ci --format '{{.Id}}')"
          } >> "$GITHUB_ENV"
      - name: Test the actual candidate image
        run: cargo +1.99.1 nextest run --locked --release --profile ci --test delivery --run-ignored only --success-output immediate
      - name: Push candidate and verify fresh authenticated pull
        run: |
          image_tag="ghcr.io/${GITHUB_REPOSITORY,,}:candidate-$GITHUB_RUN_ID"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag authzlab-release:ci "$image_tag"
          docker push "$image_tag"
          image=$(docker image inspect "$image_tag" --format '{{index .RepoDigests 0}}')
          docker image rm "$image_tag" authzlab-release:ci
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{.Id}}')" = "$DELIVERY_IMAGE"
          {
            echo "PUBLISHED_IMAGE=$image"
            echo "DELIVERY_IMAGE=$image"
          } >> "$GITHUB_ENV"
      - name: Verify pulled distribution, not a rebuild
        run: cargo +1.99.1 nextest run --locked --release --profile ci --test delivery --run-ignored only --success-output immediate
      - name: Package a complete image-only distribution
        run: |
          mkdir -p dist/package/db dist/package/docs
          jq -n --arg tag "$RELEASE_TAG" --arg revision "$GITHUB_SHA" --arg image "$PUBLISHED_IMAGE" --arg pg "$POSTGRES_IMAGE" --arg fga "$OPENFGA_IMAGE" '{schema:1,tag:$tag,revision:$revision,image:$image,postgres_image:$pg,openfga_image:$fga}' > dist/manifest.json
          target/debug/lab-tool delivery-policy manifest dist/manifest.json "$RELEASE_TAG"
          cp compose.release.yaml README.md INTENT.md dist/package/
          cp db/init.sql dist/package/db/
          cp docs/*.md dist/package/docs/
          cp dist/manifest.json dist/package/
          printf 'LAB_IMAGE=%s\nPOSTGRES_IMAGE=%s\nOPENFGA_IMAGE=%s\n' "$PUBLISHED_IMAGE" "$POSTGRES_IMAGE" "$OPENFGA_IMAGE" > dist/package/images.env
          tar -czf "dist/delivery-$RELEASE_TAG.tar.gz" -C dist/package .
          (cd dist && sha256sum "delivery-$RELEASE_TAG.tar.gz" manifest.json > SHA256SUMS)
          printf 'Verified source: %s\n\nImage: %s\n\nDraft candidate: not deployed, not a published stable release. See docs/delivery.md.\n' "$GITHUB_SHA" "$PUBLISHED_IMAGE" > dist/NOTES.md
          flags=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "dist/delivery-$RELEASE_TAG.tar.gz" dist/manifest.json dist/SHA256SUMS --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file dist/NOTES.md "${flags[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-candidate-evidence
          path: |
            artifacts/
            dist/
          retention-days: 30
      - name: Remove temporary registry credentials
        if: always()
        run: |
          if test -n "${DOCKER_CONFIG:-}"; then rm -rf "$DOCKER_CONFIG"; fi
