name: Read pinned kernel RNG configuration
on:
  push:
    branches: [diag/read-kernel-rng-config]
    paths: [.github/workflows/read-kernel-rng-config.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: read-kernel-rng-config
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'qqrm/openfga-axum-lab' && github.ref == 'refs/heads/diag/read-kernel-rng-config'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify completed source, ZIP and exact config; print bounded RNG symbols
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import re
          import secrets
          import stat
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          REPO = "qqrm/openfga-axum-lab"
          RUN = 43421624199
          HEAD = "1a1d55f0b02519ff0c3eb1ed3f86b2852f2f8e85"
          ARTIFACT = 14033713071
          ARTIFACT_NAME = "browser-acpi-kernel-candidate"
          ZIP_BYTES = 3669750
          ZIP_SHA256 = "51b42d5fb8894930f9344f39754968fd8ed73b103d0a818c45ab4d2bb22edf64"
          MEMBER = "kernel/linux.config"
          CONFIG_BYTES = 75338
          CONFIG_SHA256 = "fbee1ad0bc5fb73f2ca82ba98fa045b76ff19e67a148b40cb93b63916c2ad9b8"
          API = "https://api.github.com/repos/" + REPO
          TOKEN = os.environ.pop("GH_TOKEN")
          OUTPUT_LIMIT = 16 * 1024
          output_bytes = 0
          stop_token = secrets.token_hex(24)
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          def emit(kind, value):
              global output_bytes
              line = "KERNEL_RNG_CONFIG " + json.dumps(
                  {"kind": kind, "value": value}, ensure_ascii=True, separators=(",", ":"))
              output_bytes += len(line.encode("utf-8")) + 1
              require(output_bytes <= OUTPUT_LIMIT, "Bounded diagnostic output limit exceeded")
              print(line, flush=True)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect)
          
          def api_request(path):
              require(path.startswith("/actions/"), "Unexpected API path")
              return urllib.request.Request(API + path, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + TOKEN,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "pinned-kernel-config-reader",
              })
          
          def get_json(path):
              try:
                  with opener.open(api_request(path), timeout=20) as response:
                      require(response.status == 200, "Unexpected API status")
                      raw = response.read(1024 * 1024 + 1)
              except urllib.error.HTTPError as error:
                  raise RuntimeError("GitHub metadata request failed: HTTP " + str(error.code)) from None
              except urllib.error.URLError:
                  raise RuntimeError("GitHub metadata request failed") from None
              require(len(raw) <= 1024 * 1024, "Metadata response exceeded bound")
              return json.loads(raw.decode("utf-8"))
          
          def download_zip():
              try:
                  with opener.open(api_request("/actions/artifacts/" + str(ARTIFACT) + "/zip"),
                                   timeout=20):
                      raise RuntimeError("Expected one artifact storage redirect")
              except urllib.error.HTTPError as error:
                  require(error.code == 302, "Unexpected artifact redirect status")
                  location = error.headers.get("Location", "")
              except urllib.error.URLError:
                  raise RuntimeError("Artifact redirect request failed") from None
              parsed = urllib.parse.urlsplit(location)
              hostname = (parsed.hostname or "").lower()
              require(parsed.scheme == "https" and parsed.username is None and
                      parsed.password is None and parsed.port in (None, 443) and not parsed.fragment,
                      "Unsafe artifact storage URL")
              require(hostname.endswith(".blob.core.windows.net") or
                      hostname.endswith(".actions.githubusercontent.com"),
                      "Unexpected artifact storage host")
              # New request with no Authorization; redirects remain disabled. Never print location.
              request = urllib.request.Request(location, headers={"User-Agent": "pinned-kernel-config-reader"})
              try:
                  with opener.open(request, timeout=30) as response:
                      require(response.status == 200, "Unexpected artifact storage status")
                      length = response.headers.get("Content-Length")
                      require(length is None or int(length) == ZIP_BYTES, "Unexpected ZIP Content-Length")
                      raw = response.read(ZIP_BYTES + 1)
              except urllib.error.HTTPError as error:
                  raise RuntimeError("Artifact storage request failed: HTTP " + str(error.code)) from None
              except urllib.error.URLError:
                  raise RuntimeError("Artifact storage request failed") from None
              require(len(raw) == ZIP_BYTES, "ZIP byte count mismatch")
              require(hashlib.sha256(raw).hexdigest() == ZIP_SHA256, "ZIP SHA256 mismatch")
              return raw
          
          print("::stop-commands::" + stop_token, flush=True)
          try:
              require(os.environ.get("GITHUB_RUN_ATTEMPT") == "1", "Reader reruns are not authorized")
              run = get_json("/actions/runs/" + str(RUN))
              require(run["id"] == RUN and run["head_sha"] == HEAD and
                      run["run_attempt"] == 1 and run["event"] == "push" and
                      run["status"] == "completed" and run["conclusion"] == "success" and
                      run["head_branch"] == "diag/build-acpi-kernel-379e" and
                      run["repository"]["full_name"] == REPO,
                      "Source run identity or terminal outcome mismatch")
              artifact = get_json("/actions/artifacts/" + str(ARTIFACT))
              require(artifact["id"] == ARTIFACT and artifact["name"] == ARTIFACT_NAME and
                      artifact["size_in_bytes"] == ZIP_BYTES and artifact["expired"] is False and
                      artifact["digest"] == "sha256:" + ZIP_SHA256,
                      "Artifact metadata mismatch")
              owner_run = artifact["workflow_run"]
              require(owner_run["id"] == RUN and owner_run["head_sha"] == HEAD and
                      owner_run["repository_id"] == run["repository"]["id"] and
                      owner_run["head_repository_id"] == run["repository"]["id"],
                      "Artifact source binding mismatch")
              archive = download_zip()
              with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
                  members = zipped.infolist()
                  require(0 < len(members) <= 128, "Unexpected ZIP member count")
                  names = [item.filename for item in members]
                  require(len(set(names)) == len(names), "Duplicate ZIP names")
                  for name in names:
                      require(name and "\x00" not in name and "\\" not in name and
                              not name.startswith("/") and
                              not any(part in (".", "..") for part in name.split("/")),
                              "Unsafe ZIP member name")
                  require(names.count(MEMBER) == 1, "Exact config member missing")
                  info = zipped.getinfo(MEMBER)
                  mode = info.external_attr >> 16
                  require(not info.is_dir() and not (info.flag_bits & 1) and
                          stat.S_IFMT(mode) in (0, stat.S_IFREG) and
                          info.file_size == CONFIG_BYTES and
                          0 < info.compress_size <= ZIP_BYTES,
                          "Unexpected config member type, size or encoding")
                  with zipped.open(info) as stream:
                      config = stream.read(CONFIG_BYTES + 1)
                      require(len(config) == CONFIG_BYTES and stream.read(1) == b"",
                              "Config read exceeded exact bound")
              require(hashlib.sha256(config).hexdigest() == CONFIG_SHA256, "Config SHA256 mismatch")
              text = config.decode("utf-8")
              require("\x00" not in text, "NUL in config")
              selected = []
              values = {}
              for number, line in enumerate(text.splitlines(), 1):
                  match = re.fullmatch(r"(CONFIG_[A-Z0-9_]+)=(.*)|# (CONFIG_[A-Z0-9_]+) is not set", line)
                  if match is None:
                      continue
                  name = match.group(1) or match.group(3)
                  require(name not in values, "Duplicate config symbol")
                  value = match.group(2) if match.group(1) else "n"
                  values[name] = value
                  wanted = (name.startswith(("CONFIG_HW_RANDOM", "CONFIG_VIRTIO", "CONFIG_RANDOM")) or
                            (name.startswith("CONFIG_CRYPTO") and "SEED" in name) or
                            (name.startswith(("CONFIG_ARCH_", "CONFIG_HAVE_ARCH_", "CONFIG_X86_")) and
                             ("RANDOM" in name or "RNG" in name)))
                  if wanted:
                      selected.append({"line": number, "symbol": name, "value": value, "raw": line})
              require(0 < len(selected) <= 128, "Unexpected selected config count")
              required = ["CONFIG_HW_RANDOM", "CONFIG_HW_RANDOM_VIRTIO", "CONFIG_VIRTIO",
                          "CONFIG_VIRTIO_PCI", "CONFIG_RANDOM_TRUST_CPU", "CONFIG_RANDOM_TRUST_BOOTLOADER"]
              require(all(name in values for name in required), "Required RNG/transport symbol missing")
              emit("source", {
                  "scope": "Read-only bytes from one completed kernel build; no archive code is executed.",
                  "run_id": RUN, "head_sha": HEAD, "source_conclusion": run["conclusion"], "attempt": 1,
                  "artifact_id": ARTIFACT, "artifact_name": ARTIFACT_NAME,
                  "zip_bytes": len(archive), "zip_sha256": ZIP_SHA256, "zip_members": len(members),
                  "member": MEMBER, "config_bytes": len(config), "config_sha256": CONFIG_SHA256,
                  "config_lines": len(text.splitlines()), "selected_count": len(selected),
                  "archive_verified": True, "config_verified": True,
                  "vm_starts": 0, "builds": 0, "production_acceptance": False,
              })
              emit("selected_lines", selected)
              emit("required_symbols", {name: values[name] for name in required})
              emit("complete", {"data_validation_passed": True, "output_bytes_before_final_record": output_bytes})
          finally:
              print("::" + stop_token + "::", flush=True)
          
          PY
