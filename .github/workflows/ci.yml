name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --tests --benches
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start test stand
        run: docker compose up -d --build
      - name: Run authorization scenarios
        run: docker compose --profile test run --rm test
      - name: Capture diagnostic latency
        run: python3 scripts/benchmark.py
      - name: Verify fail closed
        run: |
          docker compose stop openfga
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-demo-user: alice' http://127.0.0.1:3000/dashboards/one)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-demo-user: alice' http://127.0.0.1:3000/dashboards)" = 503
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-latency
          path: artifacts/benchmark.json
          if-no-files-found: ignore
      - name: Clean up
        if: always()
        run: docker compose down -v
