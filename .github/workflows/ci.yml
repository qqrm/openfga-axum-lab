name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: shellcheck scripts/*.sh
      - run: bash scripts/check-tooling.sh
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.67.0'
          args: '--lib'
      - run: bash scripts/kani-negative.sh
  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/browser-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - name: Format and lint the Cargo browser package
        run: |
          cargo fmt --manifest-path browser-demo/Cargo.toml --all -- --check
          cargo clippy --locked --offline --manifest-path browser-demo/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --offline --manifest-path browser-demo/Cargo.toml --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Test the scalar ABI and shared domain using nextest
        run: >-
          cargo nextest run --locked --offline --manifest-path browser-demo/Cargo.toml
          --config-file browser-demo/.config/nextest.toml --profile ci --success-output immediate
      - name: Build browser API docs and execute examples
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --offline --manifest-path browser-demo/Cargo.toml --no-deps
          cargo test --locked --offline --manifest-path browser-demo/Cargo.toml --doc
      - run: bash scripts/build-browser-demo.sh
      - run: node scripts/check-browser-demo.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-cargo-results
          path: |
            target/browser-demo/nextest/ci/junit.xml
            target/browser-demo/doc/
          if-no-files-found: ignore
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --tests --benches
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build domain documentation and execute examples
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --no-deps --document-private-items
          cargo test --locked --doc
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: |
            cargo-nextest@0.9.151
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-machete@0.9.2
          fallback: none
      - run: cargo nextest run --locked --profile ci
      - run: bash scripts/audit-dependencies.sh
      - run: bash scripts/audit-negative.sh
      - run: cargo deny check advisories bans sources
      - run: bash scripts/deny-negative.sh
      - run: cargo machete
      - run: bash scripts/machete-negative.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rust-nextest-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rust-api-docs
          path: target/doc/
          if-no-files-found: ignore
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - name: Run real-stack scenarios, cache races, deployment and latency in Rust
        run: >-
          cargo nextest run --locked --release --profile ci
          --test system --test cache_replicas --test compose_deployment --test performance
          --run-ignored only -E 'not test(paired_aa_calibration)'
          --success-output immediate
      - name: Record Docker engine
        if: always()
        run: |
          mkdir -p artifacts
          docker version > artifacts/docker-version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-nextest-results
          path: |
            artifacts/
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
  ci-gate:
    if: always()
    needs: [rust, integration, shell, formal, browser-demo]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          BROWSER_RESULT: ${{ needs.browser-demo.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$SHELL_RESULT" = success
          test "$FORMAL_RESULT" = success
          test "$BROWSER_RESULT" = success
