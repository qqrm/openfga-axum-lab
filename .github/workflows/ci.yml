name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh
      - run: bash scripts/check-tooling.sh
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.67.0'
          args: '--lib'
      - run: bash scripts/kani-negative.sh
  browser-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: bash scripts/build-browser-demo.sh
      - run: node scripts/check-browser-demo.mjs
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --tests --benches
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: |
            cargo-nextest
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-machete@0.9.2
          fallback: none
      - run: cargo nextest run --locked --profile ci
      - run: bash scripts/audit-dependencies.sh
      - run: bash scripts/audit-negative.sh
      - run: cargo deny check advisories bans sources
      - run: bash scripts/deny-negative.sh
      - run: cargo machete
      - run: bash scripts/machete-negative.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rust-nextest-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
          fallback: none
      - name: Run real-stack scenarios, cache races, deployment and latency in Rust
        run: >-
          cargo nextest run --locked --release --profile ci
          --test system --test cache_replicas --test compose_deployment --test performance
          --run-ignored only -E 'not test(paired_aa_calibration)'
          --success-output immediate
      - name: Record Docker engine
        if: always()
        run: |
          mkdir -p artifacts
          docker version > artifacts/docker-version.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-nextest-results
          path: |
            artifacts/
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
  ci-gate:
    if: always()
    needs: [rust, integration, shell, formal, browser-demo]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          BROWSER_RESULT: ${{ needs.browser-demo.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$SHELL_RESULT" = success
          test "$FORMAL_RESULT" = success
          test "$BROWSER_RESULT" = success
