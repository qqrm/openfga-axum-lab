name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh
      - run: bash scripts/check-tooling.sh
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: '0.67.0'
          args: '--lib'
      - run: bash scripts/kani-negative.sh
  browser-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: bash scripts/build-browser-demo.sh
      - run: node scripts/check-browser-demo.mjs
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --tests --benches
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: |
            cargo-nextest
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-machete@0.9.2
          fallback: none
      - run: cargo nextest run --locked
      - run: bash scripts/audit-dependencies.sh
      - run: bash scripts/audit-negative.sh
      - run: cargo deny check advisories bans sources
      - run: bash scripts/deny-negative.sh
      - run: cargo machete
      - run: bash scripts/machete-negative.sh
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start test stand
        run: docker compose up -d --build
      - name: Run authorization scenarios
        run: docker compose --profile test run --rm test
      - name: Verify data and authorization survive restart
        run: |
          python3 scripts/persistence.py before
          docker compose stop -t 2 app openfga postgres
          docker compose up -d
          python3 scripts/persistence.py after
      - name: Verify pending creation recovery
        run: |
          docker compose exec -T postgres psql -U petlab -d petlab -v ON_ERROR_STOP=1 < scripts/recovery-fixture.sql
          docker compose restart -t 2 app
          python3 scripts/recovery.py
      - name: Verify pending deletion recovery
        run: |
          docker compose exec -T postgres psql -U petlab -d petlab -v ON_ERROR_STOP=1 < scripts/deletion-fixture.sql
          docker compose restart -t 2 app
          docker compose --profile test run --rm --no-deps test python /app/scripts/deletion-recovery.py
      - name: Capture diagnostic latency
        run: |
          python3 scripts/benchmark.py
          docker stats --no-stream --format '{{json .}}' > artifacts/docker-stats.jsonl
          docker version > artifacts/docker-version.txt
          docker compose images > artifacts/images.txt
      - name: Verify fail closed
        run: |
          docker compose stop openfga
          python3 scripts/failclosed.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diagnostic-latency
          path: artifacts/
          if-no-files-found: ignore
      - name: Clean up
        if: always()
        run: docker compose down -v
  ci-gate:
    if: always()
    needs: [rust, integration, shell, formal, browser-demo]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          BROWSER_RESULT: ${{ needs.browser-demo.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$SHELL_RESULT" = success
          test "$FORMAL_RESULT" = success
          test "$BROWSER_RESULT" = success
