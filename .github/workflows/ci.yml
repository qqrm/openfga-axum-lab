name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh
      - run: bash scripts/check-tooling.sh
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: '0.68.0'
          args: '--lib'
      - run: bash scripts/kani-negative.sh
  browser-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: bash scripts/build-browser-demo.sh
      - run: node scripts/check-browser-demo.mjs
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --tests --benches
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features --features http -- -D warnings
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: |
            cargo-nextest
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-machete@0.9.2
          fallback: none
      - run: cargo nextest run --locked --profile ci
      - name: Verify the Openlane model and both adapters against pinned OpenFGA
        run: bash scripts/test-openlane-model.sh
      - run: bash scripts/audit-dependencies.sh
      - run: bash scripts/audit-negative.sh
      - run: cargo deny check advisories bans sources
      - run: bash scripts/deny-negative.sh
      - run: cargo machete
      - run: bash scripts/machete-negative.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rust-nextest-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
  integration:
    strategy:
      fail-fast: false
      matrix:
        transport: [grpc, http]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
          fallback: none
      - name: Run real-stack scenarios, cache races, deployment and latency in Rust
        env:
          FGA_TRANSPORT: ${{ matrix.transport }}
        run: >-
          cargo nextest run --locked --release --profile ci
          --no-default-features --features "$FGA_TRANSPORT"
          --test system --test cache_replicas --test compose_deployment --test performance
          --run-ignored only -E 'not test(paired_aa_calibration)'
          --success-output immediate
      - name: Record Docker engine
        if: always()
        run: |
          mkdir -p artifacts
          docker version > artifacts/docker-version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-nextest-results-${{ matrix.transport }}
          path: |
            artifacts/
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
  browser-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: grpc
            port: 8081
          - transport: http
            port: 8080
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: openlane-browser-${{ matrix.transport }}
      FGA_TRANSPORT: ${{ matrix.transport }}
      FGA_APP_URL: http://openfga:${{ matrix.port }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate credentials for this disposable test stack
        run: |
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          DEMO_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$DEMO_PASSWORD"
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "DEMO_PASSWORD=$DEMO_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Install the locked browser test dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start real Axum, PostgreSQL and OpenFGA
        run: |
          docker compose up -d --build app
          for _ in $(seq 1 90); do
            if docker compose exec -T app lab-tool probe; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Exercise the browser against the real API
        working-directory: e2e
        run: npm test
      - name: Collect logs and remove only this disposable project
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/browser-stack.log 2>&1 || true
          docker compose down --volumes --remove-orphans
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-e2e-${{ matrix.transport }}
          path: |
            artifacts/browser-*
            e2e/test-results/
          if-no-files-found: ignore
  ci-gate:
    if: always()
    needs: [rust, integration, shell, formal, browser-demo, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          BROWSER_RESULT: ${{ needs.browser-demo.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$SHELL_RESULT" = success
          test "$FORMAL_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$BROWSER_E2E_RESULT" = success
