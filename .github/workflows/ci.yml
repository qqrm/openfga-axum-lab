name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: shellcheck scripts/*.sh
      - run: bash scripts/check-tooling.sh
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: '0.68.0'
          args: '--lib'
      - run: bash scripts/kani-negative.sh
  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/browser-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - name: Format and lint the Cargo browser package
        run: |
          cargo fmt --manifest-path browser-demo/Cargo.toml --all -- --check
          cargo clippy --locked --offline --manifest-path browser-demo/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --offline --manifest-path browser-demo/Cargo.toml --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Test the scalar ABI and shared domain using nextest
        run: >-
          cargo nextest run --locked --offline --manifest-path browser-demo/Cargo.toml
          --config-file browser-demo/.config/nextest.toml --profile ci --success-output immediate
      - name: Require the browser JUnit report
        run: test -s browser-demo/target/nextest/ci/junit.xml
      - name: Build browser API docs and execute examples
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --offline --manifest-path browser-demo/Cargo.toml --no-deps
          cargo test --locked --offline --manifest-path browser-demo/Cargo.toml --doc
      - run: bash scripts/build-browser-demo.sh
      - run: node scripts/check-browser-demo.mjs
      - name: Test browser probe static server
        run: node --test browser-single/probe/serve.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-cargo-results
          path: |
            browser-demo/target/nextest/ci/junit.xml
            target/browser-demo/doc/
          if-no-files-found: error
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --tests --benches
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features --features http -- -D warnings
      - name: Build domain documentation and execute examples
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --no-deps --document-private-items
          cargo test --locked --doc
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: |
            cargo-nextest@0.9.151
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-machete@0.9.2
          fallback: none
      - run: cargo nextest run --locked --all-features --profile ci
      - name: Test Lakekeeper Criterion experiment safety helpers (no Docker or performance run)
        run: cargo test --locked --example catalog_cache_experiment
      - name: Verify the Openlane model and both adapters against pinned OpenFGA
        run: bash scripts/test-openlane-model.sh
      - run: bash scripts/audit-dependencies.sh
      - run: bash scripts/audit-negative.sh
      - run: cargo deny check advisories bans sources
      - run: bash scripts/deny-negative.sh
      - run: cargo machete
      - run: bash scripts/machete-negative.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-nextest-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-api-docs
          path: target/doc/
          if-no-files-found: ignore
  integration:
    strategy:
      fail-fast: false
      matrix:
        transport: [grpc, http]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - name: Run real-stack scenarios, cache races, deployment and latency in Rust
        env:
          FGA_TRANSPORT: ${{ matrix.transport }}
        run: >-
          cargo nextest run --locked --release --profile ci
          --no-default-features --features "$FGA_TRANSPORT"
          --test system --test cache_replicas --test authorization_migration --test compose_deployment --test performance
          --run-ignored only -E 'not test(paired_aa_calibration)'
          --success-output immediate
      - name: Record Docker engine
        if: always()
        run: |
          mkdir -p artifacts
          docker version > artifacts/docker-version.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-nextest-results-${{ matrix.transport }}
          path: |
            artifacts/
            target/nextest/ci/junit.xml
          if-no-files-found: ignore
  browser-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: grpc
            port: 8081
          - transport: http
            port: 8080
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FGA_TRANSPORT: ${{ matrix.transport }}
      FGA_APP_URL: http://openfga:${{ matrix.port }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate credentials for this disposable test stack
        run: |
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          DEMO_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$DEMO_PASSWORD"
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "DEMO_PASSWORD=$DEMO_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Install the locked browser test dependencies
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Run browser scenarios against real Axum, PostgreSQL and OpenFGA
        run: bash scripts/browser-e2e.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-e2e-${{ matrix.transport }}
          path: |
            artifacts/browser-*
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
          components: llvm-tools-preview
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: |
            cargo-nextest@0.9.151
            cargo-llvm-cov@0.9.1
          fallback: none
      - name: Start a clean native coverage measurement
        run: |
          cargo llvm-cov clean --workspace
          mkdir -p artifacts/coverage
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            cargo llvm-cov --version
            cargo nextest --version
          } > artifacts/coverage/environment.txt
      - name: Measure native unit and contract tests
        id: unit_tests
        run: >-
          cargo llvm-cov nextest --locked --no-report --profile ci
          --workspace --lib --bins --tests
      - name: Preserve unit test results before the next run
        if: always() && steps.unit_tests.outcome != 'skipped'
        run: mv target/nextest/ci/junit.xml artifacts/coverage/unit-junit.xml
      - name: Measure the real Axum children against PostgreSQL and OpenFGA
        id: native_tests
        run: >-
          cargo llvm-cov nextest --locked --no-report --profile ci
          --test system --test cache_replicas --run-ignored only
          --success-output immediate
      - name: Preserve native integration results
        if: always() && steps.native_tests.outcome != 'skipped'
        run: cp target/nextest/ci/junit.xml artifacts/coverage/integration-junit.xml
      - name: Export inspectable native coverage reports
        if: always()
        run: |
          cargo llvm-cov report --html --output-dir artifacts/coverage
          cargo llvm-cov report --json --output-path artifacts/coverage/coverage.json
          cargo llvm-cov report --lcov --output-path artifacts/coverage/lcov.info
          cargo llvm-cov report --text --output-path artifacts/coverage/annotated.txt
          cargo llvm-cov report --show-missing-lines | tee artifacts/coverage/summary.txt
      - name: Require server execution and retained child profiles
        run: |
          for source in main server http/mod http/auth authentication cached_authorizer infrastructure use_cases authorization_migration; do
            jq -e --arg suffix "/src/$source.rs" '
              [.data[].files[] | select(.filename | endswith($suffix))]
              | length > 0 and all(.[]; .summary.functions.covered > 0)
            ' artifacts/coverage/coverage.json
          done
          test -s artifacts/coverage/html/index.html
          test -s artifacts/coverage/lcov.info
          test -s artifacts/coverage/annotated.txt
          find "$CARGO_LLVM_COV_TARGET_DIR" -maxdepth 1 -type f -name 'axum-*.profraw' -size +0c \
            | sort > artifacts/coverage/axum-profiles.txt
          test -s artifacts/coverage/axum-profiles.txt
          (
            cd "$CARGO_LLVM_COV_TARGET_DIR"
            find . -maxdepth 1 -type f -name '*.profraw' -print0 \
              | sort -z | xargs -0 sha256sum
          ) > artifacts/coverage/profiles.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-rust-coverage
          path: |
            artifacts/coverage/
            target/llvm-cov-target/*.profraw
            target/llvm-cov-target/*.profdata
          if-no-files-found: error
  ci-gate:
    if: always()
    needs: [rust, integration, shell, formal, browser-demo, browser-e2e, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          BROWSER_RESULT: ${{ needs.browser-demo.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$SHELL_RESULT" = success
          test "$FORMAL_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$BROWSER_E2E_RESULT" = success
          test "$COVERAGE_RESULT" = success
