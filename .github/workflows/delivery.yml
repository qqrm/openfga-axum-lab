name: Delivery verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2
        with:
          tool: cargo-nextest@0.9.151
          fallback: none
      - name: Validate source and tools
        run: |
          cargo +1.99.1 fmt --all -- --check
          cargo +1.99.1 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.99.1 nextest run --locked --profile ci
      - name: Build candidate once
        run: |
          mkdir -p artifacts
          docker build --build-arg APP_REVISION="$GITHUB_SHA" -t authzlab-candidate:ci .
          image=$(docker image inspect authzlab-candidate:ci --format '{{.Id}}')
          echo "DELIVERY_IMAGE=$image" >> "$GITHUB_ENV"
          docker image inspect authzlab-candidate:ci --format '{{.Id}} {{.Config.User}} {{json .Config.Labels}}' > artifacts/image.txt
      - name: Test packaged image on two disposable stands
        id: delivery_tests
        run: cargo +1.99.1 nextest run --locked --release --profile ci --test delivery --run-ignored only --success-output immediate
      - name: Record environment
        if: always()
        env:
          DELIVERY_TEST_OUTCOME: ${{ steps.delivery_tests.outcome }}
        run: |
          mkdir -p artifacts
          rustc +1.99.1 -Vv > artifacts/rustc.txt
          docker version > artifacts/docker.txt
          git rev-parse HEAD > artifacts/commit.txt
          sha256sum Cargo.lock Dockerfile compose.release.yaml > artifacts/inputs.sha256
          if [ "$DELIVERY_TEST_OUTCOME" = skipped ]; then
            printf 'Packaged-image tests were skipped; dependency images were not pulled.\n' > artifacts/dependencies-skipped.txt
          else
            docker image inspect postgres:17-bookworm openfga/openfga:v1.10.3 --format '{{json .RepoDigests}}' > artifacts/dependencies.jsonl
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: delivery-evidence
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
