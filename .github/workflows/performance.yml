name: Manual performance calibration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  paired-aa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest
          fallback: none
      - name: Require correctness before calibration
        run: cargo nextest run --locked --release --profile ci --test system --run-ignored only --success-output immediate
      - name: Preserve correctness results
        if: always()
        run: |
          mkdir -p artifacts
          if test -f target/nextest/ci/junit.xml; then
            cp target/nextest/ci/junit.xml artifacts/correctness-junit.xml
          fi
      - name: Capture randomized balanced A/A samples
        run: cargo nextest run --locked --release --profile ci --test performance --run-ignored only -E 'test(paired_aa_calibration)' --success-output immediate
      - name: Record Docker engine
        if: always()
        run: |
          mkdir -p artifacts
          docker version > artifacts/docker-version.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: paired-aa
          path: |
            artifacts/
            target/nextest/ci/junit.xml
          if-no-files-found: warn
