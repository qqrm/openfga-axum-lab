name: Secret scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gitleaks-bin
          cd /tmp/gitleaks-bin
          gh release download v8.28.0 --repo gitleaks/gitleaks --pattern gitleaks_8.28.0_linux_x64.tar.gz --pattern gitleaks_8.28.0_checksums.txt
          sha256sum -c --ignore-missing gitleaks_8.28.0_checksums.txt
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          echo /tmp/gitleaks-bin >> "$GITHUB_PATH"
      - run: gitleaks git --log-opts=--all --redact --no-banner
      - run: bash scripts/gitleaks-negative.sh
