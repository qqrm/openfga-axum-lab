# rerun: direct Criterion needs --bench for measured samples
name: One-off Lakekeeper Criterion A/A A/B
on:
  push:
    branches: [experiment/lakekeeper-criterion-run-20261109]
    paths: [.github/workflows/lakekeeper-criterion-one-off.yml]
permissions:
  contents: read
concurrency:
  group: lakekeeper-one-off-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lakekeeper-criterion:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: authz-criterion-${{ github.run_id }}
      COMPOSE_FILE: compose.yaml:compose.cache-lakekeeper.yaml
      FGA_TRANSPORT: http
      AUTHZ_EXPERIMENT_OUT: artifacts/criterion-lakekeeper
      AB_SEED: '2606'
    steps:
      - name: Checkout experiment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.99.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
      - name: Create isolated credentials
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          DEMO_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$DEMO_PASSWORD"
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "DEMO_PASSWORD=$DEMO_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Compile actual Criterion benchmark and experiment driver
        shell: bash
        run: |
          set -euo pipefail
          cargo bench --locked --bench catalog_cache_ab --no-run
          cargo build --locked --release --example catalog_cache_experiment
          test -x target/release/examples/catalog_cache_experiment
          mapfile -t binaries < <(find target/release/deps -maxdepth 1 -type f -name 'catalog_cache_ab-*' -executable | sort)
          if (( ${#binaries[@]} != 1 )); then
            printf 'Expected one Criterion executable, found %s\n' "${#binaries[@]}" >&2
            exit 1
          fi
          printf 'AUTHZ_BENCH_BINARY=%s\n' "$(realpath "${binaries[0]}")" >> "$GITHUB_ENV"
      - name: Build and initialize dedicated real-stack services
        shell: bash
        run: |
          set -euo pipefail
          docker compose build app
          docker compose up -d app
          for i in $(seq 1 180); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/readyz >/dev/null 2>&1; then break; fi
            if (( i == 180 )); then echo "app did not become ready" >&2; exit 1; fi
            sleep 2
          done
          docker compose up -d --no-build app-uncached
          for i in $(seq 1 180); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3001/readyz >/dev/null 2>&1; then break; fi
            if (( i == 180 )); then echo "app-uncached did not become ready" >&2; exit 1; fi
            sleep 2
          done
      - name: Run isolated Lakekeeper A/A and A/B experiment
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --example catalog_cache_experiment
          ./target/release/examples/catalog_cache_experiment
          python3 - <<'PY'
          import json
          path = 'artifacts/criterion-lakekeeper/experiment.json'
          with open(path, encoding='utf8') as f:
              result = json.load(f)
          assert result.get('valid') is True, result.get('failure')
          assert len(result.get('pairs', [])) == 12, len(result.get('pairs', []))
          for pair in result['pairs']:
              assert len(pair['comparisons']) == 2
          print('Valid experiment, 12 paired blocks, two HTTP cases per pair')
          PY
      - name: Gather diagnostic context on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/criterion-lakekeeper
          docker compose ps > artifacts/criterion-lakekeeper/docker-compose-ps.txt 2>&1 || true
          docker compose logs --no-color --tail=150 app app-uncached openfga postgres > artifacts/criterion-lakekeeper/docker-compose-logs.txt 2>&1 || true
      - name: Publish raw Criterion results and correctness evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lakekeeper-criterion-${{ github.run_id }}
          path: artifacts/criterion-lakekeeper/
          if-no-files-found: warn
          retention-days: 7
