name: Browser single-image feasibility

on:
  pull_request:
    paths:
      - browser-single/**
      - .github/workflows/browser-single.yml
  push:
    branches: [main]
    paths:
      - browser-single/**
      - .github/workflows/browser-single.yml
  workflow_dispatch:
    inputs:
      convert:
        description: Convert the smoke-tested image to browser WASM (can be large/slow)
        type: boolean
        required: false
        default: false

permissions:
  contents: read
concurrency:
  group: browser-single-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-optional-convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate entrypoint shell
        run: |
          bash -n browser-single/entrypoint.sh
          shellcheck browser-single/entrypoint.sh
      - name: Build exactly one Linux runtime image
        run: |
          docker buildx build --load --platform linux/amd64 \
            -f browser-single/Dockerfile -t authz-browser-one:ci .
          docker image inspect authz-browser-one:ci \
            --format 'Native image bytes: {{.Size}}'
      - name: Boot all three real services and verify authorization
        run: |
          set -euo pipefail
          docker run --rm -d --name authz-browser-one \
            --shm-size=128m -e BROWSER_LAB_EPHEMERAL=yes \
            -p 127.0.0.1:3000:3000 authz-browser-one:ci
          ready=false
          for attempt in $(seq 1 120); do
            if docker exec authz-browser-one /usr/local/bin/lab-tool probe >/dev/null 2>&1; then
              ready=true
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' authz-browser-one 2>/dev/null || true)" != true ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs authz-browser-one
            echo 'Real-stack readiness was not established' >&2
            exit 1
          fi
          docker exec -e SMOKE_ALLOW_MUTATIONS=true \
            authz-browser-one /usr/local/bin/lab-tool acceptance
          docker stats --no-stream --format 'Memory: {{.MemUsage}}' authz-browser-one
      - name: Download verified container2wasm converter (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.convert == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/c2w
          cd /tmp/c2w
          gh release download v0.8.5 --repo container2wasm/container2wasm \
            --pattern container2wasm-v0.8.5-linux-amd64.tar.gz --pattern SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          tar -xzf container2wasm-v0.8.5-linux-amd64.tar.gz
      - name: Convert tested image into browser assets (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.convert == true
        run: |
          mkdir -p browser-output browser-report
          /tmp/c2w/c2w --to-js authz-browser-one:ci browser-output/
          du -ah browser-output | sort -h | tail -40 | tee browser-report/sizes.txt
          find browser-output -type f | sort > browser-report/files.txt
      - name: Limit browser artifact size
        id: conversion-size
        if: github.event_name == 'workflow_dispatch' && inputs.convert == true
        run: |
          bytes=$(du -sb browser-output | cut -f1)
          printf '%s\n' "$bytes" | tee browser-report/total-bytes.txt
          if (( bytes <= 250 * 1024 * 1024 )); then
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          else
            echo 'upload=false' >> "$GITHUB_OUTPUT"
            echo 'WASM asset exceeds 250 MiB: publishing metadata only' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save small converted browser bundle
        if: steps.conversion-size.outputs.upload == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-one-converted
          path: browser-output/
          if-no-files-found: error
          retention-days: 1
      - name: Save conversion size report
        if: steps.conversion-size.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-one-report
          path: browser-report/
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup and diagnostic logs
        if: always()
        run: |
          docker logs --tail 140 authz-browser-one || true
          docker rm -f authz-browser-one || true
