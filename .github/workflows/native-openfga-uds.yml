name: Native OpenFGA socket compatibility 5d18ed2f

# Isolated native diagnostic. This workflow neither converts WASM nor deploys Pages.
on:
  push:
    branches: [diag/native-openfga-uds-5d18ed2f]
    paths: [.github/workflows/native-openfga-uds.yml]

permissions:
  contents: read
  actions: read

jobs:
  native:
    if: github.repository == 'qqrm/openfga-axum-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: qqrm/openfga-axum-lab
          ref: 5d18ed2fda49fe84a9ac03c7b8571940f0891819
          persist-credentials: false
      - name: Apply only the OpenFGA Unix socket candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5d18ed2fda49fe84a9ac03c7b8571940f0891819
          test "$(git hash-object browser-single/entrypoint.sh)" = a84cf4f8390e4572799b57f84175ef1d3e26fa5b
          mkdir -p artifacts/native-uds
          python3 - <<'PY'
          from pathlib import Path
          path = Path('browser-single/entrypoint.sh')
          source = path.read_text()
          old = 'export OPENFGA_DATASTORE_URI="postgres://authzlab@127.0.0.1:5432/openfga?sslmode=disable"\n'
          new = 'export OPENFGA_DATASTORE_URI="postgres://authzlab@127.0.0.1:5432/openfga?sslmode=disable&host=/tmp/browser-lab"\n'
          if source.count(old) != 1:
              raise SystemExit('Expected one exact DSN preimage')
          path.write_text(source.replace(old, new))
          PY
          test "$(git diff --name-only)" = browser-single/entrypoint.sh
          git diff --check
          bash -n browser-single/entrypoint.sh
          shellcheck browser-single/entrypoint.sh
          printf '%s  %s\n' a894f61fb40563467d0a16409981acb14224c619073f39c42dca233609a78e6d fga/model.json | sha256sum -c -
          git diff -- browser-single/entrypoint.sh > artifacts/native-uds/candidate.patch
      - name: Verify and extract the exact browser OpenFGA .7 executable
        shell: bash
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout 180s python3 - <<'PY'
          import hashlib, json, os, tempfile, urllib.error, urllib.request, zipfile
          from pathlib import Path
          from urllib.parse import urlsplit
          
          REPO = 'qqrm/openfga-axum-lab'
          RUN = 43388600974
          HEAD = '5d18ed2fda49fe84a9ac03c7b8571940f0891819'
          AID = 14022525580
          ZIP_SIZE = 260792741
          ZIP_SHA = '972dd8399bb8cc85f75412d824f14a02241dbec4bff7cb76afafa9edf98a9900'
          MEMBER = 'artifacts/browser-openfga/openfga'
          BIN_SIZE = 63054008
          BIN_SHA = '57ef124e5b339dcf1c3dbcbe2c3083c03f5db74a799a1472014e875292cc1066'
          
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect())
          
          def request(path):
              return urllib.request.Request('https://api.github.com/repos/' + REPO + path, headers={
                  'Authorization': 'Bearer ' + os.environ['ARTIFACT_READ_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'native-openfga-uds-compatibility'})
          
          def api(path):
              try:
                  with opener.open(request(path), timeout=20) as response:
                      raw = response.read(1024**2 + 1)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  raise SystemExit('GitHub metadata request failed') from None
              require(len(raw) <= 1024**2, 'Oversize metadata')
              return json.loads(raw)
          
          run = api('/actions/runs/' + str(RUN))
          require(run['id'] == RUN and run['head_sha'] == HEAD and run['run_attempt'] == 1
                  and run['status'] == 'completed' and run['event'] == 'pull_request'
                  and run['conclusion'] == 'failure', 'Source run identity mismatch')
          artifact = api('/actions/artifacts/' + str(AID))
          require(artifact['id'] == AID and artifact['name'] == 'pages-browser-vm-evidence'
                  and not artifact['expired'] and artifact['workflow_run']['id'] == RUN
                  and artifact['workflow_run']['head_sha'] == HEAD
                  and artifact['size_in_bytes'] == ZIP_SIZE
                  and artifact['digest'] == 'sha256:' + ZIP_SHA, 'Artifact identity mismatch')
          
          try:
              opener.open(request('/actions/artifacts/' + str(AID) + '/zip'), timeout=20)
              raise SystemExit('Expected artifact redirect')
          except urllib.error.HTTPError as error:
              require(error.code == 302, 'Unexpected artifact redirect status')
              location = error.headers.get('Location', '')
              error.close()
          storage = urlsplit(location)
          host = storage.hostname or ''
          require(storage.scheme == 'https' and storage.port in (None, 443)
                  and storage.username is None and storage.password is None
                  and (host.endswith('.blob.core.windows.net') or host.endswith('.actions.githubusercontent.com')),
                  'Unexpected artifact storage address')
          
          with tempfile.TemporaryFile() as archive:
              size, digest = 0, hashlib.sha256()
              try:
                  # A new unauthenticated request keeps the GitHub token off storage.
                  with opener.open(urllib.request.Request(location), timeout=30) as response:
                      while block := response.read(1024**2):
                          size += len(block)
                          require(size <= ZIP_SIZE, 'Oversize ZIP')
                          digest.update(block)
                          archive.write(block)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  raise SystemExit('Artifact download failed') from None
              require(size == ZIP_SIZE and digest.hexdigest() == ZIP_SHA, 'ZIP integrity mismatch')
              archive.seek(0)
              destination = Path('artifacts/native-uds-input')
              destination.mkdir(mode=0o755)
              destination.chmod(0o755)
              binary = destination / 'openfga'
              with zipfile.ZipFile(archive) as package:
                  names = package.namelist()
                  require(len(names) <= 10000 and len(names) == len(set(names)), 'Invalid ZIP member list')
                  require(names.count(MEMBER) == 1, 'Exact binary member missing')
                  info = package.getinfo(MEMBER)
                  require(info.file_size == BIN_SIZE, 'Binary metadata size mismatch')
                  size, digest = 0, hashlib.sha256()
                  with package.open(info) as source, binary.open('xb') as target:
                      while block := source.read(1024**2):
                          size += len(block)
                          require(size <= BIN_SIZE, 'Oversize binary')
                          digest.update(block)
                          target.write(block)
                  require(size == BIN_SIZE and digest.hexdigest() == BIN_SHA, 'Binary integrity mismatch')
              binary.chmod(0o555)
          
          proof = {'source_run': RUN, 'source_head': HEAD, 'artifact': AID,
                   'zip_sha256': ZIP_SHA, 'member': MEMBER, 'binary_bytes': size,
                   'binary_sha256': digest.hexdigest(),
                   'scope': 'native compatibility only; no browser acceptance or latency proof'}
          Path('artifacts/native-uds/input.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof))
          PY
      - name: Build the existing single Linux image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            -f browser-single/Dockerfile -t authz-browser-uds:probe .
          docker image inspect authz-browser-uds:probe \
            --format '{{.Id}} {{.Size}}' | tee artifacts/native-uds/image.txt
      - name: Run the real native stack and two original acceptance passes
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name authz-browser-uds \
            --shm-size=128m -e BROWSER_LAB_EPHEMERAL=yes \
            -e BROWSER_LAB_OPENFGA_BINARY=/native-openfga/openfga \
            --mount type=bind,src="$PWD/artifacts/native-uds-input",dst=/native-openfga,readonly \
            -p 127.0.0.1:3000:3000 authz-browser-uds:probe
          printf '%s  %s\n' 57ef124e5b339dcf1c3dbcbe2c3083c03f5db74a799a1472014e875292cc1066 /native-openfga/openfga \
            | docker exec -i authz-browser-uds sha256sum -c -
          ready=false
          for ((attempt = 1; attempt <= 120; attempt++)); do
            if docker exec authz-browser-uds /usr/local/bin/lab-tool probe >/dev/null 2>&1; then
              ready=true
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' authz-browser-uds 2>/dev/null || true)" != true ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo 'Real-stack readiness was not established' >&2
            exit 1
          fi
          for pass in 1 2; do
            docker exec -e SMOKE_ALLOW_MUTATIONS=true authz-browser-uds \
              /usr/local/bin/lab-tool acceptance | tee "artifacts/native-uds/acceptance-$pass.json"
          done
          docker stats --no-stream --format 'Memory: {{.MemUsage}}' authz-browser-uds \
            | tee artifacts/native-uds/memory.txt
      - name: Verify the actual Unix socket, role, HBA, and OpenFGA connections
        shell: bash
        run: |
          set -euo pipefail
          docker exec authz-browser-uds test -S /tmp/browser-lab/.s.PGSQL.5432
          docker exec authz-browser-uds id -un | tee artifacts/native-uds/runtime-user.txt
          docker exec authz-browser-uds stat -c '%U:%G %a %F' \
            /tmp/browser-lab /tmp/browser-lab/.s.PGSQL.5432 \
            | tee artifacts/native-uds/socket-permissions.txt
          # This connection uses authzlab, so it cannot satisfy the openfga pool proof.
          docker exec -i authz-browser-uds \
            psql -X -qAt -w -v ON_ERROR_STOP=1 \
            -h /tmp/browser-lab -p 5432 -U authzlab -d authzlab <<'SQL' | tee artifacts/native-uds/socket.json
          SELECT json_build_object(
            'role', current_user,
            'connection_is_unix', inet_client_addr() IS NULL,
            'socket_directory', current_setting('unix_socket_directories'),
            'local_trust_hba', EXISTS (
              SELECT 1 FROM pg_hba_file_rules
              WHERE type = 'local' AND database = ARRAY['all'] AND user_name = ARRAY['all']
                AND auth_method = 'trust' AND error IS NULL
            ),
            'openfga_connections', (
              SELECT count(*) FROM pg_stat_activity
              WHERE datname = 'openfga' AND usename = 'authzlab' AND backend_type = 'client backend'
            ),
            'openfga_connections_all_unix', COALESCE((
              SELECT bool_and(client_addr IS NULL) FROM pg_stat_activity
              WHERE datname = 'openfga' AND usename = 'authzlab' AND backend_type = 'client backend'
            ), false)
          );
          SQL
          python3 - <<'PY'
          import json
          from pathlib import Path
          directory = Path('artifacts/native-uds')
          socket = json.loads((directory / 'socket.json').read_text())
          if not (
              (directory / 'runtime-user.txt').read_text().strip() == 'postgres'
              and socket['role'] == 'authzlab'
              and socket['connection_is_unix'] is True
              and socket['socket_directory'] == '/tmp/browser-lab'
              and socket['local_trust_hba'] is True
              and socket['openfga_connections'] > 0
              and socket['openfga_connections_all_unix'] is True
          ):
              raise SystemExit('Actual Unix socket/role/HBA/OpenFGA pool proof failed')
          passes = []
          for number in (1, 2):
              result = json.loads((directory / f'acceptance-{number}.json').read_text())
              if result.get('accepted') is not True or result.get('statuses') != [403, 204, 200, 204, 403]:
                  raise SystemExit('Native acceptance result is missing or differs')
              passes.append(result)
          proof = {
              'scope': 'native compatibility only',
              'browser_acceptance_verified': False,
              'native_passes': passes,
              'postgres_socket': socket,
              'rust_database_url_unchanged': True,
              'openfga_query_mode': 'unchanged default cache_statement',
          }
          (directory / 'native-result.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof))
          PY
      - name: Capture service evidence and remove only this diagnostic container
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/native-uds
          docker logs authz-browser-uds > artifacts/native-uds/container.log 2>&1 || true
          docker inspect -f '{{json .State}}' authz-browser-uds \
            > artifacts/native-uds/container-state.json 2>/dev/null || true
          docker cp authz-browser-uds:/tmp/browser-lab/initdb.log artifacts/native-uds/initdb.log || true
          docker cp authz-browser-uds:/tmp/browser-lab/postgres.log artifacts/native-uds/postgres.log || true
          docker rm -f authz-browser-uds || true
      - name: Save native compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-openfga-uds-evidence
          path: artifacts/native-uds/
          if-no-files-found: error
          retention-days: 7
