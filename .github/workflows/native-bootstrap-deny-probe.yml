name: Verify bootstrap real empty-store deny probe with retained OpenFGA
on:
  push:
    branches: [diag/native-bootstrap-deny-probe]
    paths: [.github/workflows/native-bootstrap-deny-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.repository == 'qqrm/openfga-axum-lab' && github.ref == 'refs/heads/diag/native-bootstrap-deny-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMBINED_SOURCE_COMMIT: e381339f80dd76777ef526b0073dc5eb34739f26
      BOOTSTRAP_CORE_COMMIT: 207d15fab685d3adb9c5d51a048982c2236ae75c
      BOOTSTRAP_FIXTURE_COMMIT: 4b7a1e1933083232fb8305a60a47bdd3c32e6689
      NATIVE_PROOF_BLOB: b9f889e63f6fd6c3fc1bfa146e59c160958eae92
      NATIVE_DENY_PROBE_CONTRACT: real_empty_store_check_v1
    steps:
      - name: Require a reviewed immutable source before checkout or build
        timeout-minutes: 1
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          for (const name of ['COMBINED_SOURCE_COMMIT','BOOTSTRAP_CORE_COMMIT','BOOTSTRAP_FIXTURE_COMMIT','NATIVE_PROOF_BLOB']) {
            assert.match(process.env[name] ?? '', /^[0-9a-f]{40}$/, 'The reviewed immutable pin is still missing: '+name);
          }
          assert.equal(process.env.NATIVE_DENY_PROBE_CONTRACT,'real_empty_store_check_v1','Real deny-probe proof contract is not reviewed');
          assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1','This finite native verification forbids workflow reruns');
          console.log(JSON.stringify({phase:'source_pin',producerSource:process.env.COMBINED_SOURCE_COMMIT,browserAcceptanceVerified:false}));
          JS
      - name: Check out the exact combined versioned producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.COMBINED_SOURCE_COMMIT }}
          path: producer
          persist-credentials: false
      - name: Check out the fixed Rust source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BOOTSTRAP_CORE_COMMIT }}
          path: source
          persist-credentials: false
      - name: Check out the exact reviewed entrypoint fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BOOTSTRAP_FIXTURE_COMMIT }}
          path: packaging
          persist-credentials: false
      - name: Check out the exact source of the retained successful Go step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 501cfc2535f09826550aae97225fa5cbda86f08d
          path: retained-source
          persist-credentials: false
      - name: Check out pinned upstream only to verify preimages and module hashes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openfga/openfga
          ref: 293893b22a53d8a130a5f7c97cab4bc8e91bcaa4
          path: upstream
          persist-credentials: false
      - name: Check source identity, repository contract and both producer scripts
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test "$(git -C producer rev-parse HEAD)" = "$COMBINED_SOURCE_COMMIT"
          test "$(git -C source rev-parse HEAD)" = "$BOOTSTRAP_CORE_COMMIT"
          test "$(git -C packaging rev-parse HEAD)" = "$BOOTSTRAP_FIXTURE_COMMIT"
          git -C producer diff --exit-code HEAD --
          git -C source diff --exit-code HEAD --
          git -C packaging diff --exit-code HEAD --
          test "$(git -C retained-source rev-parse HEAD)" = 501cfc2535f09826550aae97225fa5cbda86f08d
          test "$(git -C upstream rev-parse HEAD)" = 293893b22a53d8a130a5f7c97cab4bc8e91bcaa4
          git -C retained-source diff --exit-code HEAD --
          git -C upstream diff --exit-code HEAD --
          (cd upstream && sha256sum --check ../producer/browser-single/openfga/upstream.sha256)
          test "$(git -C producer hash-object browser-single/bootstrap/native-proof.mjs)" = "$NATIVE_PROOF_BLOB"
          for script in producer/browser-single/openfga/build.sh producer/browser-single/bootstrap/build.sh; do
            bash -n "$script"
            shellcheck "$script"
          done
          node --check producer/browser-single/bootstrap/native-proof.mjs
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {mkdirSync,readFileSync,writeFileSync} from 'node:fs';
          const files = execFileSync('git', ['ls-files', '-z'], {cwd:'producer',encoding:'utf8'}).split('\0').filter(Boolean);
          for (const path of files) {
            assert(!path.endsWith('.py') && !path.endsWith('.pyw'), 'Forbidden tracked runtime: ' + path);
            if (path.startsWith('.github/workflows/') || path === 'compose.yaml' || path === 'Dockerfile') {
              assert(!readFileSync('producer/' + path, 'utf8').toLowerCase().includes('python'), 'Forbidden workflow runtime: ' + path);
            }
          }
          assert(files.includes('browser-single/bootstrap/native-proof.mjs'));
          for (const path of ['browser-single/entrypoint.sh','browser-single/pages/guest.sh',
            'browser-single/pages/startup-payload.mjs','browser-single/startup-payload.test.mjs',
            'browser-single/prepare-pages.sh','browser-single/check-pages.mjs']) {
            assert(readFileSync('producer/'+path).equals(readFileSync('packaging/'+path)), 'Reviewed runtime fixture changed: '+path);
          }
          const digest = path => createHash('sha256').update(readFileSync('producer/'+path)).digest('hex');
          const proof = {schemaVersion:2,experiment:'bootstrap_real_empty_store_check',producerSource:process.env.COMBINED_SOURCE_COMMIT,
            rustSource:process.env.BOOTSTRAP_CORE_COMMIT,
            packagingSource:process.env.BOOTSTRAP_FIXTURE_COMMIT,
            workflowCommit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,
            repositoryRuntimeContract:'passed',scriptSyntaxAndShellCheck:'passed',
            sourceSha256:Object.fromEntries(['browser-single/OpenFGA.Dockerfile',
              'browser-single/openfga/build.sh','browser-single/bootstrap/build.sh',
              'browser-single/bootstrap/native-proof.mjs'].map(path=>[path,digest(path)])),
            scope:'native producers and real native service verification; no emulator, kernel build or browser VM',
            browserAcceptanceVerified:false};
          mkdirSync('producer/artifacts',{recursive:true});
          writeFileSync('producer/artifacts/openfga8-verifier-input.json',JSON.stringify(proof,null,2)+'\n');
          console.log(JSON.stringify(proof));
          JS
      - name: Restore only the exact successful OpenFGA build from the failed native run
        timeout-minutes: 5
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, tempfile, urllib.error, urllib.request, zipfile
          from urllib.parse import urlsplit
          
          REPO = "qqrm/openfga-axum-lab"
          RUN, JOB = 43440821229, 131937646033
          HEAD = "84112f7373df40dc767d7f10fbea453720651f0e"
          SOURCE = "501cfc2535f09826550aae97225fa5cbda86f08d"
          AID, SIZE = 14047585163, 20612111
          SHA = "45fda236fb2dc536d0c437e38230a18f8a19fc09b8b7fca6807cc76f65fc094f"
          INPUT_SHA = "fcb7a8aa0db087f6489c691d982dd1fb205244e4e99965654fcc3a41e6093e1c"
          BINARY_SHA = "5204b54bed6c9b74afd2517eb82117b1e91befcee8d1c2c709a554d20ad9ee5f"
          BINARY_SIZE = 63066296
          ROOT = pathlib.Path("producer/artifacts")
          DEST = ROOT / "browser-openfga"
          FILES = {
              "LICENSE", "SOURCE.txt", "build.json", "openfga", "startup-dial.patch",
              "browser_http_dial.go", "browser_http_warmup.go",
              "browser_model_validation.go", "browser_model_validation_test.go",
              "browser_model_codec.go", "browser_model_codec_test.go",
              "browser_model_codec_integration_test.go", "browser_write_typesystem_test.go",
              "browser_resolver_transfer_integration_test.go", "dial-tests.log",
              "model-validation-tests.log", "write-typesystem-tests.log", "model-reuse-race-tests.log",
          }
          
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect())
          def request(path):
              return urllib.request.Request("https://api.github.com/repos/" + REPO + path, headers={
                  "Authorization": "Bearer " + os.environ["ARTIFACT_READ_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "retained-openfga-native-verifier"})
          
          def api(path):
              try:
                  with opener.open(request(path), timeout=20) as response:
                      raw = response.read(1024**2 + 1)
              except urllib.error.HTTPError as error:
                  raise SystemExit("GitHub metadata HTTP " + str(error.code)) from None
              require(len(raw) <= 1024**2, "Metadata exceeded its budget")
              return json.loads(raw)
          
          run = api("/actions/runs/" + str(RUN))
          require(run["id"] == RUN and run["status"] == "completed" and run["conclusion"] == "failure"
                  and run["head_sha"] == HEAD and run["event"] == "push" and run["run_attempt"] == 1,
                  "Retained source run identity/status mismatch")
          job = api("/actions/jobs/" + str(JOB))
          require(job["id"] == JOB and job["run_id"] == RUN and job["head_sha"] == HEAD
                  and job["status"] == "completed" and job["conclusion"] == "failure",
                  "Retained source job identity/status mismatch")
          steps = [step for step in job["steps"] if step["number"] == 7]
          require(len(steps) == 1 and steps[0]["name"] == "Build and regression-test the actual combined OpenFGA producer"
                  and steps[0]["status"] == "completed" and steps[0]["conclusion"] == "success",
                  "The exact retained OpenFGA build/test step did not pass")
          artifact = api("/actions/artifacts/" + str(AID))
          require(artifact["id"] == AID and artifact["name"] == "browser-openfga8-native-evidence"
                  and not artifact["expired"] and artifact["workflow_run"]["id"] == RUN
                  and artifact["workflow_run"]["head_sha"] == HEAD and artifact["size_in_bytes"] == SIZE
                  and artifact["digest"] == "sha256:" + SHA, "Retained artifact identity changed")
          try:
              opener.open(request("/actions/artifacts/" + str(AID) + "/zip"), timeout=20)
              raise SystemExit("Expected an artifact download redirect")
          except urllib.error.HTTPError as error:
              require(error.code == 302, "Artifact redirect was not HTTP 302")
              location = error.headers.get("Location", "")
              error.close()
          storage = urlsplit(location)
          host = storage.hostname or ""
          require(storage.scheme == "https" and storage.port in (None, 443)
                  and storage.username is None and storage.password is None
                  and (host.endswith(".blob.core.windows.net") or host.endswith(".actions.githubusercontent.com")),
                  "Unexpected artifact storage host or scheme")
          require(not DEST.exists(), "Refusing to reuse an existing OpenFGA output")
          with tempfile.TemporaryFile() as archive:
              digest = hashlib.sha256()
              received = 0
              try:
                  # Do not forward the API Authorization header to artifact storage.
                  with opener.open(urllib.request.Request(location), timeout=30) as response:
                      while block := response.read(1024**2):
                          received += len(block)
                          require(received <= SIZE, "ZIP exceeded its pinned size")
                          digest.update(block)
                          archive.write(block)
              except urllib.error.HTTPError as error:
                  raise SystemExit("Artifact storage HTTP " + str(error.code)) from None
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit("Artifact storage network failure") from None
              require(received == SIZE and digest.hexdigest() == SHA, "Retained ZIP integrity mismatch")
              archive.seek(0)
              with zipfile.ZipFile(archive) as package:
                  names = package.namelist()
                  require(len(names) <= 128 and len(names) == len(set(names)), "Unexpected ZIP inventory")
                  for name in names:
                      parts = name.rstrip("/").split("/")
                      require(name and not name.startswith("/") and "\\" not in name
                              and all(part not in ("", ".", "..") for part in parts),
                              "Unsafe ZIP member name")
                  actual = {name.removeprefix("browser-openfga/") for name in names
                            if name.startswith("browser-openfga/") and not name.endswith("/")}
                  require(actual == FILES, "Retained OpenFGA member set changed")
                  members = {}
                  extracted_bytes = 0
                  def read_member(name, limit):
                      global extracted_bytes
                      require(name in names, "Required retained member is missing")
                      info = package.getinfo(name)
                      mode = info.external_attr >> 16
                      require(stat.S_IFMT(mode) in (0, stat.S_IFREG) and not info.is_dir()
                              and not (info.flag_bits & 1) and info.file_size <= limit,
                              "Unsupported retained member type or size")
                      with package.open(info) as part:
                          raw = part.read(limit + 1)
                      require(len(raw) == info.file_size and len(raw) <= limit, "Retained member read exceeded its budget")
                      extracted_bytes += len(raw)
                      require(extracted_bytes <= 128 * 1024**2, "Retained selection exceeded its total budget")
                      members[name] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
                      return raw
          
                  old_input = read_member("openfga8-verifier-input.json", 1024**2)
                  require(len(old_input) == 998 and hashlib.sha256(old_input).hexdigest() == INPUT_SHA,
                          "Retained verifier-input byte identity changed")
                  previous = json.loads(old_input)
                  require(previous["producerSource"] == SOURCE and previous["workflowCommit"] == HEAD
                          and previous["runId"] == str(RUN) and previous["runAttempt"] == "1"
                          and previous["repositoryRuntimeContract"] == "passed"
                          and previous["scriptSyntaxAndShellCheck"] == "passed"
                          and previous["browserAcceptanceVerified"] is False,
                          "Retained verifier input disagrees with the successful build step")
                  ROOT.mkdir(exist_ok=True)
                  DEST.mkdir(mode=0o755)
                  for name in sorted(FILES):
                      raw = read_member("browser-openfga/" + name, 80 * 1024**2 if name == "openfga" else 8 * 1024**2)
                      if name == "openfga":
                          require(len(raw) == BINARY_SIZE and hashlib.sha256(raw).hexdigest() == BINARY_SHA,
                                  "Retained executable differs from the actual tested output")
                      target = DEST / name
                      with target.open("xb") as output:
                          output.write(raw)
                      target.chmod(0o555 if name == "openfga" else 0o644)
                  build_log = read_member("browser-openfga-build.log", 16 * 1024**2)
                  (ROOT / "browser-openfga-build.log").write_bytes(build_log)
                  (ROOT / "openfga8-retained-verifier-input.json").write_bytes(old_input)
                  # Deliberately restricted source-directory fixture. This is not a claim
                  # about the historical Buildx directory mode. Only the owning producer
                  # may stage the verified binary into its own traversable bind directory.
                  DEST.chmod(0o700)
                  origin = {
                      "schema_version": 1, "scope": "reuse exact completed OpenFGA build and tests; native proof still required",
                      "source_run": RUN, "source_job": JOB, "source_workflow_commit": HEAD, "source_commit": SOURCE,
                      "source_run_attempt": 1, "source_run_conclusion": "failure",
                      "openfga_build_step": {"number": 7, "name": steps[0]["name"], "conclusion": "success",
                                            "started_at": steps[0]["started_at"], "completed_at": steps[0]["completed_at"]},
                      "artifact": AID, "artifact_name": artifact["name"],
                      "archive": {"bytes": SIZE, "sha256": SHA},
                      "verifier_input": {"bytes": len(old_input), "sha256": INPUT_SHA},
                      "members": members,
                      "permissions_regression_fixture": {"directory_mode": "0700", "binary_mode": "0555",
                                                         "owner_uid": DEST.stat().st_uid, "historical_mode_not_inferred": True},
                      "browser_acceptance_verified": False,
                  }
                  (ROOT / "openfga8-retained-origin.json").write_text(json.dumps(origin, indent=2) + "\n")
                  print(json.dumps({"retained_openfga_archive_verified": True, "source_run": RUN,
                                    "source_run_conclusion": "failure", "openfga_build_step": "success",
                                    "artifact": AID, "binary_bytes": BINARY_SIZE, "binary_sha256": BINARY_SHA,
                                    "permission_fixture": "owned directory0700/file0555; historical mode unknown",
                                    "native_acceptance_verified": False, "browser_acceptance_verified": False}))
          PY

      - name: Verify every retained source, upstream preimage, test proof and executable
        timeout-minutes: 2
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,readdirSync,statSync,writeFileSync} from 'node:fs';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const digest = path => hash(readFileSync(path));
          const readJSON = path => JSON.parse(readFileSync(path,'utf8'));
          const old = readJSON('producer/artifacts/openfga8-retained-verifier-input.json');
          assert.equal(digest('producer/artifacts/openfga8-retained-verifier-input.json'),
            'fcb7a8aa0db087f6489c691d982dd1fb205244e4e99965654fcc3a41e6093e1c');
          assert.equal(old.rustSource,'53ff85cfdd3d84c26ae432189790e1e0f72d61db');
          assert.equal(old.packagingSource,'d7f7ead003c774e30584798adfde38afb854528d');
          // Only actual OpenFGA build/test inputs are unchanged. Rust/bootstrap,
          // host payloads and documentation may intentionally differ in this candidate.
          const expectedInputPaths = [".dockerignore","browser-single/OpenFGA.Dockerfile","browser-single/openfga/browser_http_dial.go","browser-single/openfga/browser_http_dial_test.go","browser-single/openfga/browser_http_warmup.go","browser-single/openfga/browser_http_warmup_test.go","browser-single/openfga/browser_model_codec.go","browser-single/openfga/browser_model_codec_integration_test.go","browser-single/openfga/browser_model_codec_test.go","browser-single/openfga/browser_model_validation.go","browser-single/openfga/browser_model_validation_test.go","browser-single/openfga/browser_resolver_transfer_integration_test.go","browser-single/openfga/browser_write_typesystem_test.go","browser-single/openfga/build.sh","browser-single/openfga/startup-dial.patch","browser-single/openfga/upstream.sha256","fga/model.json"];
          const relevant = path => path === '.dockerignore' || path === 'fga/model.json' ||
            path === 'browser-single/OpenFGA.Dockerfile' || path === 'browser-single/OpenFGA.Dockerfile.dockerignore' ||
            (path.startsWith('browser-single/openfga/') && path !== 'browser-single/openfga/README.md');
          const listed = directory => Object.fromEntries(execFileSync('git',['ls-files','--stage','-z'],
            {cwd:directory,encoding:'utf8'}).split('\0').filter(Boolean).map(row=>{
              const match=/^([0-7]{6}) ([0-9a-f]{40}) 0\t(.+)$/.exec(row);
              assert(match,'Unexpected staged-file identity');
              return [match[3],{mode:match[1],git_blob:match[2]}];
            }).filter(([path])=>relevant(path)));
          const currentInputs=listed('producer');
          const retainedInputs=listed('retained-source');
          assert.deepEqual(Object.keys(currentInputs).sort(),expectedInputPaths.slice().sort(),
            'Unexpected OpenFGA build/test input membership');
          assert.deepEqual(currentInputs,retainedInputs,'OpenFGA input bytes or modes differ from the successful Go build');
          const verifiedInputs={};
          for(const path of expectedInputPaths){
            const bytes=readFileSync('producer/'+path);
            assert(bytes.equals(readFileSync('retained-source/'+path)),'Actual OpenFGA input differs: '+path);
            verifiedInputs[path]={...currentInputs[path],bytes:bytes.length,sha256:hash(bytes)};
          }
          const inputSetSha256=hash(Buffer.from(JSON.stringify(verifiedInputs)));

          assert.deepEqual(Object.keys(old.sourceSha256).sort(),[
            'browser-single/OpenFGA.Dockerfile','browser-single/openfga/build.sh',
            'browser-single/bootstrap/build.sh','browser-single/bootstrap/native-proof.mjs'
          ].sort());
          for (const [path,want] of Object.entries(old.sourceSha256)) {
            assert.equal(digest('retained-source/'+path),want,'Retained verifier/source mismatch: '+path);
            if (path === 'browser-single/OpenFGA.Dockerfile' || path === 'browser-single/openfga/build.sh') {
              assert.equal(digest('producer/'+path),want,'Unchanged OpenFGA build source mismatch: '+path);
            }
          }
          const root = 'producer/artifacts/browser-openfga/';
          const build = readJSON(root+'build.json');
          assert.equal(statSync(root+'build.json').size,2743);
          assert.equal(digest(root+'build.json'),'d7f903c286657d193eddee5b4bf98ccdc2a56431f1924d7b456555fd506d6315');
          assert.equal(statSync(root+'openfga').size,63066296);
          assert.equal(digest(root+'openfga'),'5204b54bed6c9b74afd2517eb82117b1e91befcee8d1c2c709a554d20ad9ee5f');
          assert.equal(build.binary_sha256,digest(root+'openfga'));
          for (const [key,want] of Object.entries({
            upstream_version:'1.10.3',source_commit:'293893b22a53d8a130a5f7c97cab4bc8e91bcaa4',
            go_version:'go1.24.6',target:'linux/amd64',startup_dial_timeout_seconds:60,
            authorization_request_timeout_default_seconds:3,warmup_timeout_seconds:60,warmup_cycles:1,
            warmup_model_bytes:52709,warmup_model_sha256:'a894f61fb40563467d0a16409981acb14224c619073f39c42dca233609a78e6d',
            model_json_decoder:'pinned_json_decode_private_clone',model_json_encoder:'single_exact_real_model_response',
            first_resolver_typesystem_reuse:'one_shot_after_real_model_read',
            tuple_write_typesystem_reuse:'same_request_store_and_model',warmup_generated_validation:'ValidateAll',
            startup_dial_tests:'passed',transport_diagnostics_tests:'passed',warmup_tests:'passed',
            model_codec_tests:'passed',model_validation_tests:'passed',write_typesystem_tests:'passed',
            model_reuse_race_tests:'passed'
          })) assert.equal(build[key],want,'Unexpected retained OpenFGA field: '+key);
          const proofs = {
            patch_sha256:'startup-dial.patch',helper_sha256:'browser_http_dial.go',tests_sha256:'browser_http_dial_test.go',
            warmup_helper_sha256:'browser_http_warmup.go',warmup_tests_sha256:'browser_http_warmup_test.go',
            model_codec_helper_sha256:'browser_model_codec.go',model_codec_tests_sha256:'browser_model_codec_test.go',
            model_codec_integration_tests_sha256:'browser_model_codec_integration_test.go',
            model_validation_helper_sha256:'browser_model_validation.go',model_validation_tests_sha256:'browser_model_validation_test.go',
            write_typesystem_tests_sha256:'browser_write_typesystem_test.go',
            resolver_transfer_integration_tests_sha256:'browser_resolver_transfer_integration_test.go'
          };
          const retainedNames = new Set(readdirSync(root));
          for (const [key,name] of Object.entries(proofs)) {
            assert.equal(build[key],digest('producer/browser-single/openfga/'+name),'Current OpenFGA input changed: '+key);
            if (retainedNames.has(name)) {
              assert.equal(build[key],digest(root+name),'Retained OpenFGA source bytes changed: '+name);
            }
          }
          assert.equal(build.go_sum_sha256,digest('upstream/go.sum'),'Pinned upstream module graph changed');
          assert.equal(digest(root+'LICENSE'),digest('upstream/LICENSE'),'Pinned upstream license changed');
          assert.equal(build.warmup_model_sha256,digest('producer/fga/model.json'),'The original policy changed');
          assert.equal(build.model_reuse_race_tests_sha256,
            '6ff7585a2ca3f1d6d8df82009e906b3e01b14db23a1296697fba4bb2d5705253');
          assert.equal(build.model_reuse_race_tests_sha256,digest(root+'model-reuse-race-tests.log'));
          const originPath = 'producer/artifacts/openfga8-retained-origin.json';
          const origin = readJSON(originPath);
          for (const [name,info] of Object.entries(origin.members)) {
            const file = name === 'openfga8-verifier-input.json'
              ? 'producer/artifacts/openfga8-retained-verifier-input.json'
              : 'producer/artifacts/'+name;
            assert.equal(statSync(file).size,info.bytes);
            assert.equal(digest(file),info.sha256);
          }
          assert.equal(statSync(root).mode & 0o777,0o700,'The intended permission regression fixture changed');
          assert.equal(statSync(root+'openfga').mode & 0o777,0o555);
          origin.schema_version=2;
          origin.source_verification = {
            schema_version:2,scope:'exact_openfga_build_inputs_and_tests',
            producer_commit:process.env.COMBINED_SOURCE_COMMIT,
            retained_source_commit:'501cfc2535f09826550aae97225fa5cbda86f08d',
            upstream_commit:'293893b22a53d8a130a5f7c97cab4bc8e91bcaa4',
            openfga_build_inputs_unchanged:true,verified_inputs:verifiedInputs,
            input_set_sha256:inputSetSha256,
            excluded_documentation:['browser-single/openfga/README.md'],
            other_repository_files_compared:false
          };
          writeFileSync(originPath,JSON.stringify(origin,null,2)+'\n');
          const inputPath = 'producer/artifacts/openfga8-verifier-input.json';
          const input = readJSON(inputPath);
          input.retainedOpenfgaOriginSha256 = digest(originPath);
          writeFileSync(inputPath,JSON.stringify(input,null,2)+'\n');
          console.log(JSON.stringify({retainedOpenfgaSourceAndTestsVerified:true,
            currentProducer:process.env.COMBINED_SOURCE_COMMIT,retainedSource:origin.source_commit,
            binarySha256:build.binary_sha256,openfgaBuildSha256:digest(root+'build.json'),
            retainedOpenfgaOriginSha256:input.retainedOpenfgaOriginSha256,
            permissionRegressionFixture:origin.permissions_regression_fixture,
            nativeAcceptanceVerified:false,browserAcceptanceVerified:false}));
          JS
      - name: Execute the versioned native bootstrap producer with this exact OpenFGA output
        timeout-minutes: 25
        working-directory: producer
        run: |
          set -euo pipefail
          timeout --kill-after=15s 1470s bash browser-single/bootstrap/build.sh ../source ../packaging \
            2>&1 | tee artifacts/bootstrap-producer-run.log
      - name: Verify all four outputs and their real native OpenFGA provenance
        timeout-minutes: 2
        working-directory: producer
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync,readdirSync,statSync} from 'node:fs';
          import {validateBootstrapBuild} from './browser-single/pages/startup-payload.mjs';
          const root = 'artifacts/browser-bootstrap/';
          assert.deepEqual(readdirSync(root).sort(), ['SOURCE.txt','bootstrap','build.json','native-tests.log'].sort());
          const binary = readFileSync(root+'bootstrap');
          const digest = value => createHash('sha256').update(value).digest('hex');
          const hashFile = path => digest(readFileSync(path));
          const build = JSON.parse(readFileSync(root+'build.json','utf8'));
          validateBootstrapBuild(build,{bytes:binary.length,sha256:digest(binary)});
          assert.equal(build.source_commit,process.env.BOOTSTRAP_CORE_COMMIT);
          assert.equal(build.packaging_commit,process.env.BOOTSTRAP_FIXTURE_COMMIT);
          for(const [key,value] of Object.entries({
            empty_store_check:'one_real_higher_consistency_ownership_deny',
            empty_store_check_default:false,browser_empty_store_check:true,
            empty_store_check_timeout_seconds:5,empty_store_check_tests:'passed',
            timeout_scope:'bootstrap_model_post_and_get',default_model_timeout_seconds:5,
            min_model_timeout_seconds:5,max_model_timeout_seconds:30,browser_model_timeout_seconds:30
          }))assert.equal(build[key],value,'Bootstrap-only proof metadata differs: '+key);
          const proof=JSON.parse(readFileSync('artifacts/browser-bootstrap-proof/native-result.json','utf8'));
          assert.equal(proof.passed,true);
          assert.equal(proof.source_commit,process.env.BOOTSTRAP_CORE_COMMIT);
          assert.equal(proof.packaging_commit,process.env.BOOTSTRAP_FIXTURE_COMMIT);
          assert.equal(proof.binary_sha256,digest(binary));
          assert.equal(proof.browser_acceptance_verified,false);
          assert.equal(proof.delayed_empty_store_check_seconds,6);
          assert.equal(proof.empty_store_check.request_count,1);
          assert.equal(proof.empty_store_check.status,200);
          assert.equal(proof.empty_store_check.allowed,false);
          assert.equal(proof.empty_store_check.consistency,'HIGHER_CONSISTENCY');
          assert.equal(proof.empty_store_check.tuple_count_before,0);
          assert.deepEqual(proof.empty_store_check.tuple_key,{
            user:'user:browser-bootstrap-probe',relation:'ownership',
            object:'lakekeeper_table:browser-bootstrap-probe'
          });
          const denied=proof.empty_store_check_deadline_failure;
          assert.equal(denied.exit,1);
          assert.equal(denied.config_published,false);
          assert.equal(denied.response_still_withheld,true);
          assert(Number.isSafeInteger(denied.elapsed_ms)&&denied.elapsed_ms>=4500&&denied.elapsed_ms<6000);
          assert.equal(typeof denied.stderr,'string');
          for(const actual of [proof.empty_store_check,denied.real_check]){
            assert.equal(actual.request_count,1);
            assert.equal(actual.status,200);
            assert.equal(actual.allowed,false);
            assert.equal(actual.consistency,'HIGHER_CONSISTENCY');
            assert.equal(actual.tuple_count_before,0);
            assert.deepEqual(actual.tuple_key,proof.empty_store_check.tuple_key);
            assert.match(actual.store_id,/^[0-9A-HJKMNP-TV-Z]{26}$/);
            assert.match(actual.authorization_model_id,/^[0-9A-HJKMNP-TV-Z]{26}$/);
          }
          assert.notEqual(proof.empty_store_check.store_id,denied.real_check.store_id);
          assert.notEqual(proof.empty_store_check.authorization_model_id,denied.real_check.authorization_model_id);
          assert.equal(proof.actual_postgres_tuple_count_before_app,0);
          assert.equal(proof.actual_postgres_model_count,4);
          assert.deepEqual(proof.default_failures.map(value=>value.phase),['default-post','default-get']);
          for(const failure of proof.default_failures){
            assert.equal(failure.exit,1);
            assert.equal(failure.config_published,false);
            assert.equal(failure.response_still_withheld,true);
            assert(Number.isSafeInteger(failure.elapsed_ms)&&failure.elapsed_ms>=4500&&failure.elapsed_ms<6000);
          }
          assert.equal(proof.opt_in_model_timeout_seconds,30);
          assert.equal(proof.delayed_model_post_and_get_seconds,6);
          assert.equal(proof.native_passes.length,2);
          for(const pass of proof.native_passes){
            assert.equal(pass.accepted,true);
            assert.deepEqual(pass.statuses,[403,204,200,204,403]);
          }
          assert.equal(build.native_test_log_sha256,hashFile(root+'native-tests.log'));
          assert.equal(build.bootstrap_source_sha256,hashFile('../source/tools/bootstrap.rs'));
          assert.equal(build.bootstrap_tests_sha256,hashFile('../source/tools/bootstrap_tests.rs'));
          assert.equal(build.producer_sha256,hashFile('browser-single/bootstrap/build.sh'));
          assert.equal(build.native_harness_sha256,hashFile('browser-single/bootstrap/native-proof.mjs'));
          assert.equal(build.native_proof_sha256,hashFile('artifacts/browser-bootstrap-proof/native-result.json'));
          assert.equal(build.browser_acceptance_verified,false);
          const retainedOriginPath = 'artifacts/openfga8-retained-origin.json';
          const retainedOrigin = JSON.parse(readFileSync(retainedOriginPath,'utf8'));
          const verifierInput = JSON.parse(readFileSync('artifacts/openfga8-verifier-input.json','utf8'));
          assert.equal(verifierInput.retainedOpenfgaOriginSha256,hashFile(retainedOriginPath));
          assert.equal(retainedOrigin.source_verification.producer_commit,process.env.COMBINED_SOURCE_COMMIT);
          assert.equal(retainedOrigin.schema_version,2);
          assert.equal(retainedOrigin.source_verification.schema_version,2);
          assert.equal(retainedOrigin.source_verification.scope,'exact_openfga_build_inputs_and_tests');
          assert.equal(retainedOrigin.source_verification.openfga_build_inputs_unchanged,true);
          assert.equal(retainedOrigin.source_verification.other_repository_files_compared,false);
          assert.deepEqual(retainedOrigin.source_verification.excluded_documentation,['browser-single/openfga/README.md']);
          const inputProof=retainedOrigin.source_verification.verified_inputs;
          assert.equal(retainedOrigin.source_verification.input_set_sha256,digest(Buffer.from(JSON.stringify(inputProof))));
          for(const [name,record] of Object.entries(inputProof)){
            assert.equal(statSync(name).size,record.bytes);
            assert.equal(hashFile(name),record.sha256);
          }
          assert.equal(retainedOrigin.source_run,43440821229);
          assert.equal(retainedOrigin.openfga_build_step.conclusion,'success');
          assert.equal(statSync('artifacts/browser-openfga').mode & 0o777,0o700);
          assert.equal(statSync('artifacts/browser-openfga/openfga').mode & 0o777,0o555);
          const fga = JSON.parse(readFileSync('artifacts/browser-openfga/build.json','utf8'));
          assert.equal(fga.binary_sha256,hashFile('artifacts/browser-openfga/openfga'));
          assert.equal(build.openfga_binary_sha256,fga.binary_sha256);
          assert.equal(build.openfga_build_sha256,hashFile('artifacts/browser-openfga/build.json'));
          assert.equal(build.workflow_commit,process.env.GITHUB_SHA);
          assert.equal(String(build.run_id),process.env.GITHUB_RUN_ID);
          assert.equal(String(build.run_attempt),process.env.GITHUB_RUN_ATTEMPT);
          console.log(JSON.stringify({producerOutputVerified:true,producerSource:process.env.COMBINED_SOURCE_COMMIT,
            binaryBytes:binary.length,binarySha256:digest(binary),openfgaBinarySha256:fga.binary_sha256,
            openfgaBuildSha256:build.openfga_build_sha256,
            retainedOpenfgaOriginSha256:verifierInput.retainedOpenfgaOriginSha256,
            browserAcceptanceVerified:false}));
          JS
      - name: Clean only proof containers owned by this run
        if: always()
        timeout-minutes: 2
        working-directory: producer
        run: bash browser-single/bootstrap/build.sh --cleanup
      - name: Retain the four-file verified native bootstrap output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-bootstrap-deny-probe
          path: producer/artifacts/browser-bootstrap/
          if-no-files-found: error
          retention-days: 7
      - name: Retain full OpenFGA output and native evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-bootstrap-deny-probe-native-evidence
          path: |
            producer/artifacts/browser-openfga/
            producer/artifacts/browser-openfga-build.log
            producer/artifacts/browser-bootstrap/
            producer/artifacts/browser-bootstrap-proof/
            producer/artifacts/bootstrap-producer-run.log
            producer/artifacts/openfga8-verifier-input.json
            producer/artifacts/openfga8-retained-origin.json
            producer/artifacts/openfga8-retained-verifier-input.json
          if-no-files-found: warn
          retention-days: 7
