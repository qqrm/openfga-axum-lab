name: Build ACPI kernel candidate 379e
on:
  push:
    branches: [diag/build-acpi-kernel-379e]
    paths: [.github/workflows/build-acpi-kernel-candidate.yml]
permissions:
  contents: read
jobs:
  kernel:
    if: github.repository == 'qqrm/openfga-axum-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KERNEL_SOURCE_COMMIT: af9c5555e312ffaec3785154f5be83be7469c95f
      KERNEL_RECIPE_BLOB: 40fff4d55158930d9f0a3881a089868d2fddaff1
    steps:
      - name: Check out the reviewed kernel source recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qqrm/openfga-axum-lab
          ref: af9c5555e312ffaec3785154f5be83be7469c95f
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Record the exact recipe and source identity
        shell: bash
        run: |
          set -euo pipefail
          evidence=artifacts/browser-acpi-kernel-candidate
          mkdir -p "$evidence"
          test "$(git -C source rev-parse HEAD)" = "$KERNEL_SOURCE_COMMIT"
          test "$(git -C source hash-object browser-single/Kernel.Dockerfile)" = "$KERNEL_RECIPE_BLOB"
          printf '%s\n' 'a3a2c7e9f09cdd75cdbfd053066ec7039453bc65262c3814b752c764fe06a230  source/browser-single/Kernel.Dockerfile' | sha256sum --check --status
          cp source/browser-single/Kernel.Dockerfile "$evidence/Kernel.Dockerfile"
          printf '%s\n' "$KERNEL_SOURCE_COMMIT" > "$evidence/source-commit.txt"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/workflow-commit.txt"
      - name: Build only the ACPI kernel
        id: build
        timeout-minutes: 20
        shell: bash
        run: |
          set -uo pipefail
          evidence=artifacts/browser-acpi-kernel-candidate
          set +e
          timeout --signal=TERM --kill-after=15s 1180s \
            docker buildx build --file source/browser-single/Kernel.Dockerfile \
              --output "type=local,dest=$evidence/kernel" --progress plain source \
              2>&1 | tee "$evidence/build.log"
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > "$evidence/build.exit"
          printf '%s\n' "${statuses[1]}" > "$evidence/log.exit"
          test "${statuses[0]}" -eq 0 && test "${statuses[1]}" -eq 0
      - name: Record output hashes and print the complete bounded config diff
        if: always()
        timeout-minutes: 2
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("artifacts/browser-acpi-kernel-candidate")
          root.mkdir(parents=True, exist_ok=True)
          files = {}
          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit("Unexpected evidence symlink")
              if path.is_file():
                  digest = hashlib.sha256()
                  with path.open("rb") as stream:
                      while chunk := stream.read(1024 * 1024):
                          digest.update(chunk)
                  files[path.relative_to(root).as_posix()] = {
                      "bytes": path.stat().st_size, "sha256": digest.hexdigest()}
          expected = ["bzImage", "linux.config", "upstream.config",
                      "ipc-baseline.config", "acpi.config.diff",
                      "COPYING", "GPL-2.0", "SOURCE.txt", "build.sha256"]
          missing = [name for name in expected if "kernel/" + name not in files]
          config_path = root / "kernel/linux.config"
          config = set(config_path.read_text().splitlines()) if config_path.exists() else set()
          required = ["CONFIG_SYSVIPC=y", "CONFIG_SYSVIPC_SYSCTL=y", "CONFIG_IPC_NS=y",
                      "CONFIG_ACPI=y", "CONFIG_X86_PM_TIMER=y", "CONFIG_HPET_TIMER=y",
                      "CONFIG_SMP=y", "CONFIG_X86_MPPARSE=y", "CONFIG_X86_LOCAL_APIC=y",
                      "CONFIG_X86_IO_APIC=y", "CONFIG_HZ_PERIODIC=y", "CONFIG_HZ_100=y",
                      "CONFIG_HZ=100", "# CONFIG_HIGH_RES_TIMERS is not set",
                      "# CONFIG_NO_HZ_IDLE is not set", "# CONFIG_NO_HZ_FULL is not set"]
          missing_config = [line for line in required if line not in config]
          hash_path = root / "kernel/build.sha256"
          recorded_hashes = {}
          if hash_path.exists():
              for line in hash_path.read_text().splitlines():
                  digest, name = line.split()
                  recorded_hashes[name] = digest
          hash_names = ["bzImage", "linux.config", "ipc-baseline.config", "acpi.config.diff"]
          hash_manifest_matches = set(recorded_hashes) == {"/out/" + name for name in hash_names} and all(
              recorded_hashes["/out/" + name] == files.get("kernel/" + name, {}).get("sha256")
              for name in hash_names)
          diff_path = root / "kernel/acpi.config.diff"
          diff = diff_path.read_bytes() if diff_path.exists() else b""
          bounded_diff = bool(diff) and len(diff) <= 65536 and len(diff.splitlines()) <= 1024
          success = (os.environ["BUILD_OUTCOME"] == "success" and not missing
                     and not missing_config and hash_manifest_matches and bounded_diff)
          result = {
              "scope": "kernel-only; no VM or service builds",
              "source_commit": os.environ["KERNEL_SOURCE_COMMIT"],
              "recipe_git_blob": os.environ["KERNEL_RECIPE_BLOB"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "linux_source": "830b3c68c1fb1e9176028d02ef86f3cf76aa2476",
              "upstream_config_blob": "48dd1bf6191dd8d0d220358167f52dce36c69c45",
              "build_outcome": os.environ["BUILD_OUTCOME"],
              "missing_files": missing, "missing_config": missing_config,
              "kernel_hash_manifest_matches": hash_manifest_matches,
              "complete_diff_within_output_budget": bounded_diff,
              "kernel_candidate_built": success, "browser_acceptance_verified": False,
              "files": files}
          (root / "metadata.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, sort_keys=True), flush=True)
          if bounded_diff:
              print("resolved_config_diff_begin")
              for line in diff.decode("utf-8").splitlines():
                  print("config_diff: " + line)
              print("resolved_config_diff_end", flush=True)
          if not success:
              raise SystemExit("Kernel-only build or artifact validation failed; retain evidence")
          PY
      - name: Retain the kernel candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-acpi-kernel-candidate
          path: artifacts/browser-acpi-kernel-candidate/
          if-no-files-found: error
          retention-days: 7
