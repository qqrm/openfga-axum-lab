name: Browser lab verification
on:
  pull_request:
  push:
    branches: [main, feature/goal-10-delivery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  devcontainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the official pinned Dev Containers CLI
        run: npm install --prefix "$RUNNER_TEMP/devcontainer-cli" --ignore-scripts @devcontainers/cli@0.90.0
      - name: Build the actual devcontainer and run its startup lifecycle
        run: |
          "$RUNNER_TEMP/devcontainer-cli/node_modules/.bin/devcontainer" up --workspace-folder "$GITHUB_WORKSPACE" --skip-post-attach
          "$RUNNER_TEMP/devcontainer-cli/node_modules/.bin/devcontainer" exec --workspace-folder "$GITHUB_WORKSPACE" bash scripts/codespace-lab.sh verify
          mkdir -p artifacts
          "$RUNNER_TEMP/devcontainer-cli/node_modules/.bin/devcontainer" exec --workspace-folder "$GITHUB_WORKSPACE" curl --fail --silent --max-time 5 http://127.0.0.1:3000/version > artifacts/devcontainer-version.json
      - name: Check restart preserves the demo password and data
        run: |
          "$RUNNER_TEMP/devcontainer-cli/node_modules/.bin/devcontainer" exec --workspace-folder "$GITHUB_WORKSPACE" bash scripts/codespace-lab.sh start
          "$RUNNER_TEMP/devcontainer-cli/node_modules/.bin/devcontainer" exec --workspace-folder "$GITHUB_WORKSPACE" bash scripts/codespace-lab.sh verify
      - name: Remove only the test-owned devcontainer
        if: always()
        run: |
          mapfile -t containers < <(docker ps -aq --filter "label=devcontainer.local_folder=$GITHUB_WORKSPACE")
          if test "${#containers[@]}" -gt 0; then docker rm -f "${containers[@]}"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-lab-evidence
          path: artifacts/devcontainer-version.json
          retention-days: 14
  protected-tunnel:
    # Short authoring proof on this owned branch only; never receives user secrets.
    # PR jobs cannot open a tunnel. No mailbox receives a PIN in this negative test.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/goal-10-delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify a real tunnel denies anonymous access
        env:
          LIVE_LAB_ALLOWED_EMAIL: test@example.invalid
          LIVE_LAB_MINUTES: '1'
        run: |
          LIVE_LAB_PASSWORD=$(cat /proc/sys/kernel/random/uuid)
          export LIVE_LAB_PASSWORD
          echo "::add-mask::$LIVE_LAB_PASSWORD"
          bash scripts/live-lab.sh start
      - name: Exercise bounded session monitoring
        run: bash scripts/live-lab.sh wait
      - name: Close verification session
        if: always()
        run: bash scripts/live-lab.sh stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: protected-tunnel-evidence
          path: artifacts/live-lab.json
          retention-days: 7
