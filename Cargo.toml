[package]
name = "openfga-axum-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
default-run = "openfga-axum-lab"

[[bin]]
name = "lab-tool"
path = "tools/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[features]
default = ["http"]
grpc = ["dep:openfga-client"]
http = []

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = "0.8"
moka = { version = "0.12.16", default-features = false, features = ["future"] }
prometheus = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openfga-client = { version = "0.6", optional = true }
thiserror = "2"
derive_more = { version = "2", features = ["deref", "display"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8", features = ["http2"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http2", "tokio"] }
prost = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process", "time"] }
