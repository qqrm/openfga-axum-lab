<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лапки — приют для вымышленных животных</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1c342d;background:#f5f6ee}body{max-width:960px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}.brand{font-size:1.8rem;font-weight:800}small,.muted{color:#587167}.intro{background:#dcecdf;border-radius:24px;padding:28px;margin:24px 0}h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3.2rem)}.switcher{display:flex;align-items:center;gap:12px;flex-wrap:wrap}select,button{font:inherit;border:1px solid #acc5b6;border-radius:10px;padding:10px;background:white}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:24px}.card{background:white;border:1px solid #e1eae2;border-radius:18px;padding:22px}.icon{font-size:3rem}.card h2{margin:8px 0}#error{color:#a22d2d;white-space:pre-wrap}footer{margin-top:36px}
</style>
</head>
<body>
<header><div class="brand">🐾 Лапки</div><small>Тестовый приют · все персонажи вымышлены</small></header>
<section class="intro"><h1>Здесь живут истории</h1><p>Знакомьтесь с животными и посмотрите, как права меняют доступ к их карточкам.</p></section>
<div class="switcher"><label for="who">Войти как:</label>
<select id="who"><option value="alice">Алиса · администратор</option><option value="bob">Боб · сотрудник приюта</option><option value="carol">Кэрол · владелец Мики</option><option value="dave">Дэйв · читатель Пикселя</option></select>
<button id="refresh">Обновить</button></div>
<p class="muted">Это демонстрационные учётные записи с известными токенами для локального стенда.</p>
<p id="error" role="alert"></p><div id="pets" class="grid"></div>
<footer class="muted">API: GET /pets · Доступ проверяют PostgreSQL и OpenFGA</footer>
<script>
const icons={fox:"🦊",cat:"🐱",dog:"🐶",rabbit:"🐰"};
async function load(){
  const user=document.getElementById("who").value,box=document.getElementById("pets"),error=document.getElementById("error");
  box.replaceChildren();error.textContent="";
  try {
    const response=await fetch("/pets",{headers:{Authorization:"Bearer demo-"+user}});
    if(!response.ok) throw new Error("Сервис вернул HTTP "+response.status);
    const pets=await response.json();
    for(const pet of pets){
      const card=document.createElement("article");card.className="card";
      const icon=document.createElement("div");icon.className="icon";icon.textContent=icons[pet.species]||"🐾";
      const title=document.createElement("h2");title.textContent=pet.name;
      const desc=document.createElement("p");desc.textContent=pet.biography;
      const id=document.createElement("small");id.textContent=pet.species+" · "+pet.id;
      card.append(icon,title,desc,id);box.append(card);
    }
    if(!pets.length) error.textContent="Для этого пользователя нет доступных карточек.";
  } catch(e){error.textContent="Не удалось загрузить карточки: "+e.message}
}
document.getElementById("who").addEventListener("change",load);
document.getElementById("refresh").addEventListener("click",load);
load();
</script>
</body></html>
