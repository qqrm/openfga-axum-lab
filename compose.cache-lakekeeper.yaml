# Disposable companion to compose.yaml; leave the normal application unchanged.
# Use only with COMPOSE_PROJECT_NAME=authz-criterion-<unique>.
services:
  app:
    environment:
      AUTHZ_DENIAL_CACHE_ENABLED: "${BENCH_PRIMARY_CACHE_ENABLED:-true}"
  app-uncached:
    image: openfga-axum-lab:local
    environment:
      DATABASE_URL: postgres://authzlab:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/authzlab?sslmode=disable
      FGA_URL: http://openfga:8080
      FGA_HTTP_URL: http://openfga:8080
      FGA_CONFIG: /data/config.json
      DEMO_SEED: "false"
      DEMO_MIGRATE: "false"
      AUTHZ_DENIAL_CACHE_ENABLED: "${BENCH_SECONDARY_CACHE_ENABLED:-false}"
    depends_on:
      app:
        condition: service_started
    volumes:
      - fga-config:/data:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks: [lab]
