# Only the test databases are published, on ephemeral loopback ports.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${CACHE_TEST_PASSWORD:?set by the Rust test}
    ports:
      - "127.0.0.1::5432"
  fga-migrate:
    environment: &cache-test-database
      OPENFGA_DATASTORE_URI: postgres://petlab:${CACHE_TEST_PASSWORD:?set by the Rust test}@postgres:5432/openfga?sslmode=disable
  openfga:
    environment: *cache-test-database
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::8081"
