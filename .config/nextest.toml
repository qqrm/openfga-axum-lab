[test-groups.docker]
max-threads = 1

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[[profile.ci.overrides]]
filter = 'binary(system) | binary(cache_replicas) | binary(performance) | binary(compose_deployment)'
test-group = 'docker'

[[profile.ci.overrides]]
filter = 'binary(compose_deployment)'
slow-timeout = { period = "60s", terminate-after = 17 }
