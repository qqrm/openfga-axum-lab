[package]
name = "openfga-axum-browser-demo"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the browser dependency-free, without resolving server dependencies.
[workspace]

[lib]
path = "domain_entry.rs"
crate-type = ["cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
missing_docs = "deny"

[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = "symbols"
