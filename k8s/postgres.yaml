apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: openfga-axum-lab
data:
  init.sql: |
    CREATE DATABASE openfga;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: openfga-axum-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-bookworm
          env:
            - name: POSTGRES_USER
              value: petlab
            - name: POSTGRES_PASSWORD
              value: petlab-local-only
            - name: POSTGRES_DB
              value: petlab
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: openfga-axum-lab
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432