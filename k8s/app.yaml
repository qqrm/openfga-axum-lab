apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: openfga-axum-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      initContainers:
        - name: bootstrap
          image: openfga-axum-lab:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/lab-tool", "bootstrap"]
          env:
            - name: FGA_URL
              value: http://openfga:8080
            - name: FGA_CONFIG
              value: /data/config.json
          volumeMounts:
            - name: fga
              mountPath: /app/fga
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: app
          image: openfga-axum-lab:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgres://authzlab:authzlab-local-only@postgres:5432/authzlab?sslmode=disable
            - name: FGA_URL
              value: http://openfga:8080
            - name: FGA_CONFIG
              value: /data/config.json
            - name: DEMO_SEED
              value: "true"
            - name: DEMO_MIGRATE
              value: "true"
            - name: FGA_HTTP_URL
              value: http://openfga:8080
            - name: DEMO_PASSWORD
              value: local-demo-password
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: fga
          configMap:
            name: fga-model
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: openfga-axum-lab
spec:
  selector:
    app: app
  ports:
    - port: 3000
      targetPort: 3000
